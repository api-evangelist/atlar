aid: atlar
name: Atlar
description: >-
  Atlar is a treasury and payment operations platform that centralizes cash
  management, payments, forecasting, bank reconciliation, and debt and investment
  management for finance teams. It connects to banks and ERPs (NetSuite, SAP,
  Dynamics 365, Workday) across 100+ countries and exposes a resource-oriented
  JSON REST API grouped into product namespaces — financial-data (accounts,
  balances, transactions), payments (credit transfers, direct debits,
  counterparties, mandates), connectivity, IAM, analytics/forecasting and
  accounting. The platform is AI-native, offering a hosted MCP server, signed
  webhooks, OAuth 2.0 client-credentials auth, idempotency keys, cursor
  pagination and ETag optimistic concurrency. Atlar is SOC 2 and ISO 27001
  certified. It is headquartered in Stockholm and backed by Index Ventures and
  General Catalyst.
