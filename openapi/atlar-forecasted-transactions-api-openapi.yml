        path:
          type: string
          enum:
          - /description
        value:
          type: string
      additionalProperties: false
      required:
      - op
      - path
      - value
    CountryCode:
      type: string
      description: Two-letter ISO 3166-1 alpha2 country code.
      example: DE
      minLength: 2
      maxLength: 2
      pattern: ^[A-Z]{2,2}$
    ResourceVersion:
      type: integer
      description: 'Resource version. Starts at value `1` when the resource is

