        url: https://jsonpatch.com/
      type: array
      items:
        oneOf:
        - $ref: '#/components/schemas/ForecastedTransactionJSONPatchReplaceAmountValue'
        - $ref: '#/components/schemas/ForecastedTransactionJSONPatchReplaceAmountStringValue'
        - $ref: '#/components/schemas/ForecastedTransactionJSONPatchReplaceAmount'
        - $ref: '#/components/schemas/ForecastedTransactionJSONPatchReplaceDescription'
        - $ref: '#/components/schemas/ForecastedTransactionJSONPatchReplaceDate'
        - $ref: '#/components/schemas/ForecastedTransactionJSONPatchReplaceMetadataKey'
        - $ref: '#/components/schemas/ForecastedTransactionJSONPatchRemoveMetadataKey'
    ForecastedTransactionJSONPatchReplaceAmountValue:
      description: Change the amount.
      type: object
      properties:
        op:
          type: string
          enum:
          - replace
        path:
          type: string
          enum:
          - /amount/value
        value:
          description: The amount value as an integer (int64) represented in currency minor units (e.g. 15.02 EUR is represented as the value 1502).
          example: 1502
          type: integer
          format: int64
      additionalProperties: false
      required:
      - op
      - path
      - value
    ForecastedTransactionJSONPatchReplaceAmountStringValue:
      description: Change the amount.
      type: object
      properties:
        op:
          type: string
          enum:
          - replace
        path:
          type: string
          enum:
          - /amount/stringValue
        value:
          description: A string representation of the amount value, which will be a decimal number if the currency has decimals. The number is not formatted for display purposes (e.g. with thousand separator) and always contains the dot `.` character as decimal separator.
