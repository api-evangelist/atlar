          maxItems: 2000
        externalId:
          $ref: '#/components/schemas/ExternalID'
        skipValidationErrors:
          type: boolean
          description: Skip/ignore input records that contain validation errors.
        metadata:
          $ref: '#/components/schemas/Metadata'
      required:
      - treatment
      - payments
    CreateDirectDebitBatchRequestFormData:
      type: object
      properties:
        treatment:
          $ref: '#/components/schemas/BatchTreatmentType'
        fileContentType:
          $ref: '#/components/schemas/DirectDebitTransferBatchContentType'
        skipValidationErrors:
          type: boolean
          description: Skip/ignore input records that contain validation errors.
        file:
          type: string
          format: binary
        metadata:
          $ref: '#/components/schemas/Metadata'
      required:
      - treatment
      - fileContentType
      - file
    ExternalAccount:
      type: object
      description: An `ExternalAccount` represents an account that does not belong to your organization. A `Counterparty` can have multiple external accounts.
      properties:
        id:
          $ref: '#/components/schemas/ResourceID'
          examples:
          - eac2d761-c984-4072-ae39-018d6e77c24e
        organizationId:
          $ref: '#/components/schemas/OrganizationID'
        counterpartyId:
          example: c151b61e-33cc-4f89-ac8d-328f9efa59e9
          type: string
          description: The ID of the counterparty to which this external account belongs.
