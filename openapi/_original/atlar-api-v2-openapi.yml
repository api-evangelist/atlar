    RegulatoryReportingIndicator:
      type: string
      description: Determines which side of the payment the regulatory reporting code applies to. When making a payment _to_ Thailand, one should supply a `CREDITOR` code (equivalent to iso20022 `CRED`), while making a payment _out of_ Sweden or Norway may require a `DEBTOR` code (equivalent to iso20022 `DEBT`).
      enum:
      - CREDITOR
      - DEBTOR
      - BOTH
      example: CREDITOR
    RegulatoryReportingDetails:
      type: object
      properties:
        market:
          $ref: '#/components/schemas/MarketCode'
        indicator:
          $ref: '#/components/schemas/RegulatoryReportingIndicator'
        code:
          description: The actual code to report. Codes are market-specific and found on https://docs.atlar.com
          type: string
      required:
      - market
      - indicator
      - code
    TaxDetailsType:
      type: string
      description: Type of tax payment scheme.
      enum:
      - PL_MPP
      example: PL_MPP
    TaxDetails:
      type: object
      description: Tax payment details for split payment schemes.
      properties:
        type:
          $ref: '#/components/schemas/TaxDetailsType'
        amount:
          $ref: '#/components/schemas/Amount'
        creditorId:
          type: string
        invoiceNumber:
          type: string
      required:
      - type
      - amount
    ExternalAccountRef:
      type: object
      description: A reference to an External Account.
      properties:
        type:
          $ref: '#/components/schemas/AccountType'
        id:
          type: string
          description: ID or External ID of an External Account. Prefix External IDs with `external:`.
      required:
      - type
      - id
      example:
        type: EXTERNAL_ACCOUNT
        id: 86faeacd-05f0-4836-a86c-51b871e10299
    InternalAccountRef:
      type: object
      description: A reference to an (internal) Account.
      properties:
        type:
          $ref: '#/components/schemas/AccountType'
        id:
          type: string
          description: ID of an (internal) Account.
      required:
      - type
      - id
      examples:
      - type: ACCOUNT
        id: 31d593d7-fff9-4783-aa1d-92acb7b21a19
    InlineExternalAccount:
      type: object
      description: An inline-defined (from the point of the payment) Account. This is used in the context of payment initiation.
      properties:
        type:
          $ref: '#/components/schemas/AccountType'
        market:
          $ref: '#/components/schemas/MarketCode'
        identifiers:
          type: array
          items:
            $ref: '#/components/schemas/AccountIdentifier'
          minItems: 1
          maxItems: 1
          uniqueItems: true
        routing:
          type: array
          items:
            $ref: '#/components/schemas/RoutingIdentifier'
          uniqueItems: true
          maxItems: 2
          x-omitempty: true
        externalId:
          $ref: '#/components/schemas/ExternalID'
          description: Only persisted when an inline destination results in an `ExternalAccount` being created. It is ignored when the destination is stored inline on the payment instruction.
        holder:
          $ref: '#/components/schemas/InlineAccountHolder'
      required:
      - type
      - market
      - identifiers
      - holder
      examples:
      - type: INLINE
        market: DE
        identifiers:
        - type: IBAN
          market: DE
          number: DE89370400440532013000
        holder:
          legalName: Example GmbH
    InlineAccountHolder:
      type: object
      description: Information about the legal holder of an account.
      properties:
        externalId:
          $ref: '#/components/schemas/ExternalID'
          description: Only persisted when an inline destination results in a `Counterparty` being created. It is ignored when the destination is stored inline on the payment instruction.
        legalName:
          type: string
          description: The legal name of the account holder. Some banks, and for some payment schemes, the correctness of the legal name will be validated and payments may be rejected if legal names do not match.
        partyType:
          description: The party type of the account holder.
          $ref: '#/components/schemas/PartyType'
        address:
          description: Postal address of the account holder.
          $ref: '#/components/schemas/Address'
        nationalIdentifier:
          description: The national identifier of the account holder.
          $ref: '#/components/schemas/NationalIdentifier'
        email:
          description: Email of the account holder.
          example: john.smith@example.com
          type: string
          maxLength: 256
      required:
      - legalName
      examples:
      - legalName: Example Company GmbH
        address:
          country: DE
          city: Berlin
          postalCode: '10115'
          streetName: Friedrichstrasse
          streetNumber: '123'
    AccountHolder:
      type: object
      description: Information about the legal holder of an account.
      properties:
        type:
          type: string
          enum:
          - COUNTERPARTY
          - ENTITY
          - INLINE
          readOnly: true
        id:
          type: string
          description: Resource ID of either a `Counterparty` or an `Entity`. Absent when `type` is `INLINE`, since an inline holder refers to no resource.
          readOnly: true
        externalId:
          $ref: '#/components/schemas/ExternalID'
          description: External ID of either a `Counterparty` or an `Entity`.
        legalName:
          type: string
          description: The legal name of the account holder. Some banks, and for some payment schemes, the correctness of the legal name will be validated and payments may be rejected if legal names do not match.
          readOnly: true
        address:
          description: Postal address of the account holder.
          $ref: '#/components/schemas/Address'
          readOnly: true
        nationalIdentifier:
          description: The national identifier of the account holder.
          $ref: '#/components/schemas/NationalIdentifier'
          readOnly: true
        partyType:
          description: The party type of the account holder.
          $ref: '#/components/schemas/PartyType'
          readOnly: true
        email:
          description: Email of the account holder.
          example: john.smith@example.com
          type: string
          readOnly: true
      required:
      - type
      - legalName
      examples:
      - type: ENTITY
        id: 29a4555b-99b2-4de7-9062-47c8ebc03f56
        legalName: Example Company GmbH
        address:
          country: DE
          city: Munich
          postalCode: '123456'
      - type: COUNTERPARTY
        id: f3efbb73-4e5b-4b22-adeb-918bbf1dfbd8
        legalName: John Smith
        address:
          country: US
          city: New York
          postalCode: '123456'
    AccountSnapshot:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/AccountType'
        id:
          description: ID of the (internal) Account.
          $ref: '#/components/schemas/ResourceID'
        organizationId:
          $ref: '#/components/schemas/OrganizationID'
        market:
          $ref: '#/components/schemas/MarketCode'
          readOnly: true
        identifiers:
          type: array
          items:
            $ref: '#/components/schemas/AccountIdentifier'
          minItems: 1
          uniqueItems: true
          readOnly: true
        routing:
          type: array
          items:
            $ref: '#/components/schemas/RoutingIdentifier'
          uniqueItems: true
          maxItems: 5
          readOnly: true
        currency:
          $ref: '#/components/schemas/CurrencyCode'
          readOnly: true
      required:
      - type
      - id
      - organizationId
      - market
      - currency
      - identifiers
      - routing
      examples:
      - id: ac1963d7-fff9-4783-aa1d-92acb7b21a19
        type: ACCOUNT
        organizationId: 0160f6ab-5741-49e1-af46-9138927e547e
        market: DE
        currency: EUR
        identifiers:
        - market: DE
          type: IBAN
          number: DE89370400440532013000
        routing:
        - type: BIC
          number: COBADEFFXXX
    ExternalAccountSnapshot:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/AccountType'
          readOnly: true
        id:
          description: ID of the External Account.
          $ref: '#/components/schemas/ResourceID'
        externalId:
          $ref: '#/components/schemas/ExternalID'
          description: External ID of the External Account.
        organizationId:
          $ref: '#/components/schemas/OrganizationID'
        market:
          $ref: '#/components/schemas/MarketCode'
          readOnly: true
        identifiers:
          type: array
          items:
            $ref: '#/components/schemas/AccountIdentifier'
          minItems: 1
          uniqueItems: true
          readOnly: true
        routing:
          type: array
          items:
            $ref: '#/components/schemas/RoutingIdentifier'
          uniqueItems: true
          readOnly: true
          x-omitempty: true
      required:
      - type
      - id
      - organizationId
      - market
      - identifiers
      example:
        id: 31d593d7-fff9-4783-aa1d-92acb7b21a19
        organizationId: 605e26fc-4fce-495a-a92f-2c3592d7287e
        market: GB
        type: EXTERNAL_ACCOUNT
        identifiers:
        - type: IBAN
          market: GB
          number: GB33BUKB20201555555555
        routing:
        - type: BIC
          number: BUKBGB22XXX
    InlineExternalAccountSnapshot:
      type: object
      description: A destination account that was defined inline on the payment instruction. It does not refer to an `ExternalAccount` or any other resource, and therefore has no `id`.
      properties:
        type:
          $ref: '#/components/schemas/AccountType'
          readOnly: true
        organizationId:
          $ref: '#/components/schemas/OrganizationID'
        market:
          $ref: '#/components/schemas/MarketCode'
          readOnly: true
        identifiers:
          type: array
          items:
            $ref: '#/components/schemas/AccountIdentifier'
          minItems: 1
          uniqueItems: true
          readOnly: true
        routing:
          type: array
          items:
            $ref: '#/components/schemas/RoutingIdentifier'
          uniqueItems: true
          readOnly: true
          x-omitempty: true
      required:
      - type
      - organizationId
      - market
      - identifiers
      example:
        organizationId: 605e26fc-4fce-495a-a92f-2c3592d7287e
        market: GB
        type: INLINE
        identifiers:
        - type: IBAN
          market: GB
          number: GB33BUKB20201555555555
        routing:
        - type: BIC
          number: BUKBGB22XXX
    PaymentReference:
      type: string
      description: This reference will be sent to the destination bank and recipient. (This type of reference is sometimes also referred to as remittance information.)
      maxLength: 140
    BatchTreatmentType:
      type: string
      deprecated: true
      description: 'Deprecated: You can approve or reject on batch and individual level regardless of the treatment type.

        '
      enum:
      - INDIVIDUAL_PAYMENTS
      - BATCH
      example: INDIVIDUAL_PAYMENTS
    PaymentApprovalStep:
      type: object
      properties:
        id:
          description: The ID of this step. Used when approving/rejecting.
          example: 735c7b8c-ef29-456a-8caf-113be117d131
          type: string
          readOnly: true
        approvalChainId:
          description: The ID of the approval chain that triggered this approval step.
          type: string
          readOnly: true
        requiredRoleIds:
          type: array
          description: IDs of the Roles that can approve/reject. Not specified if the step was automatically approved based on an auto-approval chain.
          items:
            type: string
          maxItems: 10
          uniqueItems: true
          readOnly: true
          x-omitempty: true
        status:
          description: The status of the approval step. `PENDING` if step is not yet interacted with.
          $ref: '#/components/schemas/ApprovalStatus'
          readOnly: true
        approver:
          description: User information about the user who approved/rejected. Omitted if step is not yet approved/rejected.
          $ref: '#/components/schemas/UserAuditInfo'
          readOnly: true
        updated:
          description: Timestamp when approved/rejected. Omitted if the step is not yet approved/rejected.
          type: string
          format: date-time
          readOnly: true
        autoApproved:
          type: boolean
        allowCreatorApproval:
          description: Allow approval by the user creating this resource if they have the role required for this step. By default, this is not allowed to conform with a four-eyes principle where approval by another person is required.
          type: boolean
          readOnly: true
        sequentialApproval:
          type: boolean
          description: If true, the approval steps for this approval chain, specified by `approvalChainId`, need to be approved in the the order specified by `sequenceNumber`.
          readOnly: true
        sequenceNumber:
          type: integer
          description: The sequence number of this step in the approval chain.
          readOnly: true
      required:
      - id
      - status
      - approvalChainId
      - autoApproved
    ApprovalStatus:
      type: string
      description: The status of the approval step.
      enum:
      - PENDING
      - APPROVED
      - REJECTED
      examples:
      - APPROVED
    UserAuditInfo:
      type: object
      description: User information for audit trail.
      properties:
        id:
          $ref: '#/components/schemas/ResourceID'
          description: User ID
          example: 54528335-739e-4de9-bdb3-28f96c98785d
        username:
          type: string
          example: john.smith@example.com
          readOnly: true
        name:
          type: string
          description: User given name(s) information. May be a concatenation of firstname, lastname etc.
          example: John Smith
          readOnly: true
        roleId:
          type: string
          description: Role ID
          example: 2a1e16eb-2f83-4597-99e2-cffbc4311df2
          readOnly: true
      required:
      - id
      - username
    PaymentStatus:
      description: Status of a payment. Applicable to both credit transfer payments and direct debit payments.
      type: string
      enum:
      - CREATED
      - APPROVED
      - REJECTED
      - PENDING_SUBMISSION
      - SENT
      - PENDING_AT_BANK
      - ACCEPTED
      - EXECUTED
      - FAILED
      - RETURNED
      - UNKNOWN
      example: SENT
    PaymentStatusReason:
      description: Reason for the status of a payment.
      type: object
      externalDocs:
        url: https://docs.atlar.com/docs/errors-return-reasons
      properties:
        code:
          description: Failure reason code. If present, this is a <a href="https://www.iso20022.org/catalogue-messages/additional-content-messages/external-code-sets">ISO 20022 error code</a>.
          type: string
          readOnly: true
          examples:
          - DS02
          - DS24
        description:
          description: Human readable description of the reason. Can be presented to an end-user.
          type: string
          readOnly: true
      examples:
      - code: DS02
        description: EBICS VEU/EDS signature cancelled by user
      - code: DS24
        description: Waiting time for EBICS VEU/EDS signature expired
    AttachedTransactionRef:
      type: object
      description: An association between a _transactable_ payment resource, e.g. a _Credit Transfer_, _Direct Debit_, or _Expected Transaction_, and an account _Transaction_.
      properties:
        type:
          type: string
          description: The resource type of the attached transaction
          enum:
          - TRANSACTION
          readOnly: true
        id:
          type: string
          description: ID of the attached transaction resource.
          readOnly: true
      examples:
      - type: TRANSACTION
        id: 27abf7cb-3867-4119-bfa7-ee3fb667ecf3
      required:
      - type
      - id
    CreditTransfer:
      type: object
      properties:
        id:
          description: ID of the credit transfer.
          $ref: '#/components/schemas/ResourceID'
          example: 76992987-48fc-4b03-b609-ea6fdc3045b4
        organizationId:
          $ref: '#/components/schemas/OrganizationID'
        creatorUserId:
          $ref: '#/components/schemas/ResourceID'
          description: ID of the user that created the credit transfer.
          readOnly: true
        amount:
          $ref: '#/components/schemas/Amount'
          readOnly: true
        scheme:
          $ref: '#/components/schemas/CreditTransferSchemeType'
          readOnly: true
        schemeDetails:
          $ref: '#/components/schemas/SchemeDetails'
          readOnly: true
        date:
          description: Requested payment execution date.
          $ref: '#/components/schemas/Date'
          example: '2022-05-07'
          readOnly: true
        status:
          $ref: '#/components/schemas/PaymentStatus'
          readOnly: true
        statusReason:
          $ref: '#/components/schemas/PaymentStatusReason'
          readOnly: true
        source:
          $ref: '#/components/schemas/AccountSnapshot'
          description: Source account from which funds will be withdrawn. This account will be debited.
          readOnly: true
        sourceHolder:
          $ref: '#/components/schemas/AccountHolder'
          readOnly: true
        destination:
          description: Destination account to which funds will be sent. This account will be credited.
          oneOf:
          - $ref: '#/components/schemas/ExternalAccountSnapshot'
          - $ref: '#/components/schemas/AccountSnapshot'
          - $ref: '#/components/schemas/InlineExternalAccountSnapshot'
          discriminator:
            propertyName: type
            mapping:
              ACCOUNT: '#/components/schemas/AccountSnapshot'
              EXTERNAL_ACCOUNT: '#/components/schemas/ExternalAccountSnapshot'
              INLINE: '#/components/schemas/InlineExternalAccountSnapshot'
          readOnly: true
        destinationHolder:
          $ref: '#/components/schemas/AccountHolder'
          readOnly: true
        approvalSteps:
          type: array
          items:
            $ref: '#/components/schemas/PaymentApprovalStep'
          readOnly: true
        attachedTransactions:
          type: array
          items:
            $ref: '#/components/schemas/AttachedTransactionRef'
          readOnly: true
        reference:
          $ref: '#/components/schemas/PaymentReference'
        referenceType:
          $ref: '#/components/schemas/RemittanceType'
          description: The reference type requested at creation time, if any.
          readOnly: true
        categoryPurpose:
          $ref: '#/components/schemas/CategoryPurpose'
        chargeBearer:
          $ref: '#/components/schemas/ChargeBearer'
        regulatoryReporting:
          type: array
          x-omitempty: true
          items:
            $ref: '#/components/schemas/RegulatoryReportingDetails'
          maxItems: 10
          readOnly: true
        taxDetails:
          description: Tax payment details for split payment schemes like Polish MPP.
          $ref: '#/components/schemas/TaxDetails'
          readOnly: true
        connectionInstructionId:
          type: string
          description: The ID of the instruction that was sent to the bank in which this credit transfer was included when it was created.
          example: c1d6502c-07c7-4c77-bee5-963f9464c7d8
          readOnly: true
        batch:
          description: Details of the associated payments batch if the credit transfer was created as part of a batch.
          $ref: '#/components/schemas/BatchDetails'
        paymentScheduleId:
          description: ID of the payment schedule associated with this credit transfer.
          $ref: '#/components/schemas/ResourceID'
        etag:
          $ref: '#/components/schemas/ETag'
        externalId:
          $ref: '#/components/schemas/ExternalID'
          readOnly: true
        metadata:
          $ref: '#/components/schemas/Metadata'
          readOnly: true
        version:
          $ref: '#/components/schemas/ResourceVersion'
        created:
          $ref: '#/components/schemas/CreatedTimestamp'
        updated:
          $ref: '#/components/schemas/UpdatedTimestamp'
      required:
      - id
      - organizationId
      - amount
      - scheme
      - date
      - status
      - source
      - sourceHolder
      - destination
      - destinationHolder
      - reference
      - approvalSteps
      - version
      - etag
      - created
      - updated
      - attachedTransactions
    CreditTransferDestination:
      description: A reference identifying the destination account. Can be either an internal or an external account.
      oneOf:
      - $ref: '#/components/schemas/InternalAccountRef'
      - $ref: '#/components/schemas/ExternalAccountRef'
      - $ref: '#/components/schemas/InlineExternalAccount'
      discriminator:
        propertyName: type
        mapping:
          ACCOUNT: '#/components/schemas/InternalAccountRef'
          EXTERNAL_ACCOUNT: '#/components/schemas/ExternalAccountRef'
          INLINE: '#/components/schemas/InlineExternalAccount'
    BatchDetails:
      type: object
      properties:
        id:
          description: ID of the batch.
          $ref: '#/components/schemas/ResourceID'
        treatment:
          $ref: '#/components/schemas/BatchTreatmentType'
      required:
      - id
      - treatment
    CreateCreditTransferRequest:
      type: object
      properties:
        amount:
          $ref: '#/components/schemas/AmountInput'
        scheme:
          $ref: '#/components/schemas/CreditTransferSchemeType'
        schemeDetails:
          $ref: '#/components/schemas/SchemeDetailsInput'
        date:
          description: Requested payment execution date. It is a local date from the source account's point-of-view. Cannot be set to before the current date, and not more than 60 days into the future.
          $ref: '#/components/schemas/Date'
          example: '2022-05-07'
        source:
          description: A reference identifying the source account (as found from `/financial-data/v2/accounts`).
          $ref: '#/components/schemas/InternalAccountRef'
        destination:
          $ref: '#/components/schemas/CreditTransferDestination'
        reference:
          $ref: '#/components/schemas/PaymentReference'
        referenceType:
          $ref: '#/components/schemas/RemittanceType'
          description: 'Optional hint about how `reference` should be carried toward

            the destination bank. If the payment scheme supports the

            requested type Atlar will comply; otherwise Atlar may ignore

            the hint and pick the appropriate carrier for the scheme.

            Omitting this field lets Atlar choose per scheme.

            '
        categoryPurpose:
          $ref: '#/components/schemas/CategoryPurpose'
        chargeBearer:
          $ref: '#/components/schemas/ChargeBearer'
        regulatoryReporting:
          description: Regulatory reporting can be used to provide additional information when needed due to regulatory and statutory requirements.
          type: array
          maxItems: 10
          x-omitempty: true
          items:
            $ref: '#/components/schemas/RegulatoryReportingDetails'
        taxDetails:
          description: Tax payment details for split payment schemes like Polish MPP (Mechanizm Podzielonej Płatności). When specified and supported, the bank will automatically route the tax amount to the vendor's VAT account.
          $ref: '#/components/schemas/TaxDetailsInput'
        externalId:
          $ref: '#/components/schemas/ExternalID'
        metadata:
          $ref: '#/components/schemas/Metadata'
        paymentScheduleId:
          description: ID of the payment schedule to associate with this credit transfer. Defaults to the organization's default schedule.
          $ref: '#/components/schemas/ResourceID'
      required:
      - amount
      - scheme
      - date
      - source
      - destination
      - reference
    CitiWorldlinkInstrumentInput:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/InstrumentType'
      required:
      - type
    InstrumentInput:
      type: object
      oneOf:
      - $ref: '#/components/schemas/CitiWorldlinkInstrumentInput'
      discriminator:
        propertyName: type
        mapping:
          CITI_WORLDLINK: '#/components/schemas/CitiWorldlinkInstrumentInput'
    SchemeDetailsInput:
      type: object
      properties:
        instrument:
          $ref: '#/components/schemas/InstrumentInput'
        intraCompany:
          type: boolean
          description: Whether the payment is between companies within the same group.
        urgency:
          $ref: '#/components/schemas/SchemeDetailsUrgency'
    TaxDetailsInput:
      type: object
      description: Tax payment details for split payment schemes like Polish MPP (Mechanizm Podzielonej Płatności).
      properties:
        type:
          $ref: '#/components/schemas/TaxDetailsType'
        amount:
          description: Tax amount to be remitted to the tax authority or VAT account.
          $ref: '#/components/schemas/AmountInput'
        creditorId:
          type: string
          description: Tax identification number (NIP) of the creditor/vendor. In Poland, for example, it must be exactly 10 digits.
          example: '1234567890'
        invoiceNumber:
          type: string
          maxLength: 140
          description: Invoice or document reference number.
          example: FV/2024/001
      required:
      - type
      - amount
    CreditTransferJSONPatchRequest:
      description: JSON Patch request to update a credit transfer.
      externalDocs:
        url: https://jsonpatch.com/
      type: array
      items:
        oneOf:
        - $ref: '#/components/schemas/PaymentJSONPatchReplaceDate'
        - $ref: '#/components/schemas/PaymentJSONPatchReplaceStatus'
        - $ref: '#/components/schemas/PaymentJSONPatchReplaceStatusReasonCode'
        - $ref: '#/components/schemas/PaymentJSONPatchReplaceAttachedTransactions'
    PaymentJSONPatchReplaceAttachedTransactions:
      description: Change the attached transactions of a payment.
      type: object
      properties:
        op:
          type: string
          enum:
          - replace
        path:
          type: string
          enum:
          - /attachedTransactions
        value:
          type: array
          items:
            $ref: '#/components/schemas/AttachedTransactionRef'
      required:
      - op
      - path
      - value
    PaymentJSONPatchReplaceDate:
      description: Change payment execution date.
      type: object
      properties:
        op:
          type: string
          enum:
          - replace
        path:
          type: string
          enum:
          - /date
        value:
          $ref: '#/components/schemas/Date'
          example: '2022-05-08'
      additionalProperties: false
      required:
      - op
      - path
      - value
    PaymentJSONPatchReplaceStatus:
      description: Change payment status. This is forcing a status change and is by-passing the standard Atlar payment state/status machine.
      type: object
      properties:
        op:
          type: string
          enum:
          - replace
        path:
          type: string
          enum:
          - /status
        value:
          $ref: '#/components/schemas/PaymentStatus'
          example: RETURNED
      additionalProperties: false
      required:
      - op
      - path
      - value
    PaymentJSONPatchReplaceStatusReasonCode:
      description: Set payment status reason (code). This can only be used toghether with `replace` path `/status`.
      externalDocs:
        url: https://www.iso20022.org/catalogue-messages/additional-content-messages/external-code-sets
      type: object
      properties:
        op:
          type: string
          enum:
          - replace
        path:
          type: string
          enum:
          - /statusReason/code
        value:
          type: string
          description: A ISO 20022 status reason code in the <a href="https://www.iso20022.org/catalogue-messages/additional-content-messages/external-code-sets">external code set</a> _ExternalStatusReason1Code_.
          minLength: 4
          maxLength: 4
      additionalProperties: false
      required:
      - op
      - path
      - value
    ApprovePaymentRequest:
      type: object
      properties:
        approvalStepId:
          type: string
          description: The id of the approval step to be approved.
      required:
      - approvalStepId
      examples:
      - approvalStepId: 52699442-e06f-4cda-b2a8-cdeca08ff9d3
    RejectPaymentRequest:
      type: object
      properties:
        reason:
          type: string
          description: An optional rejection reason that will propagate to the reject event on the payment.
          maxLength: 255
      examples:
      - reason: This has been classified as a fraudulent payment
    BatchAmountSums:
      type: array
      description: 'The total amount sum per each currency of resources in this batch.


        Note that batch amount sums reported on the batch input metadata

        refer to the total amount sums of the input records (resources)

        while the batch amount sums reported on the batch result refer

        to the total amount sums of the successfully processed records (resources).

        This means that there may be a difference in the total sum for the input

        vs the result, due to skipped records (resources).

        '
      items:
        $ref: '#/components/schemas/Amount'
      readOnly: true
    BatchInputContent:
      description: Metadata describing the input contents that was used to create this batch.
      type: object
      readOnly: true
      properties:
        contentType:
          type: string
        recordCount:
          type: integer
          description: Total count of input records (resources) in the input batch.
          readOnly: true
        size:
          type: integer
          format: int64
          description: 'The size of the input content in bytes.


            If the batch was created by uploading a file using `multipart/form-data` the `contentSize` will be the file size.


            If the batch was created with JSON input this will be the raw JSON size.

            '
          example: 4711
        checksum:
          type: string
          description: 'A checksum of the batch input contents.


            The checksum digest value will be prefixed by an

            identifier of the hash algorithm used, e.g. `sha256`. A

            colon `:` is used as separator between the algorithm

            identifier and the digest value.

            '
          example: sha256:08343d976a896e8563b4915c84878207199b5fa139d3edde1bd77d99339bd18c
        filename:
          type: string
          description: 'The name of the file that was used as input to create the batch.


            Filename will only available if the batch input was provided using `multipart/form-data`.

            '
          example: batch-2022-05-07.csv
      required:
      - recordCount
      - contentType
      - size
      - checksum
    BatchErrors:
      description: A list of error details if the batch failed. Only populated once the batch has reached status `COMPLETED`. Only the first 255 errors (if any) will be present in this list. If there are more errors, the complete list can be retrieved using the results endpoint for the batch.
      type: array
      items:
        $ref: '#/components/schemas/ErrorDetails'
      maxItems: 255
    BatchResultSummary:
      description: Aggregate summary of batch processing results.
      type: object
      properties:
        total:
          type: integer
          description: Number of input records that were attempted to be processed.
        succeeded:
          type: integer
          description: Number of input records that resulted in a successfully created resource.
        failed:
          type: integer
          description: Number of failed records.
        skipped:
          type: integer
          description: Number of input records that were skipped.
      required:
      - total
      - succeeded
      - failed
      - skipped
    BatchStatus:
      type: string
      description: 'The status of this batch. The status only refers to the

        processing of the input, not the processing or success of

        the resources themselves.


        `COMPLETED` is the only end-state. Failure is indicated by a non-empty list of `errors`.

        '
      example: COMPLETED
      enum:
      - CREATED
      - PROCESSING_STARTED
      - COMPLETED
    BatchResultsSummary:
      description: Aggregate summary of payment batch processing results.
      type: object
      properties:
        total:
          type: integer
          description: Deprecated. Moved to `processed`. Number of input records that were attempted to be processed.
        succeeded:
          type: integer
          description: Deprecated. Moved to `processed`. Number of input records that resulted in a successfully created payment.
        failed:
          type: integer
          description: Deprecated. Moved to `processed`. Number of failed records.
        skipped:
          type: integer
          description: Deprecated. Moved to `processed`. Number of input records that were skipped.
        processed:
          $ref: '#/components/schemas/BatchResultSummary'
        sums:
          $ref: '#/components/schemas/BatchAmountSums'
      required:
      - total
      - succeeded
      - failed
      - skipped
      - processed
      - sums
    PaymentBatch:
      type: object
      properties:
        id:
          description: ID of the batch.
          $ref: '#/components/schemas/ResourceID'
          example: e284485b-e41b-4237-a115-5a02507eacec
        organizationId:
          $ref: '#/components/schemas/OrganizationID'
        treatment:
          $ref: '#/components/schemas/BatchTreatmentType'
        input:
          description: Deprecated - use `inputDetails` and `inputContent`.
          $ref: '#/components/schemas/BatchInputMetadata'
          x-atlar-fields-enum-skip: true
        inputContent:
          $ref: '#/components/schemas/BatchInputContent'
        inputDetails:
          description: 'Summary of the batch input: amount totals per currency (`sums`) and optional date

            range across requested execution dates.'
          $ref: '#/components/schemas/PaymentBatchDetails'
        results:
          description: 'Deprecated - use `resultSummary` and `resultDetails`. Summary of processing results.


            The summary is only populated when the batch `status` is `COMPLETED`.


            Detailed processing results can be retrieved using

            https://docs.atlar.com/v2.0/reference/get_payments-v2beta-credit-transfer-batches-id-results.

            '
          $ref: '#/components/schemas/BatchResultsSummary'
          readOnly: true
          x-atlar-fields-enum-skip: true
        resultSummary:
          description: 'Counts of how input records were processed (total / succeeded / failed / skipped).

            Only populated when the batch `status` is `COMPLETED`.'
          $ref: '#/components/schemas/BatchResultSummary'
        resultDetails:
          description: 'Amount totals per currency for successfully processed payments in the batch.

            Only populated when the batch `status` is `COMPLETED`. May differ from

            `inputDetails.sums` when records were skipped.'
          $ref: '#/components/schemas/PaymentBatchDetails'
        status:
          $ref: '#/components/schemas/BatchStatus'
          readOnly: true
        errors:
          $ref: '#/components/schemas/BatchErrors'
        approvalSteps:
          deprecated: true
          x-deprecated-reason: Batch-level approval steps are no longer populated. Use the approval steps on each payment. This field will be removed in the future.
          description: 'Batch approval steps, including who approved or rejected (`approver`), step

            `status`, and `requiredRoleIds`.


            Approval steps will only be available once the batch

            `status` is `COMPLETED`. I.e. no action must be taken

            based on the absence of approval steps (empty array).

            '
          type: array
          items:
            $ref: '#/components/schemas/PaymentApprovalStep'
          readOnly: true
        externalId:
          $ref: '#/components/schemas/ExternalID'
        approvalResults:
          description: Counts of fully approved vs rejected payments in this batch.
          $ref: '#/components/schemas/ApprovalResults'
        creatorUserId:
          $ref: '#/components/schemas/ResourceID'
          description: ID of the user that created the batch.
          readOnly: true
        sourceAccountIds:
          type: array
          description: IDs of the accounts that the payments in this batch are initiated from.
          items:
            $ref: '#/components/schemas/ResourceID'
          uniqueItems: true
          readOnly: true
          x-omitempty: true
        metadata:
          $ref: '#/components/schemas/Metadata'
        etag:
          $ref: '#/components/schemas/ETag'
        version:
          $ref: '#/components/schemas/ResourceVersion'
        created:
          $ref: '#/components/schemas/CreatedTimestamp'
        updated:
          $ref: '#/components/schemas/UpdatedTimestamp'
      required:
      - treatment
      - id
      - organizationId
      - etag
      - status
      - version
      - created
      - updated
      - input
      - inputContent
      - inputDetails
      - approvalSteps
      - approvalResults
    ApprovalResults:
      type: object
      properties:
        approved:
          type: integer
          description: Number of fully approved credit transfers.
        rejected:
          type: integer
          description: Number of rejected credit transfers.
      required:
      - approved
      - rejected
    CreditTransferBatchContentType:
      type: string
      description: 'The content type of the batch.


        See https://docs.atlar.com/docs/batch-payments#csv-format for details on the CSV format for credit transfer batches.'
      enum:
      - application/vnd.atlar.payments.v2.credit-transfer.batch+csv
      - application/vnd.atlar.payments.v2.credit-transfer.batch+json
      example: application/vnd.atlar.payments.v2.credit-transfer.batch+csv
    CreateCreditTransferBatchRequest:
      type: object
      properties:
        treatment:
          $ref: '#/components/schemas/BatchTreatmentType'
        payments:
          type: array
          items:
            $ref: '#/components/schemas/CreateCreditTransferRequest'
          minItems: 1
          maxItems: 2000
        externalId:
          $ref: '#/components/schemas/ExternalID'
        skipValidationErrors:
          type: boolean
          description: Skip/ignore input records that contain validation errors.
        metadata:
          $ref: '#/components/schemas/Metadata'
      required:
      - treatment
      - payments
    CreateCreditTransferBatchRequestFormData:
      type: object
      properties:
        treatment:
          $ref: '#/components/schemas/BatchTreatmentType'
        fileContentType:
          $ref: '#/components/schemas/CreditTransferBatchContentType'
        skipValidationErrors:
          type: boolean
          description: Skip/ignore input records that contain validation errors.
        file:
          type: string
          format: binary
        metadata:
          $ref: '#/components/schemas/Metadata'
      required:
      - treatment
      - fileContentType
      - file
    PaymentBatchDetails:
      description: Details summarizing the contents of the batch — primarily amount totals per currency.
      type: object
      properties:
        sums:
          description: 'Total amount sum per currency for the payments covered by this details object

            (input records when under `inputDetails`, successfully processed payments when

            under `resultDetails`).'
          $ref: '#/components/schemas/BatchAmountSums'
      required:
      - sums
    BatchInputMetadata:
      description: Metadata describing the original input that was used to create a payments batch.
      type: object
      properties:
        recordCount:
          type: integer
          description: Deprecated. Has moved into `content`. Total count of input records (payments) in the input batch.
          readOnly: true
        sums:
          $ref: '#/components/schemas/BatchAmountSums'
        content:
          $ref: '#/components/schemas/BatchInputContent'
      required:
      - recordCount
      - sums
      - content
    BatchResult:
      description: 'Result of processing an individual payment request as part of

        a batch request.

        '
      type: object
      properties:
        paymentId:
          description: 'ID of the payment (a credit transfer or direct debit

            resource). Present if the result represent the successful

            creation of a credit transfer or direct debit resource.

            '
          type: string
          $ref: '#/components/schemas/ResourceID'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetails'
            minItems: 0
          x-omitempty: true
        skipped:
          description: 'Indicates whether a given payment request was skipped when

            processed as part of a batch.

            '
          type: boolean
        recordIndex:
          description: '0-based index specifying which record in the batch input that

            this result is associated with. If the batch input was a

            CSV file the `recordIndex` will refer to rows (lines) in

            the file. If the batch input was JSON it will refer to

            JSON array indicies.


            If the error(s) are not directly related to a specific

            record/row/line the `recordIndex` will not be present.

            '
          type: integer
        externalId:
          $ref: '#/components/schemas/ExternalID'
          description: External ID of the payment, if any.
      examples:
      - paymentId: a0285f2e-f0c8-11ee-bae7-aa94e258a7ae
        recordIndex: 1
      - errors:
        - error: Account not found
          field: file.123.source.id
          code: account_not_found
        recordIndex: 123
      - skipped: true
        errors:
        - error: Invalid account number type
          field: file.456.destination.identifiers.0.type
          code: invalid_accountnumber_type_for_market
        recordIndex: 456
      - errors:
        - error: General processing failure
    ApproveBatchRequest:
      type: object
      properties:
        approvalStepId:
          type: string
          description: The id of the approval step to be approved.
      required:
      - approvalStepId
      examples:
      - approvalStepId: 2cf21abd-afab-4a3c-a0e8-c973ec8181f2
    DirectDebitSchemeType:
      type: string
      description: "Direct debit payment scheme. Choose among: <ul>\n  <li><code>SDD_CORE</code> (<a\nhref=\"https://www.europeanpaymentscouncil.eu/what-we-do/epc-payment-schemes/sepa-direct-debit/sepa-direct-debit-core-rulebook-and-implementation\">SEPA Direct Debit Core</a>)</li>\n  <li><code>SDD_B2B</code> (<a\nhref=\"https://www.europeanpaymentscouncil.eu/what-we-do/epc-payment-schemes/sepa-direct-debit/sepa-direct-debit-b2b-rulebook-and-implementation\">SEPA Direct Debit B2B</a>)</li>\n  <li><code>GB_DD_BACS</code> (UK <a href=\"https://www.bacs.co.uk\">BACS</a> Direct Debit)</li>\n  <li><code>AUTOGIRO</code> (Swedish <a href=\"https://www.bankgirot.se/autogiro\">Bg AutoGiro</a>)</li>\n  <li><code>CH_DD_LSV</code> (Swiss <a href=\"https://www.six-group.com/en/products-services/banking-services/billing-and-payments/direct-debits.html\">Direct Debit LSV+</a>)</li>\n  <li><code>CH_DD_BDD</code> (Swiss <a href=\"https://www.six-group.com/en/products-services/banking-services/billing-and-payments/direct-debits.html\"\
        >Direct Debit BDD</a>)</li>\n  <li><code>US_DD_ACH</code> (US ACH Direct Debit)</li>\n</ul>"
      enum:
      - SDD_CORE
      - SDD_B2B
      - GB_DD_BACS
      - AUTOGIRO
      - CH_DD_LSV
      - CH_DD_BDD
      - US_DD_ACH
      example: SDD_CORE
    MandateSnapshot:
      type: object
      description: Mandate information about the mandate to be used for a Direct Debit. This mandate data is a snapshot of the state of the mandate at the time when the Direct Debit was created.
      properties:
        id:
          description: The unique identifier of this mandate.
          $ref: '#/components/schemas/ResourceID'
          example: be7e04fe-3fa0-48f5-a993-2008409255f2
        creditorReference:
          description: The customer number that you have received from the bank.
          type: string
        mandateReference:
          type: string
          description: A unique reference to the mandate that you have signed with the debtor.
          minLength: 1
          maxLength: 35
        finalCollection:
          type: boolean
          readOnly: true
          description: 'Whether to consider this Direct Debit collection the final one for this mandate.

            This field is set automatically by the Atlar platform if the mandate has been cancelled prior to the creation of the Direct Debit.

            This field only affects certain direct debit schemes (e.g. SEPA DDs),

            where the bank is notified about the mandate cancellation in relation to the final collection.

            '
        signatureDate:
          description: The date that this mandate was signed by the end user.
          $ref: '#/components/schemas/Date'
          examples:
          - '2022-08-01'
        version:
          $ref: '#/components/schemas/ResourceVersion'
      required:
      - id
      - creditorReference
      - mandateReference
      - finalCollection
      - version
    DirectDebit:
      type: object
      properties:
        id:
          description: ID of the direct debit.
          $ref: '#/components/schemas/ResourceID'
          example: 76992987-48fc-4b03-b609-ea6fdc3045b4
        organizationId:
          $ref: '#/components/schemas/OrganizationID'
        creatorUserId:
          $ref: '#/components/schemas/ResourceID'
          description: ID of the user that created the direct debit.
          readOnly: true
        amount:
          $ref: '#/components/schemas/Amount'
          readOnly: true
        scheme:
          $ref: '#/components/schemas/DirectDebitSchemeType'
          readOnly: true
        schemeDetails:
          $ref: '#/components/schemas/SchemeDetails'
          readOnly: true
        date:
          description: Requested payment execution date.
          $ref: '#/components/schemas/Date'
          example: '2022-05-07'
          readOnly: true
        status:
          $ref: '#/components/schemas/PaymentStatus'
          readOnly: true
        statusReason:
          $ref: '#/components/schemas/PaymentStatusReason'
          readOnly: true
        destination:
          description: Destination account which will receive funds. This account will be credited.
          $ref: '#/components/schemas/AccountSnapshot'
          readOnly: true
        destinationHolder:
          $ref: '#/components/schemas/AccountHolder'
          readOnly: true
        source:
          description: Source account from which funds will be collected. This account will be debited.
          $ref: '#/components/schemas/ExternalAccountSnapshot'
          readOnly: true
        sourceHolder:
          $ref: '#/components/schemas/AccountHolder'
          readOnly: true
        mandate:
          description: The mandate which represents the end user's consent to executing this direct debit.
          $ref: '#/components/schemas/MandateSnapshot'
          readOnly: true
        approvalSteps:
          type: array
          items:
            $ref: '#/components/schemas/PaymentApprovalStep'
          readOnly: true
        attachedTransactions:
          type: array
          items:
            $ref: '#/components/schemas/AttachedTransactionRef'
          readOnly: true
        reference:
          $ref: '#/components/schemas/PaymentReference'
          readOnly: true
        categoryPurpose:
          $ref: '#/components/schemas/CategoryPurpose'
          readOnly: true
        chargeBearer:
          $ref: '#/components/schemas/ChargeBearer'
          readOnly: true
        connectionInstructionId:
          type: string
          description: The ID of the instruction that was sent to the bank in which this direct debit was included when it was created.
          example: c1d6502c-07c7-4c77-bee5-963f9464c7d8
          readOnly: true
        batch:
          description: Details of the associated payments batch if the direct debit was created as part of a batch.
          $ref: '#/components/schemas/BatchDetails'
        paymentScheduleId:
          description: ID of the payment schedule associated with this direct debit.
          $ref: '#/components/schemas/ResourceID'
        etag:
          $ref: '#/components/schemas/ETag'
        externalId:
          $ref: '#/components/schemas/ExternalID'
          readOnly: true
        metadata:
          $ref: '#/components/schemas/Metadata'
          readOnly: true
        version:
          $ref: '#/components/schemas/ResourceVersion'
        created:
          $ref: '#/components/schemas/CreatedTimestamp'
        updated:
          $ref: '#/components/schemas/UpdatedTimestamp'
      required:
      - id
      - organizationId
      - amount
      - scheme
      - date
      - status
      - destination
      - destinationHolder
      - source
      - sourceHolder
      - approvalSteps
      - reference
      - version
      - etag
      - created
      - updated
      - attachedTransactions
    CreateDirectDebitRequest:
      type: object
      properties:
        amount:
          $ref: '#/components/schemas/AmountInput'
        scheme:
          $ref: '#/components/schemas/DirectDebitSchemeType'
        schemeDetails:
          $ref: '#/components/schemas/SchemeDetailsInput'
        date:
          description: Requested payment execution date. It is a local date from the source account's point-of-view. Cannot be set to before the current date, and not more than 60 days into the future.
          $ref: '#/components/schemas/Date'
        source:
          description: A reference identifying the source account to collect money from. Can only be an external account.
          oneOf:
          - $ref: '#/components/schemas/ExternalAccountRef'
          discriminator:
            propertyName: type
            mapping:
              EXTERNAL_ACCOUNT: '#/components/schemas/ExternalAccountRef'
        destination:
          $ref: '#/components/schemas/InternalAccountRef'
        reference:
          $ref: '#/components/schemas/PaymentReference'
        categoryPurpose:
          $ref: '#/components/schemas/CategoryPurpose'
        chargeBearer:
          $ref: '#/components/schemas/ChargeBearer'
        externalId:
          $ref: '#/components/schemas/ExternalID'
        metadata:
          $ref: '#/components/schemas/Metadata'
        paymentScheduleId:
          description: ID of the payment schedule to associate with this direct debit. Defaults to the organization's default schedule.
          $ref: '#/components/schemas/ResourceID'
      required:
      - amount
      - scheme
      - date
      - source
      - destination
      - reference
    DirectDebitTransferBatchContentType:
      type: string
      description: 'The content type of the batch.

        See https://docs.atlar.com/docs/batch-payments#csv-format for details on the CSV format for direct debit batches.'
      enum:
      - application/vnd.atlar.payments.v2.direct-debit.batch+csv
      - application/vnd.atlar.payments.v2.direct-debit.batch+json
      example: application/vnd.atlar.payments.v2.direct-debit.batch+csv
    CreateDirectDebitBatchRequest:
      type: object
      properties:
