            application/json:
              schema:
                $ref: '#/components/schemas/PaymentBatch'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - basicAuth:
        - direct_debits:update
  /platform/v2beta/webhooks:
    get:
      tags:
      - Webhooks
      summary: List webhooks
      description: Returns a list of webhooks.
      responses:
        '200':
          description: List of webhooks.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ListResponse'
                - properties:
                    items:
                      items:
                        $ref: '#/components/schemas/Webhook'
                      type: array
                  type: object
        '400':
          $ref: '#/components/responses/BadRequest'
      security:
      - basicAuth:
        - webhooks:read
    post:
      summary: Create webhook
      description: Create a webhook configuration.
      tags:
      - Webhooks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWebhookRequest'
      responses:
        '201':
          description: The created webhook.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhook'
        '400':
          $ref: '#/components/responses/BadRequest'
      security:
      - basicAuth:
        - webhooks:create
  /platform/v2beta/webhooks/{id}:
    get:
      summary: Get webhook
      description: Retrieve a specific webhook.
      tags:
      - Webhooks
      parameters:
      - $ref: '#/components/parameters/ResourceID'
      responses:
        '200':
          description: A webhook.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhook'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - basicAuth:
        - webhooks:read
    delete:
      summary: Delete webhook
      description: Delete a specific webhook.
      tags:
      - Webhooks
      parameters:
      - $ref: '#/components/parameters/ResourceID'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - basicAuth:
        - webhooks:delete
    patch:
      summary: Update webhook
      description: 'Update webhook configuration. Modifying `/url` sets `verified` to

        false. You can contact

        [support@atlar.com](mailto:support@atlar.com) to get a webhook

        configuration verified. Changes may take up to 10 minutes until

        they are in full effect.


        If the webhook was created via API v1, it can''t be patched;

        replace it with a new one using `POST /v2beta/webhooks` instead.

        The new webhook starts unverified, and has no signing key until

        you create one with `POST /v2beta/webhooks/{id}/keys`.'
      tags:
      - Webhooks
      parameters:
      - $ref: '#/components/parameters/ResourceID'
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/WebhookJSONPatchRequest'
      responses:
        '200':
          description: The updated webhook.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhook'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
      security:
      - basicAuth:
        - webhooks:update
  /platform/v2beta/webhooks/{id}/keys:
    post:
      summary: Create webhook signing key
      description: 'Generates a new webhook signing key. You can have between one

        and two keys (per webhook) at a time, to allow for key

        rotation. Note that keys can only be seen once - in the

        response from this endpoint. Read more about how to secure

        your webhooks in the [Webhooks and

        events](https://docs.atlar.com/docs/api#webhooks-and-events) section.'
      tags:
      - Webhooks
      parameters:
      - $ref: '#/components/parameters/ResourceID'
      responses:
        '201':
          description: The created webhook signing key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookSigningKeyWithKeyMaterial'
        '400':
          $ref: '#/components/responses/BadRequest'
        '412':
          description: Precondition failed - Too many signing keys.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 412
                details:
                - code: too_many_keys
                  error: Too many signing keys
      security:
      - basicAuth:
        - webhook_keys:create
    get:
      tags:
      - Webhooks
      summary: List webhook signing keys
      description: Returns a list of webhook signing keys.
      parameters:
      - $ref: '#/components/parameters/ResourceID'
      responses:
        '200':
          description: List of webhook signing keys.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ListResponse'
                - properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/WebhookSigningKey'
                  type: object
        '400':
          $ref: '#/components/responses/BadRequest'
      security:
      - basicAuth:
        - webhook_keys:read
  /platform/v2beta/webhooks/{id}/keys/{kid}:
    delete:
      summary: Delete webhook signing key
      description: Deletes and invalidates the specified webhook signing key.
      tags:
      - Webhooks
      parameters:
      - $ref: '#/components/parameters/ResourceID'
        description: Webhook resource ID.
      - name: kid
        in: path
        description: Webhook signing key ID.
        schema:
          type: string
        required: true
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - basicAuth:
        - webhook_keys:delete
webhooks:
  resourceEvent:
    post:
      summary: Resource event
      description: Resource event delivered as a webhook request.
      security: []
      tags:
      - Events (webhooks)
      parameters:
      - in: header
        name: Webhook-Signature
        description: 'Atlar Webhook request signature.

          Purpose: Makes it possible for your app to verify that the webhook was sent from Atlar (authenticity), and that the message hasn''t been altered (integrity).

          See details at https://docs.atlar.com/v2.0/docs/webhooks#webhook-security'
        schema:
          type: string
      - in: header
        name: Webhook-Request-Timestamp
        description: 'A timestamp specifying when the HTTP request was sent (by Atlar).

          Purpose: Used to mitigate replay attacks.

          See details at https://docs.atlar.com/v2.0/docs/webhooks#webhook-security'
        schema:
          type: string
          format: date-time
          example: '2022-10-11T10:13:14.000000015Z'
      requestBody:
        description: Resource event webhook payload.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventWebhookPayload'
            examples:
              WebhookRequestPayload_ResourceEvent_CreditTransfer_Approval:
                $ref: '#/components/examples/WebhookRequestPayload_ResourceEvent_CreditTransfer_Approval'
      responses:
        '200':
          description: Return a 200 OK status to indicate that the data was received and processed successfully.
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
  schemas:
    CreatedTimestamp:
      type: string
      format: date-time
      description: Time at which the resource was created.
      example: '2022-05-04T18:31:12.889104898Z'
      readOnly: true
    UpdatedTimestamp:
      type: string
      format: date-time
      description: Time at which the resource was last updated.
      example: '2022-05-04T18:47:32.213842599Z'
      readOnly: true
    ResourceID:
      type: string
      description: Unique resource identifier.
      minLength: 32
      maxLength: 64
      examples:
      - 2ed9a3ee-60aa-4f9f-a858-2eed4eefbbc8
    ResourceVersion:
      type: integer
      description: 'Resource version. Starts at value `1` when the resource is

        created and increases by one for each successive update.'
      example: 1
      minimum: 1
      readOnly: true
    ETag:
      type: string
      description: '[ETag](https://en.wikipedia.org/wiki/HTTP_ETag) based on the

        resource version. This can be passed along in `If-Match` HTTP

        header when updating a resource to perform a conditional

        update.'
      pattern: ^version:\d{1,4}$
      example: version:3
      readOnly: true
      externalDocs:
        url: https://en.wikipedia.org/wiki/HTTP_ETag
    OrganizationID:
      type: string
      description: Unique resource identifier for an Organization.
      examples:
      - 0160f6ab-5741-49e1-af46-9138927e547e
    Event:
      type: object
      description: A resource event.
      properties:
        id:
          type: integer
          description: The ID of the event.
          example: 1
        organizationId:
          $ref: '#/components/schemas/OrganizationID'
        entityId:
          description: The ID of the API resource that this event belongs to.
          $ref: '#/components/schemas/ResourceID'
        type:
          $ref: '#/components/schemas/EventType'
        name:
          type: string
          description: The event name. Different resources have different sets of event names.
          example: CREATED
        timestamp:
          description: When the event happened.
          type: string
          format: date-time
          example: '2022-08-20T12:20:40.866061374Z'
        details:
          description: Additional details describing this event.
          type: object
          additionalProperties:
            type: string
          examples:
          - approvalStepId: e741c062-19f6-46a0-be31-63dded5b0341
        message:
          type: string
          description: A message which could either be a message from the bank or an explanation of the event.
        originator:
          description: The originator of the event which could be either a user ID, BANK or ATLAR.
          type: string
          example: ATLAR
      required:
      - id
      - organizationId
      - entityId
      - type
      - name
      - originator
      - timestamp
    CurrencyCode:
      type: string
      description: Three-letter ISO 4217 currency code.
      example: EUR
      minLength: 3
      maxLength: 3
      pattern: ^[A-Z]{3,3}$
    AmountInput:
      oneOf:
      - $ref: '#/components/schemas/AmountIntegerValueInput'
      - $ref: '#/components/schemas/AmountStringValueInput'
    Amount:
      type: object
      properties:
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        stringValue:
          description: 'A string representation of the amount value. This will be

            a decimal number if the currency has decimals. The number

            is not formatted for display purposes (e.g. with locale

            specific thousand separator) and always contains the dot

            `.` character as decimal separator.'
          example: '15.02'
          type: string
        value:
          description: 'The amount value as an integer (int64) represented in

            currency minor units (e.g. 15.02 EUR is represented as the

            value 1502).'
          example: 1502
          type: integer
          format: int64
      required:
      - currency
      - stringValue
      - value
    Date:
      type: string
      format: date
      description: '`full-date` notation as defined by [RFC 3339, section 5.6](https://datatracker.ietf.org/doc/html/rfc3339#section-5.6), for example, `2017-07-21`.'
      example: '2022-05-07'
    CreateDocumentRequest:
      type: object
      properties:
        glEntityId:
          type: string
          description: The Atlar general ledger entity id that this document is associated with.
          example: 01925d46-2dd4-7ceb-b929-ed9aa3a9481e
        type:
          $ref: '#/components/schemas/DocumentType'
          description: The type of document.
          example: INVOICE
        amount:
          $ref: '#/components/schemas/MultiCurrencyAmountInput'
          description: The amount of the document.
        remainingAmount:
          $ref: '#/components/schemas/MultiCurrencyAmountInput'
          description: 'The remaining (unapplied or unpaid) portion of the document´s total amount.

            For SOURCE documents, this indicates how much remains to be paid or settled.

            For example, an unpaid invoice shows the outstanding amount; for a customer

            payment awaiting deposit, it reflects the undeposited value.

            For INSTRUCTION documents, this field shows the portion of the payment that

            has been applied to reduce the remaining amount of the linked SOURCE document.

            '
        date:
          $ref: '#/components/schemas/Date'
          description: The document date (e.g. a due date for an invoice or a transaction date for a payment).
        issueDate:
          $ref: '#/components/schemas/Date'
          description: The date the document was issued in the originating external system (e.g. the invoice issue date). Not necessarily the same as when the document was created (see vendorCreated).
          x-go-type-skip-optional-pointer: true
        description:
          type: string
          description: The description of the document.
          example: 'Invoice #10001'
          minLength: 1
          maxLength: 255
        reference:
          type: string
          description: The reference of the document.
          example: INV-10001
          minLength: 1
          maxLength: 255
        references:
          type: object
          additionalProperties:
            type: string
          description: The references of the document.
          example:
            memo: Some memo reference
        counterparty:
          $ref: '#/components/schemas/AccountingCounterparty'
          description: Details about the counterparty (e.g. a customer or vendor).
        voided:
          type: boolean
          description: Whether the document is voided in the accounting system.
        reconciliationMatchId:
          type: string
          description: The reconciliation match that this document is associated with.
        outgoingDocumentId:
          type: string
          description: The Atlar outgoing document that originated this ERP document, when known.
        glEntries:
          type: array
          items:
            $ref: '#/components/schemas/CreateGLEntryRequest'
          description: The general ledger entries for this document.
          minItems: 1
        appliedDocuments:
          description: The sibling relationship between documents, the documents that are applied to this document (e.g. payments applied to an invoice and vice versa).
          x-omitempty: true
          type: array
          items:
            $ref: '#/components/schemas/CreateAppliedDocumentRequest'
        provenance:
          description: Metadata capturing the source and history of this document, including when it was created and its identifier in the originating external system.
          $ref: '#/components/schemas/DocumentProvenance'
        vendorCreated:
          type: string
          format: date-time
          description: When the document was created in the originating external system.
        vendorResourceUrl:
          type: string
          description: 'The URL to the document in the originating external system, to help navigate to the document in the originating external system.

            This differs from the provenance URL, which is the endpoint URL from where it was fetched from.

            '
        currencyExchange:
          description: The currency exchange from the ledger entity's currency to the document's currency. Only present if the document's currency is different from the ledger entity's currency.
          $ref: '#/components/schemas/CurrencyExchange'
      required:
      - glEntityId
