  /financial-data/v2beta/accounts/{id}/end-of-day-summaries:
    get:
      summary: List end-of-day summaries
      description: 'Returns a list of end-of-day reporting summaries, on a per

        booked date basis, for the account identified by `id`.


        Note that these summaries are only available based on

        end-of-day reporting, e.g. `camt.053`, `MT940` or equivalent

        end-of-day reporting bank statements.


        Absence of a summary entry for a given account and date means

        Atlar has not (yet) processed booked transactions based on

        end-of-day reporting.


        The primary use case for these summaries is to provide a means

        to determine when it is safe to assume all transactions for a

        given booked date can be listed using the API endpoint [GET

        https://api.atlar.com/financial-data/v2/transactions](https://docs.atlar.com/reference/get_financial-data-v2-transactions-1).'
      tags:
      - Accounts
      parameters:
      - description: 'Include only summaries for the account identified by `id`. If value `-` is specified, summaries across all accounts will be included.

          '
        in: path
        name: id
        required: true
        schema:
          type: string
        examples:
          id:
            value: 31d593d7-fff9-4783-aa1d-92acb7b21a19
            summary: Specific account.
          hyphen:
            value: '-'
            summary: All accounts.
      - $ref: '#/components/parameters/QueryLimit'
      - $ref: '#/components/parameters/PaginationToken'
      - description: 'Include only summaries with property `date` matching the given value.

          '
        in: query
        name: date
        schema:
          type: string
          format: date
          example: '2022-01-15'
      responses:
        '200':
          description: List of summaries.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ListResponse'
                - properties:
                    items:
                      items:
                        $ref: '#/components/schemas/AccountReportingSummary'
                      type: array
                  type: object
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - basicAuth:
        - accounts:read
        - transactions:read
