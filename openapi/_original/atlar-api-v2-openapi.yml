          $ref: '#/components/schemas/ResourceID'
          readOnly: true
        thirdPartyId:
          $ref: '#/components/schemas/ResourceID'
          readOnly: true
        name:
          description: Name of the portfolio automatically populated by Atlar.
          type: string
          maxLength: 255
          readOnly: true
          examples:
          - My Portfolio
          - '123456789'
        alias:
          type: string
          description: Alias of the portfolio.
          example: My Portfolio
          readOnly: true
        identifiers:
          type: array
          minItems: 1
          uniqueItems: true
          readOnly: true
        created:
          $ref: '#/components/schemas/CreatedTimestamp'
          readOnly: true
        updated:
          $ref: '#/components/schemas/UpdatedTimestamp'
          readOnly: true
