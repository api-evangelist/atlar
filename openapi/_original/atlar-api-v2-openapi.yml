      - USER
      - ACCOUNTS_RECEIVABLE
      - ACCOUNTS_PAYABLE
      - GENERATED
      - ACCOUNTING_DOCUMENT
    ForecastedTransactionOrigin:
      description: The origin of this forecasted transaction, e.g. manual user input or AP/AR data.
      type: object
      properties:
        id:
          $ref: '#/components/schemas/ResourceID'
        type:
          $ref: '#/components/schemas/ForecastedTransactionOriginType'
