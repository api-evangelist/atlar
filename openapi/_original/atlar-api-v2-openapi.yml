    Mandate:
      type: object
      description: A mandate is a contract between the debtor and the creditor that authorizes debit collections from the debtors account. Different mandate types exist for different debit schemes.
      properties:
        id:
          description: The unique identifier of this mandate.
          $ref: '#/components/schemas/ResourceID'
          example: be7e04fe-3fa0-48f5-a993-2008409255f2
        organizationId:
          $ref: '#/components/schemas/OrganizationID'
        counterpartyId:
          type: string
          description: The ID of the counterparty which owns this mandate.
          example: f3efbb73-4e5b-4b22-adeb-918bbf1dfbd8
          readOnly: true
        externalAccountId:
          type: string
          description: The ID of the external account to which this mandate is associated with.
          example: ba0ad236-2904-4b01-8e85-a4ef3a73c353
        destinationAccountId:
          type: string
          description: The ID of the destination account where money will be collected for this mandate. This is only required for `AUTOGIRO` mandates.
          example: 31d593d7-fff9-4783-aa1d-92acb7b21a19
        connectionInstructionId:
          type: string
          description: The ID of the instruction that was sent to the bank where this mandate was included when it was created. Subsequent instructions, such as mandate cancellations, won't update this ID. It will always refer to the instruction which created the resource.
          example: c1d6502c-07c7-4c77-bee5-963f9464c7d8
          readOnly: true
        source:
          description: Source account from which funds will be collected. This account will be debited.
          $ref: '#/components/schemas/ExternalAccountSnapshot'
          readOnly: true
        sourceHolder:
          $ref: '#/components/schemas/AccountHolder'
          readOnly: true
        creditorReference:
          description: The customer number that you have received from the bank.
          type: string
        scheme:
          $ref: '#/components/schemas/DirectDebitSchemeType'
        mandateReference:
          type: string
          description: A unique reference to the mandate that you have signed with the debtor.
          minLength: 1
          maxLength: 35
        signatureDate:
          description: The date that this mandate was signed by the end user.
          $ref: '#/components/schemas/Date'
          examples:
          - '2022-08-01'
        status:
          $ref: '#/components/schemas/MandateStatus'
          description: The current status of a mandate.
        externalId:
          $ref: '#/components/schemas/ExternalID'
        metadata:
          $ref: '#/components/schemas/Metadata'
        version:
          $ref: '#/components/schemas/ResourceVersion'
        etag:
          $ref: '#/components/schemas/ETag'
        created:
          $ref: '#/components/schemas/CreatedTimestamp'
        updated:
          $ref: '#/components/schemas/UpdatedTimestamp'
      required:
      - id
      - organizationId
      - counterpartyId
      - externalAccountId
      - source
      - sourceHolder
      - scheme
      - creditorReference
      - mandateReference
      - status
      - version
      - etag
      - created
      - updated
    CreateMandateRequest:
      type: object
      properties:
        active:
          description: Set this to true if this mandate is already known by the bank. This is for example a good option if you're migrating a lot of mandates that you know are already active. The actual outcome of using this flag depends on the direct debit scheme, since all schemes work in slightly different ways. For example, for `AUTOGIRO`, it means that Atlar won't send the mandate prior to making the collection. For other schemes, it could have an effect on how quickly the collection can be executed.
          type: boolean
          example: false
        scheme:
          $ref: '#/components/schemas/DirectDebitSchemeType'
        externalAccountId:
          type: string
          description: The ID of the external account to which this mandate is associated with.
          example: ba0ad236-2904-4b01-8e85-a4ef3a73c353
        destinationAccountId:
          type: string
          description: The ID of the destination account where money will be collected for this mandate. This is only required for `AUTOGIRO` mandates.
          example: 31d593d7-fff9-4783-aa1d-92acb7b21a19
        creditorReference:
          description: 'The customer number that you have received from the bank.

            For `AUTOGIRO` this is your 6 digit customer number.

            '
          type: string
          minLength: 1
          maxLength: 35
        mandateReference:
          type: string
          description: 'A unique reference to the mandate that you have signed with the debtor.

            For `AUTOGIRO` this is used as payer number associated with the mandate and validated as 1-16 digits. For `AUTOGIRO`, this reference must not contain leading 0''s.

            '
          minLength: 1
          maxLength: 35
        signatureDate:
          $ref: '#/components/schemas/Date'
          description: The date that this mandate was signed by the end user.
        externalId:
          $ref: '#/components/schemas/ExternalID'
        metadata:
          $ref: '#/components/schemas/Metadata'
      required:
      - scheme
      - externalAccountId
      - creditorReference
      - mandateReference
    MandateStatus:
      type: string
      enum:
      - CREATED
      - PENDING_CANCELLATION
      - PENDING_CANCELLATION_SUBMISSION
      - CANCELLATION_SENT
      - PENDING_SUBMISSION
      - SENT
      - ACCEPTED
      - ACTIVE
      - FAILED
      - CANCELLED
      - UNKNOWN
      example: SENT
    RegulatoryReportingCode:
      type: object
      description: A regulatory reporting code with its description.
      properties:
        market:
          $ref: '#/components/schemas/MarketCode'
        scheme:
          allOf:
          - $ref: '#/components/schemas/CreditTransferSchemeType'
          description: 'Payment scheme this code applies to. Set when a market has multiple regulatory

            reporting code sets keyed off the scheme used for the transfer (e.g. Mexico''s

            domestic `MX_CT_SPID` codes versus the `CROSS_BORDER` codes for international

            transfers). Omitted when the codes for a market are scheme-agnostic.'
        indicator:
          $ref: '#/components/schemas/RegulatoryReportingIndicator'
        code:
          description: The regulatory reporting code to use when creating a payment.
          type: string
          example: '20000'
        title:
          description: Human-readable title describing what the code represents.
          type: string
          example: Communication, building and transport services
        classification:
          description: Category or classification of the code.
          type: string
          example: Services
      required:
      - market
      - indicator
      - code
      - title
      - classification
    OAuth2AccessTokenResponse:
      description: Successful OAuth 2.0 access token response.
      externalDocs:
        url: https://datatracker.ietf.org/doc/html/rfc6749#section-4.4.3
      type: object
      properties:
        access_token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.e30.Xi9Rplok2DNmNGBPC1CMxUY-ZBkzY-g-sxqzKkWjViU
        token_type:
          type: string
          example: Bearer
        expires_in:
          description: The lifetime in seconds of the access token.
          type: integer
          format: int64
          example: 299
        refresh_token:
          description: 'Opaque <a href="https://datatracker.ietf.org/doc/html/rfc6749#section-1.5">OAuth 2.0 refresh token</a>

            that the client can use to obtain a new access token. Only present when the authorization server

            issued one for the grant.

            '
          type: string
      required:
      - access_token
      - token_type
      additionalProperties: false
    OAuth2ErrorResponse:
      description: OAuth 2.0 error response.
      externalDocs:
        url: https://datatracker.ietf.org/doc/html/rfc6749#section-5.2
      type: object
      properties:
        error:
          description: OAuth 2.0 error code. See a <a href="https://datatracker.ietf.org/doc/html/rfc6749#section-5.2">RFC 6749</a> for details.
          type: string
          enum:
          - invalid_request
          - invalid_client
          - invalid_grant
          - unauthorized_client
          - unsupported_grant_type
        error_description:
          description: Human readable description of the error.
          type: string
          example: unsupported grant type
      required:
      - error
      additionalProperties: false
    Account:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/ResourceID'
          readOnly: true
          example: ac1963d7-fff9-4783-aa1d-92acb7b21a19
        organizationId:
          $ref: '#/components/schemas/OrganizationID'
          readOnly: true
          example: 0160f6ab-5741-49e1-af46-9138927e547e
        thirdPartyId:
          description: ID of the associated third-party, e.g. the bank in which the account is held.
          example: 0a951c88-3313-472a-b312-ca2e47769670
          type: string
          readOnly: true
        affiliationId:
          description: ID of the affiliation. An affiliation is and describes the relationship between the legal entity (`entityId`) owning this account and the third-party (`thirdPartyId`) where the account is held (e.g. a bank).
          type: string
          readOnly: true
          example: b9a931ce-9606-495d-95b0-8da8251c008a
        entityId:
          description: ID of the associated legal Entity.
          example: b130e3d7-f67c-4a10-b359-25ad88c4999b
          type: string
          readOnly: true
        market:
          $ref: '#/components/schemas/MarketCode'
          readOnly: true
        currency:
          $ref: '#/components/schemas/CurrencyCode'
          readOnly: true
        name:
          description: Name of the account automatically populated by Atlar.
          type: string
          maxLength: 255
          readOnly: true
          examples:
          - My Business Account
          - GB33BUKB20201555555555
        alias:
          description: An additional name, an alias, for the account.
          example: My Business Account
          type: string
          maxLength: 255
          x-omitempty: true
          readOnly: true
        identifiers:
          type: array
          items:
            $ref: '#/components/schemas/AccountIdentifier'
          minItems: 1
          uniqueItems: true
          readOnly: true
        routing:
          type: array
          items:
            $ref: '#/components/schemas/RoutingIdentifier'
          uniqueItems: true
          maxItems: 5
          readOnly: true
        type:
          $ref: '#/components/schemas/BankAccountType'
        status:
          $ref: '#/components/schemas/AccountStatus'
        fictive:
          type: boolean
          description: Indicates whether the account is a fictive/test account. This will be `true` for accounts associated with the Atlar _Testbank_.
          readOnly: true
          examples:
          - false
        externalId:
          $ref: '#/components/schemas/ExternalID'
          readOnly: true
        metadata:
          $ref: '#/components/schemas/Metadata'
          readOnly: true
        paymentOptions:
          $ref: '#/components/schemas/PaymentOptions'
          readOnly: true
        version:
          $ref: '#/components/schemas/ResourceVersion'
        etag:
          $ref: '#/components/schemas/ETag'
        created:
          $ref: '#/components/schemas/CreatedTimestamp'
        updated:
          $ref: '#/components/schemas/UpdatedTimestamp'
        closed:
          type: string
          format: date-time
          description: 'Time at which the account was closed. Only present if account `status` is `CLOSED`.

            '
          readOnly: true
        provisionState:
          $ref: '#/components/schemas/ProvisionState'
          description: 'New accounts start in `UNPROVISIONED` state, awaiting a decision to provision or ignore them.

            While unprovisioned, data ingestion (balances, transactions, etc.) is paused.

            Accounts transitioned to `IGNORED` are hidden and no data is ingested.

            Accounts transitioned to `PROVISIONED` appear normally and data ingestion begins.

            '
      required:
      - id
      - organizationId
      - entityId
      - thirdPartyId
      - affiliationId
      - market
      - currency
      - identifiers
      - routing
      - name
      - status
      - fictive
      - created
      - updated
      - version
      - etag
      - provisionState
    AccountStatus:
      description: Operational status of the account with the holding financial institution.
      type: string
      enum:
      - OPEN
      - CLOSED
      examples:
      - OPEN
      - CLOSED
    PaymentOptions:
      type: object
      properties:
        instruments:
          type: array
          x-omitempty: true
          items:
            $ref: '#/components/schemas/Instrument'
        initiatorId:
          type: string
        disabled:
          type: boolean
          description: When true, initiating credit transfers from this account is blocked.
          readOnly: true
    ProvisionState:
      type: string
      enum:
      - UNPROVISIONED
      - IGNORED
      - PROVISIONED
    AccountJSONPatchRequest:
      description: JSON Patch Request
      externalDocs:
        url: https://jsonpatch.com/
      type: array
      items:
        oneOf:
        - $ref: '#/components/schemas/AccountJSONPatchReplaceAlias'
        - $ref: '#/components/schemas/AccountJSONPatchRemoveAlias'
        - $ref: '#/components/schemas/AccountJSONPatchReplaceEntity'
        - $ref: '#/components/schemas/AccountJSONPatchReplaceMetadataKey'
        - $ref: '#/components/schemas/AccountJSONPatchRemoveMetadataKey'
        - $ref: '#/components/schemas/AccountJSONPatchAddPaymentOptionsInstrument'
        - $ref: '#/components/schemas/AccountJSONPatchReplacePaymentOptionsInstrument'
        - $ref: '#/components/schemas/AccountJSONPatchRemovePaymentOptionsInstrument'
        - $ref: '#/components/schemas/AccountJSONPatchReplacePaymentOptionsInitiatorId'
        - $ref: '#/components/schemas/AccountJSONPatchRemovePaymentOptionsInitiatorId'
        - $ref: '#/components/schemas/AccountJSONPatchReplaceStatus'
        - $ref: '#/components/schemas/AccountJSONPatchReplaceType'
    AccountJSONPatchReplaceStatus:
      description: Set account status.
      type: object
      properties:
        op:
          type: string
          enum:
          - replace
        path:
          type: string
          enum:
          - /status
        value:
          $ref: '#/components/schemas/AccountStatus'
      additionalProperties: false
      required:
      - op
      - path
      - value
    AccountJSONPatchReplaceType:
      description: Set account type.
      type: object
      properties:
        op:
          type: string
          enum:
          - replace
        path:
          type: string
          enum:
          - /type
        value:
          $ref: '#/components/schemas/BankAccountType'
      additionalProperties: false
      required:
      - op
      - path
      - value
    AccountJSONPatchReplaceAlias:
      description: Set alias.
      type: object
      properties:
        op:
          type: string
          enum:
          - replace
        path:
          type: string
          enum:
          - /alias
        value:
          type: string
          minLength: 1
          maxLength: 255
      additionalProperties: false
      required:
      - op
      - path
      - value
    AccountJSONPatchRemoveAlias:
      description: Remove alias.
      type: object
      properties:
        op:
          type: string
          enum:
          - remove
        path:
          type: string
          enum:
          - /alias
      additionalProperties: false
      required:
      - op
      - path
    AccountJSONPatchReplaceEntity:
      description: Change the holder entity of this Account.
      type: object
      properties:
        op:
          type: string
          enum:
          - replace
        path:
          type: string
          enum:
          - /entityId
        value:
          type: string
          minLength: 32
          maxLength: 64
      additionalProperties: false
      required:
      - op
      - path
      - value
    AccountJSONPatchReplaceMetadataKey:
      description: Set or replace the value of a specific metadata key.
      type: object
      properties:
        op:
          type: string
          enum:
          - replace
        path:
          type: string
          minLength: 11
          maxLength: 74
          pattern: ^/metadata/[A-Za-z0-9_\.\+\-]{1,64}$
        value:
          type: string
          minLength: 1
          maxLength: 512
      additionalProperties: false
      required:
      - op
      - path
      - value
    AccountJSONPatchRemoveMetadataKey:
      description: Remove a specific metadata key.
      type: object
      properties:
        op:
          type: string
          enum:
          - remove
        path:
          type: string
          minLength: 11
          maxLength: 74
          pattern: ^/metadata/[A-Za-z0-9_\.\+\-]{1,64}$
      additionalProperties: false
      required:
      - op
      - path
    AccountJSONPatchAddPaymentOptionsInstrument:
      description: Add an instrument to payment options.
      type: object
      properties:
        op:
          type: string
          enum:
          - add
        path:
          type: string
          enum:
          - /paymentOptions/instruments/-
        value:
          $ref: '#/components/schemas/Instrument'
      additionalProperties: false
      required:
      - op
      - path
      - value
    AccountJSONPatchReplacePaymentOptionsInstrument:
      description: Replace an instrument in payment options.
      type: object
      properties:
        op:
          type: string
          enum:
          - replace
        path:
          type: string
          pattern: ^/paymentOptions/instruments/[0-9]$
        value:
          $ref: '#/components/schemas/Instrument'
      additionalProperties: false
      required:
      - op
      - path
      - value
    AccountJSONPatchRemovePaymentOptionsInstrument:
      description: Remove an instrument from payment options.
      type: object
      properties:
        op:
          type: string
          enum:
          - remove
        path:
          type: string
          pattern: ^/paymentOptions/instruments/[0-9]$
      additionalProperties: false
      required:
      - op
      - path
    AccountJSONPatchReplacePaymentOptionsInitiatorId:
      description: Set the InitiatorId for payment options.
      type: object
      properties:
        op:
          type: string
          enum:
          - replace
        path:
          type: string
          enum:
          - /paymentOptions/initiatorId
        value:
          type: string
          minLength: 1
          maxLength: 255
      additionalProperties: false
      required:
      - op
      - path
      - value
    AccountJSONPatchRemovePaymentOptionsInitiatorId:
      description: Remove the InitiatorId from payment options.
      type: object
      properties:
        op:
          type: string
          enum:
          - remove
        path:
          type: string
          enum:
          - /paymentOptions/initiatorId
      additionalProperties: false
      required:
      - op
      - path
    Balance:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/ResourceID'
        accountId:
          $ref: '#/components/schemas/ResourceID'
          description: Account ID.
        organizationId:
          $ref: '#/components/schemas/OrganizationID'
        type:
          $ref: '#/components/schemas/BalanceType'
          readOnly: true
        reportedType:
          $ref: '#/components/schemas/BalanceReportedType'
          readOnly: true
        amount:
          $ref: '#/components/schemas/Amount'
          readOnly: true
        localDate:
          description: Local date in the timezone associated with the account/bank.
          $ref: '#/components/schemas/Date'
          readOnly: true
        timestamp:
          description: Timestamp of when the balance entry was recorded on the account. This timestamp is reported in UTC and thus the date component of this timestamp may be different than `localDate`.
          example: '2023-04-25T15:01:13.738861011Z'
          type: string
          format: date-time
          readOnly: true
        created:
          description: Timestamp of when the balance entry was created in Atlar. This is distinct from `timestamp`, which reflects when the balance was recorded on the account by the bank. For example, an end-of-day balance may have a `timestamp` of 23:59 but be `created` the following day when the bank statement was delivered to Atlar.
          $ref: '#/components/schemas/CreatedTimestamp'
          readOnly: true
        version:
          $ref: '#/components/schemas/ResourceVersion'
          readOnly: true
      required:
      - id
      - accountId
      - organizationId
      - type
      - reportedType
      - amount
      - localDate
      - timestamp
      - created
      - version
      examples:
      - id: 6eeb63bb-99cc-44e2-9558-202572bfe403
        accountId: 31d593d7-fff9-4783-aa1d-92acb7b21a19
        organizationId: 52dce1f7-7a38-4875-9058-f586a82d43e9
        type: BOOKED
        reportedType: CLOSE
        amount:
          currency: EUR
          value: 12345
          stringValue: '123.45'
        timestamp: '2022-05-04T18:31:12.889104898Z'
        created: '2022-05-05T02:00:00.000000000Z'
        localDate: '2022-05-04'
        version: 1
    BalanceType:
      type: string
      enum:
      - BOOKED
      - BOOKED_ADJUSTED
      - AVAILABLE
      examples:
      - BOOKED
      - BOOKED_ADJUSTED
      - AVAILABLE
    BalanceReportedType:
      type: string
      enum:
      - OPEN
      - CLOSE
      - INTERIM
      examples:
      - OPEN
      - CLOSE
    ControlData:
      type: object
      properties:
        sum:
          $ref: '#/components/schemas/Amount'
        count:
          type: integer
          format: int64
      required:
      - sum
      - count
    AccountReportingSummary:
      type: object
      description: 'A summary of account reporting data for a specific reporting period, e.g. a booked date.

        '
      properties:
        id:
          $ref: '#/components/schemas/ResourceID'
          readOnly: true
        organizationId:
          $ref: '#/components/schemas/OrganizationID'
          readOnly: true
        accountId:
          $ref: '#/components/schemas/ResourceID'
          readOnly: true
        type:
          type: string
          enum:
          - BOOKED
          readOnly: true
        date:
          description: Booked date.
          $ref: '#/components/schemas/Date'
          example: '2025-05-01'
          readOnly: true
        transactionsControlData:
          allOf:
          - $ref: '#/components/schemas/SummaryTransactionsControlData'
          readOnly: true
        version:
          $ref: '#/components/schemas/ResourceVersion'
          readOnly: true
        etag:
          x-atlar-fields-enum-skip: true
          $ref: '#/components/schemas/ETag'
          readOnly: true
      required:
      - id
      - organizationId
      - accountId
      - type
      - date
      - version
      - etag
    SummaryTransactionsControlData:
      description: 'Control data for all the transactions for the `date` which this summary spans.


        Transactions control data is only included in the response if the requesting principal have authorization scopes `transactions:read`.

        '
      type: object
      properties:
        total:
          description: Total count and sum of absolute amounts of all transactions.
          $ref: '#/components/schemas/ControlData'
        net:
          description: Total count and net amount of all transactions.
          $ref: '#/components/schemas/ControlData'
      required:
      - total
      - net
      examples:
      - total:
          count: 3
          sum:
            currency: EUR
            value: 1234
            stringValue: '12.34'
        net:
          count: 3
          sum:
            currency: EUR
            value: -567
            stringValue: '-5.67'
    ChargeIncluded:
      type: string
      description: Whether the charge is included in the transaction amount.
      enum:
      - INCLUDED
      - NOT_INCLUDED
      - UNSPECIFIED
      example: INCLUDED
    ReturnReason:
      type: object
      properties:
        code:
          type: string
          readOnly: true
        description:
          type: string
          readOnly: true
        originalBankTransactionCode:
          description: Bank transaction code (BTC) of original transaction.
          $ref: '#/components/schemas/BankTransactionCode'
          readOnly: true
    BatchInformation:
      type: object
      description: Information about the batch that the transaction belongs to.
      properties:
        transactionCount:
          type: integer
          description: The number of transactions in the batch.
          example: 10
          readOnly: true
        totalAmount:
          description: The total amount of all transactions in the batch.
          $ref: '#/components/schemas/Amount'
          readOnly: true
      example:
        transactionCount: 10
        totalAmount:
          value: 100000
          stringValue: '1000.00'
          currency: EUR
      required:
      - transactionCount
    ChargeType:
      type: string
      description: Charge type specifies the kind of charge on a transaction.
      enum:
      - BROKERAGE_FEE
      - COMMISSION
      - SUMMATION
      - BATCH
      - AMENDMENT
      - CANCELLATION_FEE
      - CLEARING_FEE
      - INVESTIGATION
      - INTEREST
      - NON_STP_CHARGES
      - BORNE_BY_DEBTOR
      - TELECOMMUNICATION_CHARGES
      - ACCOUNT_MAINTENANCE_FEE
      - REPORTING_CHARGES
      example: BATCH
    Transaction:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/ResourceID'
          example: e37235aa-adab-11ec-8029-96ac651c9332
        organizationId:
          $ref: '#/components/schemas/OrganizationID'
        accountId:
          type: string
          description: The ID of the account which the transaction is booked on.
          example: 31d593d7-fff9-4783-aa1d-92acb7b21a19
          readOnly: true
        date:
          description: Booking date of the transaction on your account. This is a local date with no timezone from your account's point-of-view.
          $ref: '#/components/schemas/Date'
          example: '2022-05-01'
          readOnly: true
        amount:
          $ref: '#/components/schemas/Amount'
          readOnly: true
        reference:
          type: string
          description: Transaction reference. (This type of reference is sometimes also referred to as remittance information.)
          example: invoice-2022-05-03-012345
          readOnly: true
        references:
          $ref: '#/components/schemas/TransactionReferences'
          readOnly: true
        reconciliationStatus:
          $ref: '#/components/schemas/TransactionReconciliationStatus'
          readOnly: true
        counterparty:
          $ref: '#/components/schemas/CounterpartyDetails'
          readOnly: true
        description:
          type: string
          description: 'In most cases, the description will contain the same value (text) as the remittance information.

            If the remittance information lacks clarity or meaning, the description can be derived from

            the bank transaction code instead. This description field is intended solely for displaying

            a meaningful description to users.'
          example: 'Invoice #123'
          readOnly: true
        instructedAmount:
          description: The amount that the initiator of the transaction instructed.
          $ref: '#/components/schemas/Amount'
          readOnly: true
        bankTransactionCode:
          $ref: '#/components/schemas/BankTransactionCode'
          readOnly: true
        valueDate:
          description: Value date of the transaction on your account. This is a local date with no timezone from your account's point-of-view.
          $ref: '#/components/schemas/Date'
          example: '2022-05-02'
          readOnly: true
        returned:
          type: boolean
          description: Whether or not the transaction is considered a return or reversal.
          example: false
          readOnly: true
        returnReason:
          description: Populated if the transaction is a return transaction, e.g. a payment reversal/return.
          $ref: '#/components/schemas/ReturnReason'
          readOnly: true
        currencyExchange:
          description: If any currency conversion happened at the bank holding the account, conversion details may be present here.
          $ref: '#/components/schemas/CurrencyExchange'
          readOnly: true
        charges:
          description: Charges associated with the transaction, as reported by the bank.
          type: array
          items:
            $ref: '#/components/schemas/TransactionCharge'
          readOnly: true
          x-omitempty: true
        virtualAccount:
          description: If a virtual account was used for the transaction the details of that virtual account may be present here.
          $ref: '#/components/schemas/TransactionVirtualAccount'
          readOnly: true
        batchInformation:
          description: Information about the batch that the transaction belongs to.
          $ref: '#/components/schemas/BatchInformation'
          readOnly: true
        attachedTransactables:
          type: array
          items:
            $ref: '#/components/schemas/AttachedTransactableRef'
          readOnly: true
        internalTransfer:
          description: 'Set when this transaction is one leg of an `InternalTransfer` — populated as soon as either leg of the

            underlying movement is observed by the detector (the `InternalTransfer` may still be `PENDING` with the

            counterpart transaction id empty). Populated asynchronously, so a transaction may initially be returned

            without this field and later carry it after a `Transaction UPDATED` event.

            '
          $ref: '#/components/schemas/InternalTransferRef'
          readOnly: true
        created:
          $ref: '#/components/schemas/CreatedTimestamp'
        updated:
          $ref: '#/components/schemas/UpdatedTimestamp'
        version:
          $ref: '#/components/schemas/ResourceVersion'
        etag:
          $ref: '#/components/schemas/ETag'
        metadata:
          $ref: '#/components/schemas/Metadata'
          readOnly: true
      required:
      - id
      - organizationId
      - accountId
      - date
      - amount
      - reconciliationStatus
      - description
      - created
      - updated
      - version
      - etag
      - attachedTransactables
      - returned
    TransactionReferences:
      description: References and identifiers associated with a transaction.
      type: object
      properties:
        mandateReference:
          type: string
          description: Populated if a (debit) mandate reference was given on the transaction by the bank. Typically, if a transaction stems from a direct debit payment, the mandate reference that was used to pull the funds will be given.
          example: '123456'
          readOnly: true
        endToEndId:
          type: string
          description: A reference that can be set by the payment initiator that should follow the payment "end to end". Atlar will utilize this reference for tracking payments.
          example: '123456'
          readOnly: true
        bankTransactionReference:
          type: string
          description: A reference the bank gives the transaction.
          example: '123456'
          readOnly: true
    TransactionCharge:
      type: object
      properties:
        amount:
          description: The amount of the charge.
          $ref: '#/components/schemas/Amount'
        type:
          description: The charge type, if reported by the bank.
          $ref: '#/components/schemas/ChargeType'
        proprietaryType:
          description: The proprietary type of the charge, if reported by the bank.
          type: string
        chargeBearer:
          description: The charge bearer, if reported by the bank.
          $ref: '#/components/schemas/ChargeBearer'
        included:
          description: Whether the charge is included in the transaction amount, if reported by the bank.
          $ref: '#/components/schemas/ChargeIncluded'
      required:
      - amount
      - included
    TransactionVirtualAccount:
      type: object
      description: Account information about the virtual account used in the transaction.
      properties:
        market:
          $ref: '#/components/schemas/MarketCode'
          readOnly: true
        identifiers:
          type: array
          items:
            $ref: '#/components/schemas/AccountIdentifier'
          minItems: 1
          uniqueItems: true
          readOnly: true
        routing:
          type: array
          items:
            $ref: '#/components/schemas/RoutingIdentifier'
          uniqueItems: true
          readOnly: true
          x-omitempty: true
      required:
      - identifiers
    AttachedTransactableRef:
      type: object
      description: An association between a _Transaction_ and a _transactable_ resource, e.g. a _Credit Transfer_, _Direct Debit_, _Expected Transaction_, or _Payment Batch_.
      properties:
        type:
          description: The resource type of the attached transactable.
          enum:
          - CREDIT_TRANSFER
          - DIRECT_DEBIT
          - EXPECTED_TRANSACTION
          - PAYMENT_BATCH
          - CONNECTION_INSTRUCTION
          type: string
          readOnly: true
        id:
          description: ID of the attached transactable resource.
          $ref: '#/components/schemas/ResourceID'
          readOnly: true
      examples:
      - type: CREDIT_TRANSFER
        id: 1828d825-3f40-48c2-9b3b-07017ff887cc
      required:
      - type
      - id
    TransactionReconciliationStatus:
      description: Specifies whether the transaction have been reconciled against a payment or an expected transaction.
      type: string
      enum:
      - RECONCILED
      - PARTIALLY_RECONCILED
      - NOT_RECONCILED
      examples:
      - RECONCILED
      - PARTIALLY_RECONCILED
      - NOT_RECONCILED
    InternalTransferRef:
      type: object
      description: 'Reference to the `InternalTransfer` this transaction is one leg of, plus the counterpart

        transaction/account. Stamped onto the transaction as soon as its leg is observed — even if the

        counterpart leg has not yet ingested. In that case `counterpartTransactionId` is empty; it gets

        filled in when the counterpart transaction ingests and the InternalTransfer is promoted to CONFIRMED.

        '
      properties:
        internalTransferId:
          $ref: '#/components/schemas/ResourceID'
          readOnly: true
        counterpartTransactionId:
          $ref: '#/components/schemas/ResourceID'
          description: 'The counterpart leg''s transaction id. Empty while the InternalTransfer is in PENDING status —

            the counterpart transaction has not yet been observed.'
          readOnly: true
        counterpartAccountId:
          $ref: '#/components/schemas/ResourceID'
          readOnly: true
        status:
          type: string
          description: 'Status of the parent `InternalTransfer` at the time this ref was stamped onto the leg.

            `PENDING` until the counterpart leg has ingested; `CONFIRMED` once both legs are paired.

            May be absent on legs stamped before this field was introduced.'
          enum:
          - PENDING
          - CONFIRMED
          readOnly: true
      required:
      - internalTransferId
      - counterpartAccountId
    TransactionJSONPatchRequest:
      description: JSON Patch Request
      externalDocs:
        url: https://jsonpatch.com/
      type: array
      items:
        oneOf:
        - $ref: '#/components/schemas/TransactionJSONPatchReplaceMetadataKey'
        - $ref: '#/components/schemas/TransactionJSONPatchRemoveMetadataKey'
    TransactionJSONPatchReplaceMetadataKey:
      description: Set or replace the value of a specific metadata key.
      type: object
      properties:
        op:
          type: string
          enum:
          - replace
        path:
          type: string
          minLength: 11
          maxLength: 74
          pattern: ^/metadata/[A-Za-z0-9_\.\+\-]{1,64}$
        value:
          type: string
          minLength: 1
          maxLength: 512
      additionalProperties: false
      required:
      - op
      - path
      - value
    TransactionJSONPatchRemoveMetadataKey:
      description: Remove a specific metadata key.
      type: object
      properties:
        op:
          type: string
          enum:
          - remove
        path:
          type: string
          minLength: 11
          maxLength: 74
          pattern: ^/metadata/[A-Za-z0-9_\.\+\-]{1,64}$
      additionalProperties: false
      required:
      - op
      - path
    InternalTransfer:
      type: object
      description: 'An InternalTransfer is a pair of two transactions (one debit, one credit) in different accounts

        within the same organization that together represent one movement of funds. Detection runs asynchronously

        when an account''s end-of-day reporting summary is created. While only one of the two legs has been

        observed, the InternalTransfer is in PENDING status with the counterpart''s transaction id empty

        (its account id is already known); once both legs are present the status is promoted to CONFIRMED.

        '
      properties:
        id:
          $ref: '#/components/schemas/ResourceID'
          readOnly: true
        organizationId:
          $ref: '#/components/schemas/OrganizationID'
          readOnly: true
        status:
          type: string
          description: 'CONFIRMED means both legs of the transfer have been observed.

            PENDING means only one leg has been observed so far — its

            counterpart''s account id is known but the counterpart''s

            transaction id is empty until the counterpart leg ingests.'
          enum:
          - CONFIRMED
          - PENDING
          readOnly: true
        debitTransactionId:
          $ref: '#/components/schemas/ResourceID'
          description: 'The id of the debit-side transaction. Empty on a PENDING InternalTransfer when the debit leg has

            not yet been observed.'
          readOnly: true
        creditTransactionId:
          $ref: '#/components/schemas/ResourceID'
          description: 'The id of the credit-side transaction. Empty on a PENDING InternalTransfer when the credit leg has

            not yet been observed.'
          readOnly: true
        debitAccountId:
          $ref: '#/components/schemas/ResourceID'
          readOnly: true
        creditAccountId:
          $ref: '#/components/schemas/ResourceID'
          readOnly: true
        created:
          $ref: '#/components/schemas/CreatedTimestamp'
          readOnly: true
        updated:
          $ref: '#/components/schemas/UpdatedTimestamp'
          readOnly: true
        version:
          $ref: '#/components/schemas/ResourceVersion'
          readOnly: true
        etag:
          $ref: '#/components/schemas/ETag'
          readOnly: true
      required:
      - id
      - organizationId
      - status
      - debitAccountId
      - creditAccountId
      - created
      - updated
      - version
      - etag
    PendingTransaction:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/ResourceID'
          example: e37235aa-adab-11ec-8029-96ac651c9332
        organizationId:
          $ref: '#/components/schemas/OrganizationID'
        accountId:
          type: string
          description: The ID of the account which the transactions occurs on.
          example: 31d593d7-fff9-4783-aa1d-92acb7b21a19
          readOnly: true
        date:
          description: The booking date of the transaction on your account. This is a local date with no timezone from your account's point-of-view. NB! This is a PendingTransaction, and not an actual reported Booked Transaction. This date may differ from the actual booking date of the transaction.
          $ref: '#/components/schemas/Date'
          example: '2022-05-01'
          readOnly: true
        amount:
          $ref: '#/components/schemas/Amount'
          readOnly: true
        reference:
          type: string
          description: Transaction reference. (This type of reference is sometimes also referred to as remittance information.)
          example: invoice-2022-05-03-012345
          readOnly: true
        references:
          $ref: '#/components/schemas/TransactionReferences'
          readOnly: true
        counterparty:
          $ref: '#/components/schemas/CounterpartyDetails'
          readOnly: true
        description:
          type: string
          description: 'In most cases, the description will contain the same value (text) as the remittance information.

            If the remittance information lacks clarity or meaning, the description can be derived from

            the bank transaction code instead. This description field is intended solely for displaying

            a meaningful description to users.'
          example: 'Invoice #123'
          readOnly: true
        instructedAmount:
          description: The amount that the initiator of the transaction instructed.
          $ref: '#/components/schemas/Amount'
          readOnly: true
        bankTransactionCode:
          $ref: '#/components/schemas/BankTransactionCode'
          readOnly: true
        valueDate:
          description: Value date of the transaction on your account. This is a local date with no timezone from your account's point-of-view. NB! This is a PendingTransaction, and not an actual reported Booked Transaction. This date may differ from the actual value date of the booked transaction.
          $ref: '#/components/schemas/Date'
          example: '2022-05-02'
          readOnly: true
        returned:
          type: boolean
          description: Whether or not the transaction is considered a return or reversal.
          example: false
          readOnly: true
        returnReason:
          description: Populated if the transaction is a return transaction, e.g. a payment reversal/return.
          $ref: '#/components/schemas/ReturnReason'
          readOnly: true
        currencyExchange:
          description: If any currency conversion happened at the bank holding the account, conversion details may be present here.
          $ref: '#/components/schemas/CurrencyExchange'
          readOnly: true
        charges:
          description: Charges associated with the transaction, as reported by the bank.
          type: array
          items:
            $ref: '#/components/schemas/TransactionCharge'
          readOnly: true
          x-omitempty: true
        virtualAccount:
          description: If a virtual account was used for the transaction the details of that virtual account may be present here.
          $ref: '#/components/schemas/TransactionVirtualAccount'
          readOnly: true
        batchInformation:
          description: Information about the batch that the transaction belongs to.
          $ref: '#/components/schemas/BatchInformation'
          readOnly: true
        created:
          $ref: '#/components/schemas/CreatedTimestamp'
        updated:
          $ref: '#/components/schemas/UpdatedTimestamp'
        version:
          $ref: '#/components/schemas/ResourceVersion'
        etag:
          $ref: '#/components/schemas/ETag'
        metadata:
          $ref: '#/components/schemas/Metadata'
          readOnly: true
      required:
      - id
      - organizationId
      - accountId
      - date
      - amount
      - description
      - created
      - updated
      - version
      - etag
      - returned
    PendingTransactionJSONPatchRequest:
      description: JSON Patch Request
      externalDocs:
        url: https://jsonpatch.com/
      type: array
      items:
        oneOf:
        - $ref: '#/components/schemas/PendingTransactionJSONPatchReplaceMetadataKey'
        - $ref: '#/components/schemas/PendingTransactionJSONPatchRemoveMetadataKey'
    PendingTransactionJSONPatchReplaceMetadataKey:
      description: Set or replace the value of a specific metadata key.
      type: object
      properties:
        op:
          type: string
          enum:
