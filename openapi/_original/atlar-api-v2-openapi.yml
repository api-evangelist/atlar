    CurrencyExchange:
      type: object
      properties:
        exchangeRate:
          type: string
          description: The exchange rate that was reported by the bank. Atlar will not try to calculate this in cases where the information isn't present.
          example: '11.21320'
          readOnly: true
        sourceCurrency:
          description: The currency from which the amount was converted.
          $ref: '#/components/schemas/CurrencyCode'
          readOnly: true
        targetCurrency:
          description: The currency to which the amount was converted.
          $ref: '#/components/schemas/CurrencyCode'
          readOnly: true
        unitCurrency:
          description: One unit of this currency multiplied by the exchange rate will equal the target currency.
          $ref: '#/components/schemas/CurrencyCode'
          readOnly: true
      required:
      - sourceCurrency
      - exchangeRate
      example:
        sourceCurrency: EUR
        targetCurrency: SEK
        unitCurrency: EUR
        exchangeRate: '11.21320'
    EventWebhookPayload:
      type: object
      description: A resource event payload when sent as a webhook.
      properties:
        resource:
          description: Resource name.
          type: string
          examples:
          - credit_transfers
          - transactions
          - accounts
        event:
          $ref: '#/components/schemas/Event'
        entity:
          description: A snapshot of the resource entity, after the event / changes impacted the entity.
          type: object
        apiVersion:
          description: Atlar API (major) version. This toghether with the `resource` dictates the structure of `entity`.
          type: integer
          example: 2
      required:
      - resource
      - event
      - entity
      - apiVersion
    ListResponse:
      type: object
      properties:
        items:
          description: A list of resources.
        nextToken:
          description: 'Pagination token for next page.

            The value will be a non-empty string if there are more resources to be fetched.

            The value will be an empty string if there are no more resources to be fetched.'
          type: string
          example: eyIxIjogIlRoaXMgaXMgYSBkdW1teSBwYWdpbmF0aW9uIHRva2VuLiJ9
        token:
          description: 'The pagination token that was used for this request.

            The value will be an empty string if no `token` query parameter was provided with the request.'
          type: string
          example: eyIwIjogIlRoaXMgaXMgYSBkdW1teSBwYWdpbmF0aW9uIHRva2VuLiJ9
        limit:
          description: The page limit that was used for this request.
          example: 100
          type: integer
      required:
      - items
      - nextToken
      - token
      - limit
    BatchGetFailure:
      type: object
      description: Batch get failure details. These failure details pertain to a single specific ID / resource in the batch request.
      properties:
        id:
          $ref: '#/components/schemas/ResourceID'
        version:
          description: 'Resource version that was requested. Present when the batch

            request used `idvs` (versioned keys); omitted for latest-only

            `ids` requests.'
          type: integer
          minimum: 1
          example: 3
        code:
          description: Error code. Not always present.
          example: not_found
          type: string
        error:
          description: Error message. Not always present.
          example: Internal server error (timeout)
          type: string
        retryable:
          type: boolean
          description: Indication of whether this failure is retryable. If a resource (ID) was not found, or if the client is not authorized to get the resource, the failure is typically not retryable. If fetching some of the requested resources in were subject to throttling or rate-limiting, that may be retryable.
      required:
      - id
    BatchGetResponse:
      type: object
      properties:
        items:
          description: A list of resources.
        failures:
          type: array
          items:
            $ref: '#/components/schemas/BatchGetFailure'
      required:
      - items
      - failures
