openapi: 3.1.0
info:
  title: Atlar API (v2)
  description: Atlar API (v2)
  version: '0.1'
  contact:
    email: support@atlar.com
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.txt
servers:
- url: https://api.atlar.com
x-tagGroups:
- name: Atlar Accounting API
  tags:
  - Documents
  - GL Entities
  - GL Accounts
- name: Atlar Analytics API
  tags:
  - Forecasted Transactions
- name: Atlar Connectivity API
  tags:
  - Connections
- name: Atlar Payments API
  tags:
  - Credit Transfers
  - Direct Debits
  - External Accounts
  - Counterparties
  - Mandates
  - Events (webhooks)
  - Regulatory Reporting
- name: Atlar Financial Data API
  tags:
  - Accounts
  - Transactions
  - Pending Transactions
  - Entities
  - Investments
- name: Atlar IAM API
  tags:
  - OAuth
  - Audit logs
- name: Atlar Platform API
  tags:
  - Webhooks
paths:
  /accounting/v2beta/documents:
    post:
      summary: Create document
      description: Create a new accounting document.
      tags:
      - Documents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDocumentRequest'
      responses:
        '201':
          description: The created document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          $ref: '#/components/responses/BadRequest'
      security:
      - basicAuth:
        - accounting_documents:create
        - gl_accounts:read
        - gl_entities:read
        - accounting_vendor_bank_accounts:read
    get:
      summary: List documents
      description: Returns a list of accounting documents.
      tags:
      - Documents
      parameters:
      - $ref: '#/components/parameters/QueryLimit'
      - $ref: '#/components/parameters/PaginationToken'
      - description: Filter by GL entity ID.
        in: query
        name: glEntityId
        schema:
          $ref: '#/components/schemas/ResourceID'
      - description: Filter by reconciliation match ID.
        in: query
        name: reconciliationMatchId
        schema:
          $ref: '#/components/schemas/ResourceID'
      responses:
        '200':
          description: A list of documents.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ListResponse'
                - properties:
                    items:
                      items:
                        $ref: '#/components/schemas/Document'
                      type: array
                  type: object
        '400':
          $ref: '#/components/responses/BadRequest'
      security:
      - basicAuth:
        - accounting_documents:read
        - gl_entities:read
  /accounting/v2beta/documents/{id}:
    get:
      summary: Get document
      description: Retrieve a specific accounting document.
      tags:
      - Documents
      parameters:
      - $ref: '#/components/parameters/ResourceIDOrExternalID'
      responses:
        '200':
          description: An accounting document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - basicAuth:
        - accounting_documents:read
        - gl_entities:read
    patch:
      summary: Update document
      description: Update an accounting document.
      tags:
      - Documents
      parameters:
      - $ref: '#/components/parameters/ResourceID'
      - $ref: '#/components/parameters/IfMatchETag'
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/DocumentJSONPatchRequest'
      responses:
        '200':
          description: The updated document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - basicAuth:
        - accounting_documents:update
        - gl_accounts:read
        - gl_entities:read
        - accounting_vendor_bank_accounts:read
    delete:
      summary: Delete document
      description: Delete an accounting document.
      tags:
      - Documents
      parameters:
      - $ref: '#/components/parameters/ResourceID'
      responses:
        '204':
          description: The document was deleted.
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - basicAuth:
        - accounting_documents:delete
        - gl_entities:read
  /accounting/v2beta/documents:batch:
    get:
      summary: Get documents
      description: 'Get multiple accounting documents in a batch request.


        Provide either `ids` (latest versions) or `idvs` (specific versions

        encoded as `<id>@<version>`). The two parameters are mutually

        exclusive; exactly one must be provided.'
      tags:
      - Documents
      parameters:
      - $ref: '#/components/parameters/BatchGetResourceIDsOptional'
      - $ref: '#/components/parameters/BatchGetResourceIDVersions'
      responses:
        '200':
          description: List of documents.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/BatchGetResponse'
                - properties:
                    items:
                      items:
                        $ref: '#/components/schemas/Document'
                      type: array
                  type: object
        '400':
          $ref: '#/components/responses/BadRequest'
      security:
      - basicAuth:
        - accounting_documents:read
        - gl_entities:read
  /accounting/v2beta/gl-accounts:
    post:
      summary: Create account
      description: Create a new general ledger account.
      tags:
      - GL Accounts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGLAccountRequest'
      responses:
        '201':
          description: The created general ledger account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GLAccount'
        '400':
          $ref: '#/components/responses/BadRequest'
      security:
      - basicAuth:
        - gl_accounts:create
        - gl_entities:read
    get:
      summary: List GL accounts
      description: Returns a list of general ledger accounts. Sort order is always ascending on account number.
      tags:
      - GL Accounts
      parameters:
      - description: Only include accounts that are associated with the specified type
        in: query
        name: type
        schema:
          $ref: '#/components/schemas/GLAccountType'
      - description: Exclude ignored accounts from the response
        in: query
        name: excludeIgnored
        schema:
          type: boolean
          default: false
      - description: Only include accounts that are associated with the specified connection.
        in: query
        name: connectionId
        schema:
          $ref: '#/components/schemas/ResourceID'
      - description: Filter by financial data account ID.
        in: query
        name: accountId
        schema:
          $ref: '#/components/schemas/ResourceID'
      - description: Only include accounts that are associated with the specified GL entity.
        in: query
        name: glEntityId
        schema:
          $ref: '#/components/schemas/ResourceID'
      - description: Only include accounts with the given inactive state. Omit to include both.
        in: query
        name: inactive
        schema:
          type: boolean
      - $ref: '#/components/parameters/QueryLimit'
      - $ref: '#/components/parameters/PaginationToken'
      responses:
        '200':
          description: A list of general ledger accounts.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ListResponse'
                - properties:
                    items:
                      items:
                        $ref: '#/components/schemas/GLAccount'
                      type: array
                  type: object
        '400':
          $ref: '#/components/responses/BadRequest'
      security:
      - basicAuth:
        - gl_accounts:read
        - gl_entities:read
  /accounting/v2beta/gl-accounts/{id}:
    get:
      summary: Get GL account
      description: Retrieve a specific general ledger account.
      tags:
      - GL Accounts
      parameters:
      - $ref: '#/components/parameters/ResourceIDOrExternalID'
      responses:
        '200':
          description: A general ledger account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GLAccount'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - basicAuth:
        - gl_accounts:read
        - gl_entities:read
    patch:
      summary: Update account
      description: Update a general ledger account.
      tags:
      - GL Accounts
      parameters:
      - $ref: '#/components/parameters/ResourceID'
      - $ref: '#/components/parameters/IfMatchETag'
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/GLAccountJSONPatchRequest'
            examples:
              assignAccountId:
                summary: Assign the Atlar account resource ID that corresponds to this general ledger account.
                value:
                - op: replace
                  path: /accountId
                  value: 9323f8bd-e368-4760-87e7-b2552a6e444a
      responses:
        '202':
          description: The updated general ledger account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GLAccount'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - basicAuth:
        - gl_accounts:update
        - gl_entities:read
        - accounts:read
  /accounting/v2beta/gl-entities:
    post:
      summary: Create entity
      description: Create a new GL entity.
      tags:
      - GL Entities
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGLEntityRequest'
      responses:
        '201':
          description: The created GL entity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GLEntity'
        '400':
          $ref: '#/components/responses/BadRequest'
      security:
      - basicAuth:
        - connections:read
        - gl_entities:create
    get:
      summary: List entities
      description: Returns a list of GL entities.
      tags:
      - GL Entities
      parameters:
      - description: Only include entities that are associated with the specified connection.
        in: query
        name: connectionId
        schema:
          $ref: '#/components/schemas/ResourceID'
      - $ref: '#/components/parameters/QueryLimit'
      - $ref: '#/components/parameters/PaginationToken'
      responses:
        '200':
          description: A list of GL entities.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ListResponse'
                - properties:
                    items:
                      items:
                        $ref: '#/components/schemas/GLEntity'
                      type: array
                  type: object
        '400':
          $ref: '#/components/responses/BadRequest'
      security:
      - basicAuth:
        - gl_entities:read
  /accounting/v2beta/gl-entities/{id}:
    get:
      summary: Get entity
      description: Retrieve a specific GL entity.
      tags:
      - GL Entities
      parameters:
      - $ref: '#/components/parameters/ResourceIDOrExternalID'
      responses:
        '200':
          description: An entity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GLEntity'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - basicAuth:
        - gl_entities:read
    patch:
      summary: Update entity
      description: Update a GL entity.
      tags:
      - GL Entities
      parameters:
      - $ref: '#/components/parameters/ResourceID'
      - $ref: '#/components/parameters/IfMatchETag'
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/GLEntityJSONPatchRequest'
            examples:
              replaceEntityId:
                summary: Assign the Atlar entity resource ID that corresponds to this GL entity.
                value:
                - op: replace
                  path: /entityId
                  value: f2d12456-f579-4d86-8e77-90168b3bcb99
      responses:
        '202':
          description: The updated entity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GLEntity'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - basicAuth:
        - entities:read
        - gl_entities:read
        - gl_entities:update
  /analytics/v2beta/forecasted-transactions:
    post:
      summary: Create forecasted transaction
      description: Create a forecasted transaction.
      tags:
      - Forecasted Transactions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateForecastedTransactionRequest'
      responses:
        '201':
          description: The created forecasted transaction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForecastedTransaction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
      security:
      - basicAuth:
        - accounts:read
        - forecasted_transactions:create
    get:
      summary: List forecasted transactions
      description: Returns a list of forecasted transactions. For further details on Pagination, see general section above.
      tags:
      - Forecasted Transactions
      parameters:
      - description: Only include forecasted transactions with the given account.
        in: query
        name: accountId
        schema:
          type: string
          examples:
          - 31d593d7-fff9-4783-aa1d-92acb7b21a19
      - description: Only include forecasted transactions that belong to the given batch.
        in: query
        name: batchId
        schema:
          type: string
          examples:
          - fc80aa63-d8e7-45cc-a241-1ac76e0e9454
      - description: Include only forecasted transactions with property `date` matching the given value. The parameter value may be either a string for equality matching, or an object for range-like matching criteria.
        in: query
        name: date
        explode: true
        style: deepObject
        schema:
          oneOf:
          - type: string
            format: date
            example: '2022-01-15'
            description: Include only forecasted transactions with `date` equal to the given value.
          - type: object
            properties:
              gte:
                type: string
                format: date
                example: '2022-01-01'
                description: Include only forecasted transactions with `date` after or equal to given date.
              lte:
                type: string
                format: date
                example: '2022-01-31'
                description: Include only forecasted transactions with `date` before or equal to given date.
              eq:
                type: string
                format: date
                example: '2022-01-15'
                description: Include only forecasted transactions with `date` equal to given date.
      - $ref: '#/components/parameters/QueryLimit'
      - $ref: '#/components/parameters/PaginationToken'
      responses:
        '200':
          description: List of forecasted transactions.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ListResponse'
                - properties:
                    items:
                      items:
                        $ref: '#/components/schemas/ForecastedTransaction'
                      type: array
                  type: object
        '400':
          $ref: '#/components/responses/BadRequest'
      security:
      - basicAuth:
        - forecasted_transactions:read
  /analytics/v2beta/forecasted-transactions/{id}:
    get:
      summary: Get forecasted transaction
      description: Get the forecasted transaction with the specified ID.
      tags:
      - Forecasted Transactions
      parameters:
      - $ref: '#/components/parameters/ResourceIDOrExternalID'
      responses:
        '200':
          description: A forecasted transaction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForecastedTransaction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - basicAuth:
        - forecasted_transactions:read
    delete:
      summary: Delete forecasted transaction
      description: Delete the forecasted transaction with the specified ID.
      tags:
      - Forecasted Transactions
      parameters:
      - $ref: '#/components/parameters/ResourceID'
        description: Forecasted transaction ID
      responses:
        '204':
          description: The forecasted transaction was deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - basicAuth:
        - forecasted_transactions:delete
    patch:
      summary: Update forecasted transaction
      description: Update the forecasted transaction with the specified ID using JSON Patch operations, given that the provided ETag matches. Some fields can only be updated if the forecasted transaction was manually created by a user (origin type USER). For example, if the forecasted transaction was automatically generated from accounting data, the counterpartyId cannot be changed.
      tags:
      - Forecasted Transactions
      parameters:
      - $ref: '#/components/parameters/ResourceID'
      - $ref: '#/components/parameters/IfMatchETag'
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/ForecastedTransactionJSONPatchRequest'
            examples:
              replaceDescription:
                summary: Replace the description
                value:
                - op: replace
                  path: /description
                  value: New description
      responses:
        '200':
          description: The updated forecasted transaction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForecastedTransaction'
        '400':
          $ref: '#/components/responses/BadRequest'
      security:
      - basicAuth:
        - accounts:read
        - forecasted_transactions:update
  /analytics/v2beta/forecasted-transactions/{id}/events:
    get:
      summary: List forecasted transaction events
      description: Retrieve events for a specific forecasted transaction. Returns a list of events. For further details on Pagination, see the section above.
      tags:
      - Forecasted Transactions
      parameters:
      - $ref: '#/components/parameters/ResourceID'
      - $ref: '#/components/parameters/QueryLimit'
      - $ref: '#/components/parameters/PaginationToken'
      responses:
        '200':
          description: List of forecasted transaction events.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ListResponse'
                - properties:
                    items:
                      items:
                        $ref: '#/components/schemas/Event'
                      type: array
                  type: object
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - basicAuth:
        - forecasted_transactions:read
  /connectivity/v2beta/connections:
    get:
      summary: List connections
      description: Returns a list of connections. For further details on Pagination, see general section above.
      tags:
      - Connections
      parameters:
      - $ref: '#/components/parameters/QueryLimit'
      - $ref: '#/components/parameters/PaginationToken'
      responses:
        '200':
          description: List of connections.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ListResponse'
                - properties:
                    items:
                      items:
                        $ref: '#/components/schemas/Connection'
                      type: array
                  type: object
        '400':
          $ref: '#/components/responses/BadRequest'
      security:
      - basicAuth:
        - connections:read
  /connectivity/v2beta/connections/{cid}/reports:
    get:
      summary: List connection reports
      description: Retrieve all connection reports.
      tags:
      - Connections
      parameters:
      - $ref: '#/components/parameters/ConnectionID'
        description: Connection ID
      - $ref: '#/components/parameters/QueryLimit'
      - $ref: '#/components/parameters/PaginationToken'
      - name: from
        in: query
        description: Filter reports created at or after this timestamp.
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        description: Filter reports created at or before this timestamp.
        schema:
          type: string
          format: date-time
      - in: query
        name: type
        description: The report type to filter for.
        schema:
          $ref: '#/components/schemas/ReportType'
      - in: query
        name: statementType
        description: The statement type to filter for. Only applicable if type is STATEMENT.
        schema:
          $ref: '#/components/schemas/StatementType'
      responses:
        '200':
          description: List of connection reports.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ListResponse'
                - properties:
                    items:
                      items:
                        $ref: '#/components/schemas/ConnectionReport'
                      type: array
                  type: object
        '400':
          $ref: '#/components/responses/BadRequest'
      security:
      - basicAuth:
        - connections:read
        - connection_reports:read
    post:
      summary: Create report
      description: 'Create a report. This is used for manual upload of data. For instance if having raw camt.053/mt940 files

        but not wanting to set up a connection to automatically fetch them, or, if the atlar/third-party does not support

        fetching of the data.'
      tags:
      - Connections
      parameters:
      - $ref: '#/components/parameters/ConnectionID'
        description: Connection ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConnectionReportRequest'
            examples:
              EndOfDayStatement:
                summary: End-of-day statement with balances and transactions
                value:
                  statements:
                  - type: BOOKED
                    period:
                      type: EODY
                      localDate: '2024-09-26'
                    account:
                      market: DE
                      currency: EUR
                      timezone: Europe/Berlin
                      identifiers:
                      - type: IBAN
                        market: DE
                        number: DE29700700240109999999
                      routing:
                      - type: BIC
                        number: DEUTDEBBXXX
                    holder:
                      legalName: Acme GmbH
                      partyType: COMPANY
                    balances:
                    - type: BOOKED
                      reportedType: OPEN
                      localDate: '2024-09-26'
                      amount:
                        currency: EUR
                        stringValue: '5000.00'
                    - type: BOOKED
                      reportedType: CLOSE
                      localDate: '2024-09-26'
                      amount:
                        currency: EUR
                        stringValue: '10000.00'
                    transactions:
                    - uniqueID: acme-2024-09-26-0001
                      status: BOOKED
                      bookedDate: '2024-09-26'
                      valueDate: '2024-09-27'
                      description: Invoice 1042
                      amount:
                        currency: EUR
                        stringValue: '6000.00'
                      references:
                        endToEndId: E2E-1042
                      counterparty:
                        holder:
                          legalName: Beispiel AG
                          partyType: COMPANY
                        account:
                          market: DE
                          currency: EUR
                          rawIdentifierNumber: DE02120300000000202051
                    - uniqueID: acme-2024-09-26-0002
                      status: BOOKED
                      bookedDate: '2024-09-26'
                      description: Office rent
                      amount:
                        currency: EUR
                        stringValue: '-1000.00'
          multipart/form-data:
            schema:
              type: object
              properties:
                fileContentType:
                  type: string
                  $ref: '#/components/schemas/ContentType'
                file:
                  type: string
                  format: binary
              required:
              - fileContentType
              - file
      responses:
        '201':
          description: The created report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionReport'
        '400':
          $ref: '#/components/responses/BadRequest'
      security:
      - basicAuth:
        - connections:read
        - connection_reports:create
  /connectivity/v2beta/connections/{cid}/reports/{id}/bank-statements:
    get:
      summary: List bank statements
      description: List bank statements.
      tags:
      - Connections
      parameters:
      - $ref: '#/components/parameters/ConnectionID'
        description: Connection ID
      - $ref: '#/components/parameters/ResourceID'
        description: Report ID
      - $ref: '#/components/parameters/QueryLimit'
      - $ref: '#/components/parameters/PaginationToken'
      - in: query
        name: account_id
        description: The account ID to filter for.
        schema:
          $ref: '#/components/schemas/ResourceID'
      - in: query
        name: type
        description: The statement period type to filter for.
        schema:
          $ref: '#/components/schemas/StatementPeriodType'
      - in: query
        name: from
        description: The from date to filter for. Returns all statements that contain transactions after or equal to this date.
        schema:
          $ref: '#/components/schemas/Date'
      - in: query
        name: to
        description: The to date to filter for. Returns all statements that contain transactions before or equal to this date.
        schema:
          $ref: '#/components/schemas/Date'
      responses:
        '200':
          description: List of bank statements.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ListResponse'
                - properties:
                    items:
                      items:
                        $ref: '#/components/schemas/BankStatement'
                      type: array
                  type: object
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - basicAuth:
        - connections:read
        - connection_reports:read
  /connectivity/v2beta/connections/{cid}/reports/{id}/content:
    get:
      summary: Get report content
      description: Download the connection report content. Use the `format` query parameter to specify the desired output format.
      tags:
      - Connections
      parameters:
      - $ref: '#/components/parameters/ConnectionID'
        description: Connection ID
      - $ref: '#/components/parameters/ResourceID'
        description: Report ID
      - in: query
        name: format
        schema:
          $ref: '#/components/schemas/ReportContentFormat'
      - in: query
        name: externalIdAsEndToEndId
        description: 'When true, remaps any matched payment''s `externalId` to the `EndToEndId` XML element in CAMT.053 output.

          If a transaction has an `atlar.credit_transfers.externalId` proprietary reference, its value

          will be placed in the `EndToEndId` XML element, and the original `EndToEndId` value will be moved to a proprietary

          reference. Transactions without an external ID remain unchanged. Only applies to Atlar CAMT.053 formats.

          Only use this flag when your system does not support reading off the Proprietary References of the CAMT.053 output.

          '
        schema:
          type: boolean
          default: false
      - in: query
        name: forceStrict
        description: 'When true, CAMT.053 output is generated in strict mode with ISO 20022 field length limits applied.

          Report and statement identifiers are limited to 35 characters and dashes are stripped, so clients must

          reinsert dashes into those 32-character ids to look them up on the API.

          Only applies to Atlar CAMT.053 formats. Defaults to false.

          '
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: The raw bytes.
          content:
            application/octet-stream: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - basicAuth:
        - connections:read
        - connection_reports:read
        - connection_reports_content:read
