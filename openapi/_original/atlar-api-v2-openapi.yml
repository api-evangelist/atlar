        path:
          type: string
          minLength: 11
          maxLength: 74
          pattern: ^/metadata/[A-Za-z0-9_\.\+\-]{1,64}$
        value:
          type: string
          minLength: 1
          maxLength: 512
      additionalProperties: false
      required:
      - op
      - path
      - value
    PendingTransactionJSONPatchRemoveMetadataKey:
      description: Remove a specific metadata key.
      type: object
      properties:
        op:
          type: string
          enum:
          - remove
        path:
          type: string
          minLength: 11
          maxLength: 74
          pattern: ^/metadata/[A-Za-z0-9_\.\+\-]{1,64}$
      additionalProperties: false
      required:
      - op
      - path
