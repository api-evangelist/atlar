      - targetDocumentType
      - targetDocumentExternalId
    DocumentInvoiceDetails:
      type: object
      properties:
        settledDate:
          $ref: '#/components/schemas/Date'
          description: Date of the last applied payment that fully settles the invoice. Empty while open.
          x-go-type-skip-optional-pointer: true
        daysToDue:
          type: integer
          format: int64
          description: Days from issue date to due date.
        daysToSettled:
          type: integer
          format: int64
          description: Days from issue date to settled date. Empty while the invoice is open.
        settlementDaysPastDue:
          type: integer
          format: int64
          description: Days from due date to settled date. Empty while the invoice is open. May be negative if paid early.
