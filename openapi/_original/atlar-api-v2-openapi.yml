      required:
      - op
      - path
    ExternalAccountJSONPatchReplaceAlias:
      description: Set alias.
      type: object
      properties:
        op:
          type: string
          enum:
          - replace
        path:
          type: string
          enum:
          - /alias
        value:
          type: string
          minLength: 1
          maxLength: 255
      additionalProperties: false
      required:
      - op
      - path
      - value
    ExternalAccountJSONPatchAddIdentifiers:
      description: Adds an account identifier.
      type: object
      properties:
        op:
          type: string
          enum:
          - add
