        id:
          $ref: '#/components/schemas/ResourceID'
          readOnly: true
        organizationId:
          $ref: '#/components/schemas/OrganizationID'
          readOnly: true
        scenarioId:
          $ref: '#/components/schemas/ResourceID'
        externalId:
          $ref: '#/components/schemas/ExternalID'
        parent:
          $ref: '#/components/schemas/ForecastedTransactionParent'
        accountId:
