  /iam/v2/oauth2/token:
    post:
      summary: Create OAuth 2.0 access token
      description: 'This endpoint is an OAuth 2.0 <a href="https://datatracker.ietf.org/doc/html/rfc6749#section-3.2">token endpoint</a> and can be used by a client to obtain an access token.


        Use <a href="https://app.atlar.com/users/all">programmatic access user</a> credentials as OAuth 2.0 client credentials.

        Use the <i>access key</i> as <a href="https://datatracker.ietf.org/doc/html/rfc6749#section-2.2">client identifier (`client_id`)</a>.

        Use the <i>secret</i> as <a href="https://datatracker.ietf.org/doc/html/rfc6749#section-2.3.1">client password (`client_secret`)</a>.


        This endpoint supports <a href="https://datatracker.ietf.org/doc/html/rfc6749#section-2.3.1">authentication using HTTP Basic auth</a>.


        Supported grant types:

        <a href="https://datatracker.ietf.org/doc/html/rfc6749#section-4.4">client_credentials</a> for programmatic access users.


        <a href="https://datatracker.ietf.org/doc/html/rfc6749#section-4.1">authorization_code</a> (with PKCE) and

        <a href="https://datatracker.ietf.org/doc/html/rfc6749#section-6">refresh_token</a> for MCP CIMD clients.

        '
      security:
      - basicAuth: []
      tags:
      - OAuth
      requestBody:
        description: OAuth 2.0 request parameters.
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                grant_type:
                  type: string
                  enum:
                  - client_credentials
                  - authorization_code
                  - refresh_token
                client_id:
                  type: string
                client_secret:
                  type: string
                code:
                  description: Authorization code returned by the authorization endpoint. Required for `grant_type=authorization_code`.
                  type: string
                code_verifier:
                  description: PKCE code verifier matching the `code_challenge` sent at the authorization endpoint. Required for `grant_type=authorization_code`.
                  type: string
                refresh_token:
                  description: Refresh token previously issued by this endpoint. Required for `grant_type=refresh_token`.
                  type: string
              required:
              - grant_type
      responses:
        '200':
          description: Successful OAuth 2.0 <a href="https://datatracker.ietf.org/doc/html/rfc6749#section-4.4.3">access token response</a>.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuth2AccessTokenResponse'
        '400':
          description: Invalid access token request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuth2ErrorResponse'
        '401':
          description: Client authentication failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuth2ErrorResponse'
