        targetDocumentType:
          $ref: '#/components/schemas/DocumentType'
          description: The type of the target document.
        targetDocumentExternalId:
          type: string
          description: The ID of the target document in the external ERP system.
        date:
          $ref: '#/components/schemas/Date'
          description: The date of the document application.
          x-go-type-skip-optional-pointer: true
