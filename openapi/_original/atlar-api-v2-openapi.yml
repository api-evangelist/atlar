      - BIC
      - AT_BLZ
      - AU_BSB
      - BD_BRN
      - BR_BRANCH
      - BR_COMPE
      - BR_ISP
      - CA_CPA
      - CH_BCC
      - CH_SIC
      - CL_SBIF
      - CN_APS
      - CZ_NBC
      - DE_BLZ
      - ES_NCC
      - GB_DSC
      - GR_BIC
      - HK_NCC
      - IE_NCC
      - IL_NCC
      - IN_FSC
      - IT_NCC
      - JP_ZGN
      - KR_BOK
      - KR_KFTC
      - MX_ABM
      - MY_NCC
      - NZ_NCC
      - PH_BRSTN
      - PL_KNR
      - PT_NCC
      - RU_CBC
      - SE_SBA
      - SG_IBG
      - TH_CBC
      - TW_NCC
      - US_ABA
      - US_PID
      - VN_CITAD
      - ZA_NCC
      description: A routing identifier of type `BIC` must be provided to support cross-border/SWIFT payments.
      example: BIC
    RoutingConstraints:
      description: Constraints on a `RoutingIdentifier`.
      type: object
      properties:
        accountNumberType:
          $ref: '#/components/schemas/AccountIdentifierType'
