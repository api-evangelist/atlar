            postalCode:
              example: '11111'
              type: string
              maxLength: 16
            streetName:
              example: Example street
              type: string
              maxLength: 64
            streetNumber:
              example: '47'
              type: string
              maxLength: 16
            rawAddressLines:
              type: array
              description: International unstructured address lines, as they might appear on a mailing label.
              items:
                type: string
                maxLength: 255
              maxItems: 5
          readOnly: true
        account:
          $ref: '#/components/schemas/CounterpartyAccount'
          readOnly: true
    CreateForecastedTransactionRequest:
      type: object
