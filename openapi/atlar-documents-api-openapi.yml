    BatchGetResourceIDVersions:
      in: query
      name: idvs
      description: 'Atlar resource IDs at specific versions, each encoded as `<id>@<version>`

        (e.g. `a1b2c3d4-e5f6-7890-abcd-ef1234567890@3`). Mutually exclusive with `ids`.

        Exactly one of `ids` or `idvs` must be provided.'
      schema:
        type: array
        items:
          type: string
          pattern: ^[a-zA-Z0-9\-]{1,256}@[1-9][0-9]{0,5}$
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890@3
        minItems: 1
        maxItems: 100
    ResourceIDOrExternalID:
      in: path
      name: id
      description: Atlar resource ID or External ID. Prefix External IDs with `external:`.
      schema:
        type: string
        pattern: ^external:[a-zA-Z0-9._\-+=]{1,64}$|^[a-zA-Z0-9\-]{1,256}$
      required: true
    ResourceID:
      in: path
      name: id
      description: Atlar resource ID.
      schema:
        type: string
        pattern: ^[a-zA-Z0-9\-]{1,256}$
      required: true
    BatchGetResourceIDsOptional:
      in: query
      name: ids
      description: 'Atlar resource IDs (latest versions). Mutually exclusive with `idvs`.

        Exactly one of `ids` or `idvs` must be provided.'
      schema:
        type: array
        items:
          type: string
          pattern: ^[a-zA-Z0-9\-]{1,256}$
        minItems: 1
        maxItems: 100
    IfMatchETag:
      in: header
      name: If-Match
      description: ETag (version) of resource to be updated.
      schema:
        type: string
        pattern: ^version:\d{1,4}$
      examples:
        versionNumberETag:
          value: version:1
    QueryLimit:
      in: query
      name: limit
      description: Limit the number of items in resulting query response.
      schema:
        type: integer
        default: 100
        minimum: 1
        maximum: 500
    PaginationToken:
      in: query
      name: token
      description: If a query response contains a non-empty `nextToken`, use that value as `token` query parameter to continue pagination.
      schema:
        type: string
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
