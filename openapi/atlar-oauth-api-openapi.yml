openapi: 3.2.0
info:
  title: Atlar API (v2) OAuth API
  description: Atlar API (v2)
  version: '0.1'
  contact:
    email: support@atlar.com
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.txt
servers:
- url: https://api.atlar.com
tags:
- name: OAuth
  description: OAuth 2.0 endpoints.
  x-displayName: OAuth
paths:
  /iam/v2/oauth2/token:
    post:
      summary: Create OAuth 2.0 access token
      description: 'This endpoint is an OAuth 2.0 token endpoint and can be used by a client to obtain an access token.


        Use programmatic access user credentials as OAuth 2.0 client credentials.

        Use the access key as client identifier (`client_id`).

        Use the secret as client password (`client_secret`).


        This endpoint supports authentication using HTTP Basic auth.


        Supported grant types:

        client_credentials for programmatic access users.


        authorization_code (with PKCE) and

        refresh_token for MCP CIMD clients.'
      security:
      - basicAuth: []
      tags:
      - OAuth
      requestBody:
        description: OAuth 2.0 request parameters.
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                grant_type:
                  type: string
                  enum:
                  - client_credentials
                  - authorization_code
                  - refresh_token
                client_id:
                  type: string
                client_secret:
                  type: string
                code:
                  description: Authorization code returned by the authorization endpoint. Required for `grant_type=authorization_code`.
                  type: string
                code_verifier:
                  description: PKCE code verifier matching the `code_challenge` sent at the authorization endpoint. Required for `grant_type=authorization_code`.
                  type: string
                refresh_token:
                  description: Refresh token previously issued by this endpoint. Required for `grant_type=refresh_token`.
                  type: string
              required:
              - grant_type
      responses:
        '200':
          description: Successful OAuth 2.0 <a href="https://datatracker.ietf.org/doc/html/rfc6749#section-4.4.3">access token response</a>.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuth2AccessTokenResponse'
        '400':
          description: Invalid access token request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuth2ErrorResponse'
        '401':
          description: Client authentication failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuth2ErrorResponse'
      operationId: postIamV2Oauth2Token
      x-operation-id-source: derived
components:
  schemas:
    OAuth2ErrorResponse:
      description: OAuth 2.0 error response.
      externalDocs:
        url: https://datatracker.ietf.org/doc/html/rfc6749#section-5.2
      type: object
      properties:
        error:
          description: OAuth 2.0 error code. See a <a href="https://datatracker.ietf.org/doc/html/rfc6749#section-5.2">RFC 6749</a> for details.
          type: string
          enum:
          - invalid_request
          - invalid_client
          - invalid_grant
          - unauthorized_client
          - unsupported_grant_type
        error_description:
          description: Human readable description of the error.
          type: string
          example: unsupported grant type
      required:
      - error
      additionalProperties: false
    OAuth2AccessTokenResponse:
      description: Successful OAuth 2.0 access token response.
      externalDocs:
        url: https://datatracker.ietf.org/doc/html/rfc6749#section-4.4.3
      type: object
      properties:
        access_token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.e30.Xi9Rplok2DNmNGBPC1CMxUY-ZBkzY-g-sxqzKkWjViU
        token_type:
          type: string
          example: Bearer
        expires_in:
          description: The lifetime in seconds of the access token.
          type: integer
          format: int64
          example: 299
        refresh_token:
          description: 'Opaque <a href="https://datatracker.ietf.org/doc/html/rfc6749#section-1.5">OAuth 2.0 refresh token</a>

            that the client can use to obtain a new access token. Only present when the authorization server

            issued one for the grant.

            '
          type: string
      required:
      - access_token
      - token_type
      additionalProperties: false
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
