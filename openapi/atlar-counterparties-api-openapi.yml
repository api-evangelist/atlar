openapi: 3.2.0
info:
  title: Atlar API (v2) Counterparties API
  description: Atlar API (v2)
  version: '0.1'
  contact:
    email: support@atlar.com
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.txt
servers:
- url: https://api.atlar.com
tags:
- name: Counterparties
  description: Counterparties are entities that the account holder has a relationship with.
  x-displayName: Counterparties
paths:
  /payments/v2/counterparties:
    post:
      summary: Create counterparty
      description: Create a new counterparty.
      tags:
      - Counterparties
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCounterpartyRequest'
      responses:
        '201':
          description: The created counterparty.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Counterparty'
        '400':
          $ref: '#/components/responses/BadRequest'
      security:
      - basicAuth:
        - counterparties:create
      operationId: postPaymentsV2Counterparties
      x-operation-id-source: derived
    get:
      summary: List counterparties
      description: Returns a list of counterparties. For further details on Pagination, see general section above.
      tags:
      - Counterparties
      parameters:
      - description: Free text search query term for counterparty name, account identifiers and external metadata. Must be at least 3 characters.
        in: query
        name: query
        schema:
          type: string
          minLength: 3
          maxLength: 255
      - in: query
        name: entityIdsIn
        explode: true
        schema:
          type: array
          items:
            type: string
      - $ref: '#/components/parameters/QueryLimit'
      - $ref: '#/components/parameters/PaginationToken'
      responses:
        '200':
          description: List of counterparties.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ListResponse'
                - properties:
                    items:
                      items:
                        $ref: '#/components/schemas/Counterparty'
                      type: array
                  type: object
        '400':
          $ref: '#/components/responses/BadRequest'
      security:
      - basicAuth:
        - counterparties:read
      operationId: getPaymentsV2Counterparties
      x-operation-id-source: derived
  /payments/v2/counterparties/{id}:
    get:
      summary: Get counterparty
      description: Retrieve a specific counterparty.
      tags:
      - Counterparties
      parameters:
      - $ref: '#/components/parameters/ResourceIDOrExternalID'
      responses:
        '200':
          description: A counterparty.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Counterparty'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - basicAuth:
        - counterparties:read
      operationId: getPaymentsV2CounterpartiesById
      x-operation-id-source: derived
    patch:
      summary: Update counterparty
      description: Update a counterparty.
      tags:
      - Counterparties
      parameters:
      - $ref: '#/components/parameters/ResourceIDOrExternalID'
      - $ref: '#/components/parameters/IfMatchETag'
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/CounterpartyJSONPatchRequest'
            examples:
              UpdateLegalName:
                summary: Update legal name
                value:
                - op: replace
                  path: /legalName
                  value: Acme Inc
              UpdateNationalID:
                summary: Update national identifier
                value:
                - op: replace
                  path: /nationalIdentifier
                  value:
                    market: SE
                    type: CIVIC
                    number: '2012121212'
              UpdateEmail:
                summary: Update email address
                value:
                - op: replace
                  path: /email
                  value: john.smith@example.com
              UpdatePhone:
                summary: Update phone number
                value:
                - op: replace
                  path: /phone
                  value: '+12505550199'
              UpdateAddress:
                summary: Update postal address
                value:
                - op: replace
                  path: /address
                  value:
                    country: US
                    city: New York
                    postalCode: '10017'
                    streetName: E 42nd St
                    streetNumber: '89'
              UpdateExternalID:
                summary: Update external ID.
                value:
                - op: replace
                  path: /externalId
                  value: my-counterparty-id
      responses:
        '200':
          description: The updated counterparty.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Counterparty'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - basicAuth:
        - counterparties:update
      operationId: patchPaymentsV2CounterpartiesById
      x-operation-id-source: derived
    delete:
      summary: Delete counterparty
      description: Deletes the specified counterparty.
      tags:
      - Counterparties
      parameters:
      - $ref: '#/components/parameters/ResourceIDOrExternalID'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - basicAuth:
        - counterparties:delete
        - external_accounts:delete
      operationId: deletePaymentsV2CounterpartiesById
      x-operation-id-source: derived
  /payments/v2/counterparties/{id}/events:
    get:
      summary: List counterparty events
      description: Retrieve events for a specific counterparty. Returns a list of events. For further details on Pagination, see the section above.
      tags:
      - Counterparties
      parameters:
      - $ref: '#/components/parameters/ResourceID'
      - $ref: '#/components/parameters/QueryLimit'
      - $ref: '#/components/parameters/PaginationToken'
      responses:
        '200':
          description: List of counterparty events.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ListResponse'
                - properties:
                    items:
                      items:
                        $ref: '#/components/schemas/Event'
                      type: array
                  type: object
        '400':
          $ref: '#/components/responses/NotFound'
      security:
      - basicAuth:
        - counterparties:read
      operationId: getPaymentsV2CounterpartiesByIdEvents
      x-operation-id-source: derived
components:
  responses:
    BadRequest:
      description: Bad request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 400
            message: There is some problem with the data you submitted.
    NoContent:
      description: No content.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 204
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 404
            message: Resource not found.
  schemas:
    RoutingIdentifierType:
      type: string
      enum:
      - BIC
      - AT_BLZ
      - AU_BSB
      - BD_BRN
      - BR_BRANCH
      - BR_COMPE
      - BR_ISP
      - CA_CPA
      - CH_BCC
      - CH_SIC
      - CL_SBIF
      - CN_APS
      - CZ_NBC
      - DE_BLZ
      - ES_NCC
      - GB_DSC
      - GR_BIC
      - HK_NCC
      - IE_NCC
      - IL_NCC
      - IN_FSC
      - IT_NCC
      - JP_ZGN
      - KR_BOK
      - KR_KFTC
      - MX_ABM
      - MY_NCC
      - NZ_NCC
      - PH_BRSTN
      - PL_KNR
      - PT_NCC
      - RU_CBC
      - SE_SBA
      - SG_IBG
      - TH_CBC
      - TW_NCC
      - US_ABA
      - US_PID
      - VN_CITAD
      - ZA_NCC
      description: A routing identifier of type `BIC` must be provided to support cross-border/SWIFT payments.
      example: BIC
    CreateCounterpartyRequest:
      type: object
      properties:
        legalName:
          description: Legal name of the counterparty. E.g. a company's legal business name, or an individual's full legal name.
          type: string
          maxLength: 96
          example: Example Company GmbH
        alias:
          description: An additional name, an alias, for the counterparty.
          type: string
          maxLength: 255
          example: 'Customer #123'
        partyType:
          $ref: '#/components/schemas/PartyType'
        address:
          description: Address details for the counterparty.
          $ref: '#/components/schemas/Address'
        email:
          description: Email of the counterparty.
          example: john.smith@example.com
          type: string
          maxLength: 256
        phone:
          description: Phone number of the counterparty.
          example: '+46123456789'
          type: string
          maxLength: 64
        accounts:
          type: array
          description: An optional list of external accounts to create for this counterparty. Note that external account is a separate API resource. One counterparty can have multiple external accounts.
          items:
            $ref: '#/components/schemas/CreateEmbeddedExternalAccountRequest'
          x-omitempty: true
        externalId:
          $ref: '#/components/schemas/ExternalID'
        metadata:
          $ref: '#/components/schemas/Metadata'
        nationalIdentifier:
          description: The national identifier of the counterparty.
          $ref: '#/components/schemas/NationalIdentifier'
        entityIds:
          type: array
          description: An optional list of entity IDs that this counterparty belongs to. If empty, the counterparty is not associated with any specific entity and can be used by all in the organization.
          items:
            $ref: '#/components/schemas/ResourceID'
          maxItems: 100
          uniqueItems: true
          x-omitempty: true
      required:
      - legalName
    Counterparty:
      type: object
      description: A counterparty represents a person or a legal business entity.
      properties:
        id:
          $ref: '#/components/schemas/ResourceID'
          example: f3efbb73-4e5b-4b22-adeb-918bbf1dfbd8
        organizationId:
          $ref: '#/components/schemas/OrganizationID'
        legalName:
          description: Legal name of the counterparty. E.g. a company's legal business name, or an individual's full legal name.
          type: string
          readOnly: true
          examples:
          - Example Company GmbH
          - John Smith
        partyType:
          $ref: '#/components/schemas/PartyType'
          readOnly: true
        alias:
          description: An additional name, an alias, for the counterparty.
          example: 'Customer #123'
          type: string
          readOnly: true
        address:
          description: Address details for the counterparty.
          $ref: '#/components/schemas/Address'
          readOnly: true
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/ExternalAccount'
          maxItems: 10
          readOnly: true
          x-omitempty: true
        email:
          description: Email of the counterparty.
          example: john.smith@example.com
          type: string
          readOnly: true
        phone:
          description: Phone number of the counterparty.
          example: '+46123456789'
          type: string
          readOnly: true
        nationalIdentifier:
          description: The national identifier of the counterparty.
          $ref: '#/components/schemas/NationalIdentifier'
        externalId:
          $ref: '#/components/schemas/ExternalID'
          readOnly: true
        metadata:
          $ref: '#/components/schemas/Metadata'
          readOnly: true
        created:
          $ref: '#/components/schemas/CreatedTimestamp'
        updated:
          $ref: '#/components/schemas/UpdatedTimestamp'
        version:
          $ref: '#/components/schemas/ResourceVersion'
        etag:
          $ref: '#/components/schemas/ETag'
        entityIds:
          type: array
          description: An optional list of entity IDs that this counterparty belongs to. If empty, the counterparty is not associated with any specific entity and can be used by all in the organization.
          items:
            $ref: '#/components/schemas/ResourceID'
          maxItems: 100
          uniqueItems: true
          readOnly: true
          x-omitempty: true
      required:
      - id
      - organizationId
      - legalName
      - created
      - updated
      - version
      - etag
    CounterpartyJSONPatchReplaceAddress:
      description: Set postal address.
      type: object
      properties:
        op:
          type: string
          enum:
          - replace
        path:
          type: string
          enum:
          - /address
        value:
          $ref: '#/components/schemas/Address'
      additionalProperties: false
      required:
      - op
      - path
      - value
    CounterpartyJSONPatchReplaceEmail:
      description: Set email address.
      type: object
      properties:
        op:
          type: string
          enum:
          - replace
        path:
          type: string
          enum:
          - /email
        value:
          type: string
          maxLength: 256
      additionalProperties: false
      required:
      - op
      - path
      - value
    Address:
      description: Postal address.
      type: object
      properties:
        country:
          $ref: '#/components/schemas/CountryCode'
          x-go-type-skip-optional-pointer: true
        countrySubdivision:
          $ref: '#/components/schemas/CountrySubdivision'
          x-go-type-skip-optional-pointer: true
        city:
          example: Stockholm
          type: string
          maxLength: 64
        postalCode:
          example: '11111'
          type: string
          maxLength: 16
        streetName:
          example: Example street
          type: string
          maxLength: 64
        streetNumber:
          example: '47'
          type: string
          maxLength: 16
    CounterpartyJSONPatchRemoveEmail:
      description: Remove email.
      type: object
      properties:
        op:
          type: string
          enum:
          - remove
        path:
          type: string
          enum:
          - /email
      additionalProperties: false
      required:
      - op
      - path
    PartyType:
      type: string
      description: The legal type of a party
      enum:
      - INDIVIDUAL
      - COMPANY
      example: INDIVIDUAL
    ExternalAccount:
      type: object
      description: An `ExternalAccount` represents an account that does not belong to your organization. A `Counterparty` can have multiple external accounts.
      properties:
        id:
          $ref: '#/components/schemas/ResourceID'
          examples:
          - eac2d761-c984-4072-ae39-018d6e77c24e
        organizationId:
          $ref: '#/components/schemas/OrganizationID'
        counterpartyId:
          example: c151b61e-33cc-4f89-ac8d-328f9efa59e9
          type: string
          description: The ID of the counterparty to which this external account belongs.
          readOnly: true
        entityIds:
          type: array
          items:
            $ref: '#/components/schemas/ResourceID'
          maxItems: 100
          uniqueItems: true
          readOnly: true
          x-omitempty: true
        market:
          $ref: '#/components/schemas/MarketCode'
          readOnly: true
        name:
          description: 'Name of the account.


            This is a read-only derived property. It will take the value of `alias` if `alias` is set, otherwise it will be a display name derived from the account number(s).'
          example: My Business Account
          type: string
          maxLength: 255
          readOnly: true
        alias:
          description: An additional name, an alias, for the account.
          example: My Business Account
          type: string
          maxLength: 255
          readOnly: true
        identifiers:
          type: array
          items:
            $ref: '#/components/schemas/AccountIdentifier'
          minItems: 1
          uniqueItems: true
          readOnly: true
        routing:
          type: array
          items:
            $ref: '#/components/schemas/RoutingIdentifier'
          uniqueItems: true
          readOnly: true
          x-omitempty: true
        externalId:
          $ref: '#/components/schemas/ExternalID'
          readOnly: true
        metadata:
          $ref: '#/components/schemas/Metadata'
          readOnly: true
        created:
          $ref: '#/components/schemas/CreatedTimestamp'
        updated:
          $ref: '#/components/schemas/UpdatedTimestamp'
        version:
          $ref: '#/components/schemas/ResourceVersion'
        etag:
          $ref: '#/components/schemas/ETag'
      required:
      - id
      - organizationId
      - counterpartyId
      - market
      - name
      - identifiers
      - created
      - updated
      - version
      - etag
    CounterpartyJSONPatchRemoveAlias:
      description: Remove alias.
      type: object
      properties:
        op:
          type: string
          enum:
          - remove
        path:
          type: string
          enum:
          - /alias
      additionalProperties: false
      required:
      - op
      - path
    UpdatedTimestamp:
      type: string
      format: date-time
      description: Time at which the resource was last updated.
      example: '2022-05-04T18:47:32.213842599Z'
      readOnly: true
    CounterpartyJSONPatchRemoveEntityIds:
      description: Remove entities.
      type: object
      properties:
        op:
          type: string
          enum:
          - remove
        path:
          type: string
          enum:
          - /entityIds
      additionalProperties: false
      required:
      - op
      - path
    ETag:
      type: string
      description: '[ETag](https://en.wikipedia.org/wiki/HTTP_ETag) based on the

        resource version. This can be passed along in `If-Match` HTTP

        header when updating a resource to perform a conditional

        update.'
      pattern: ^version:\d{1,4}$
      example: version:3
      readOnly: true
      externalDocs:
        url: https://en.wikipedia.org/wiki/HTTP_ETag
    ListResponse:
      type: object
      properties:
        items:
          description: A list of resources.
        nextToken:
          description: 'Pagination token for next page.

            The value will be a non-empty string if there are more resources to be fetched.

            The value will be an empty string if there are no more resources to be fetched.'
          type: string
          example: eyIxIjogIlRoaXMgaXMgYSBkdW1teSBwYWdpbmF0aW9uIHRva2VuLiJ9
        token:
          description: 'The pagination token that was used for this request.

            The value will be an empty string if no `token` query parameter was provided with the request.'
          type: string
          example: eyIwIjogIlRoaXMgaXMgYSBkdW1teSBwYWdpbmF0aW9uIHRva2VuLiJ9
        limit:
          description: The page limit that was used for this request.
          example: 100
          type: integer
      required:
      - items
      - nextToken
      - token
      - limit
    ResourceID:
      type: string
      description: Unique resource identifier.
      minLength: 32
      maxLength: 64
      examples:
      - 2ed9a3ee-60aa-4f9f-a858-2eed4eefbbc8
    CounterpartyJSONPatchRemoveNationalIdentifier:
      description: Remove national identifier.
      type: object
      properties:
        op:
          type: string
          enum:
          - remove
        path:
          type: string
          enum:
          - /nationalIdentifier
      additionalProperties: false
      required:
      - op
      - path
    CounterpartyJSONPatchReplacePartyType:
      description: Set party type.
      type: object
      properties:
        op:
          type: string
          enum:
          - replace
        path:
          type: string
          enum:
          - /partyType
        value:
          type: string
          $ref: '#/components/schemas/PartyType'
      additionalProperties: false
      required:
      - op
      - path
      - value
    CounterpartyJSONPatchRequest:
      description: JSON Patch request to update a counterparty.
      externalDocs:
        url: https://jsonpatch.com/
      type: array
      items:
        oneOf:
        - $ref: '#/components/schemas/CounterpartyJSONPatchReplaceLegalName'
        - $ref: '#/components/schemas/CounterpartyJSONPatchReplaceAlias'
        - $ref: '#/components/schemas/CounterpartyJSONPatchRemoveAlias'
        - $ref: '#/components/schemas/CounterpartyJSONPatchReplaceNationalIdentifier'
        - $ref: '#/components/schemas/CounterpartyJSONPatchRemoveNationalIdentifier'
        - $ref: '#/components/schemas/CounterpartyJSONPatchReplaceEmail'
        - $ref: '#/components/schemas/CounterpartyJSONPatchRemoveEmail'
        - $ref: '#/components/schemas/CounterpartyJSONPatchReplaceAddress'
        - $ref: '#/components/schemas/CounterpartyJSONPatchReplaceAddressCity'
        - $ref: '#/components/schemas/CounterpartyJSONPatchReplaceAddressCountry'
        - $ref: '#/components/schemas/CounterpartyJSONPatchReplacePhone'
        - $ref: '#/components/schemas/CounterpartyJSONPatchRemovePhone'
        - $ref: '#/components/schemas/CounterpartyJSONPatchReplacePartyType'
        - $ref: '#/components/schemas/CounterpartyJSONPatchRemovePartyType'
        - $ref: '#/components/schemas/CounterpartyJSONPatchReplaceEntityIds'
        - $ref: '#/components/schemas/CounterpartyJSONPatchRemoveEntityIds'
        - $ref: '#/components/schemas/CounterpartyJSONPatchReplaceExternalId'
        - $ref: '#/components/schemas/CounterpartyJSONPatchRemoveExternalId'
    MarketCode:
      type: string
      description: Two-letter ISO 3166-1 alpha2 country code.
      example: DE
      minLength: 2
      maxLength: 2
      pattern: ^[A-Z]{2,2}$
    RoutingConstraints:
      description: Constraints on a `RoutingIdentifier`.
      type: object
      properties:
        accountNumberType:
          $ref: '#/components/schemas/AccountIdentifierType'
          x-go-type-skip-optional-pointer: true
        scheme:
          type: string
    AccountIdentifierType:
      type: string
      enum:
      - IBAN
      - NUMBER
      - ADYEN
      - AU_BPAY_BILLER_CODE
      - DK_FIK
      - INVESTMENT_NUMBER
      - NATIONAL_ID_NUMBER
      - PAYPAL
      - PROPRIETARY
      - SE_BANKGIRO
      - SE_PLUSGIRO
      - SOLDO
      - WALLET_ADYEN_BALANCE_PLATFORM
      - WALLET_AIRWALLEX
      - WALLET_AIRWALLEX_NUMBER
      - WALLET_CURRENCYCLOUD
      - WALLET_FLASH_PAYMENTS
      - WALLET_FREEMARKET
      - WALLET_HYPERWALLET
      - WALLET_INPAY
      - WALLET_LEAD
      - WALLET_MERCURY
      - WALLET_MONEYCORP
      - WALLET_PAYHAWK
      - WALLET_REVOLUT
      - WALLET_SKRILL
      - WALLET_STRIPE
      - WALLET_SWISSQUOTE
      - WALLET_UNIT
      description: 'Account Identifier type. Choose among:

        <ul>

        <li><code>IBAN</code> — IBAN</li>

        <li><code>NUMBER</code> — Account number</li>

        <li><code>ADYEN</code> — Adyen identifier</li>

        <li><code>AU_BPAY_BILLER_CODE</code> — Australian BPAY Biller Code</li>

        <li><code>DK_FIK</code> — FIK creditor number</li>

        <li><code>INVESTMENT_NUMBER</code> — Investment number</li>

        <li><code>NATIONAL_ID_NUMBER</code> — National Identification Number</li>

        <li><code>PAYPAL</code> — PayPal wallet identifier</li>

        <li><code>PROPRIETARY</code> — Proprietary identifier</li>

        <li><code>SE_BANKGIRO</code> — <a href="https://www.bankgirot.se/en/">Bankgiro number</a></li>

        <li><code>SE_PLUSGIRO</code> — <a href="https://www.nordea.se/foretag/produkter/betala/plusgirot.html">Plusgiro number</a></li>

        <li><code>SOLDO</code> — Soldo entity identifier</li>

        <li><code>WALLET_ADYEN_BALANCE_PLATFORM</code> — Adyen balance platform wallet identifier</li>

        <li><code>WALLET_AIRWALLEX</code> — Airwallex wallet identifier</li>

        <li><code>WALLET_AIRWALLEX_NUMBER</code> — Airwallex account number</li>

        <li><code>WALLET_CURRENCYCLOUD</code> — Currencycloud wallet identifier</li>

        <li><code>WALLET_FLASH_PAYMENTS</code> — Flash Payments wallet identifier</li>

        <li><code>WALLET_FREEMARKET</code> — Freemarket wallet identifier</li>

        <li><code>WALLET_HYPERWALLET</code> — Hyperwallet wallet identifier</li>

        <li><code>WALLET_INPAY</code> — Inpay account identifier</li>

        <li><code>WALLET_LEAD</code> — Lead wallet identifier</li>

        <li><code>WALLET_MERCURY</code> — Mercury wallet identifier</li>

        <li><code>WALLET_MONEYCORP</code> — Moneycorp wallet identifier</li>

        <li><code>WALLET_PAYHAWK</code> — Payhawk wallet identifier</li>

        <li><code>WALLET_REVOLUT</code> — Revolut wallet identifier</li>

        <li><code>WALLET_SKRILL</code> — Skrill wallet identifier</li>

        <li><code>WALLET_STRIPE</code> — Stripe wallet identifier</li>

        <li><code>WALLET_SWISSQUOTE</code> — Swissquote wallet identifier</li>

        <li><code>WALLET_UNIT</code> — Unit wallet identifier</li>

        </ul>

        For further information please refer to <a href="https://docs.atlar.com/v2.0/docs/payment-details#account-identifiers">Account Identifiers</a>'
      example: IBAN
    RoutingIdentifier:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/RoutingIdentifierType'
        number:
          type: string
          description: The form of the routing number depends on `type`. E.g. for `BIC` the value should be an 8 or 11 character BIC/SWIFT code. For `GB_DSC` (UK domestic routing) the value should be a six digit sort code.
          minLength: 1
          maxLength: 255
        invalid:
          type: boolean
          description: Will be `true` if the routing identifier is invalid according to Atlar validation rules.
          readOnly: true
        constraints:
          $ref: '#/components/schemas/RoutingConstraints'
      required:
      - type
      - number
      examples:
      - type: BIC
        number: BUKBGB22
      - type: US_ABA
        number: '123456789'
