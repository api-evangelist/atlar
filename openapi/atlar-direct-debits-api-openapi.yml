openapi: 3.2.0
info:
  title: Atlar API (v2) Direct Debits API
  description: Atlar API (v2)
  version: '0.1'
  contact:
    email: support@atlar.com
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.txt
servers:
- url: https://api.atlar.com
tags:
- name: Direct Debits
  description: Direct debits are payments initiated by a creditor to collect funds from a debtor's account.
  x-displayName: Direct Debits
paths:
  /payments/v2/direct-debits:
    post:
      summary: Create direct debit
      description: Create a direct debit payment.
      tags:
      - Direct Debits
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDirectDebitRequest'
      responses:
        '201':
          description: The created direct debit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectDebit'
        '400':
          $ref: '#/components/responses/BadRequest'
      security:
      - basicAuth:
        - direct_debits:create
        - accounts:read
        - external_accounts:read
        - counterparties:read
      operationId: postPaymentsV2DirectDebits
      x-operation-id-source: derived
    get:
      summary: List direct debits
      description: Returns a list of direct debits. For further details on Pagination, see general section above. Sort order is always descending on date.
      tags:
      - Direct Debits
      parameters:
      - description: Include only direct debits for the given destination account.
        in: query
        name: accountId
        schema:
          type: string
      - description: Include only direct debits with the given status.
        in: query
        name: status
        schema:
          $ref: '#/components/schemas/PaymentStatus'
      - description: Include only direct debits with property `date` matching the given value. The parameter value may be either a string for equality matching, or an object for range-like matching criteria.
        in: query
        name: date
        explode: true
        style: deepObject
        schema:
          oneOf:
          - type: string
            format: date
            example: '2022-01-15'
            description: Include only direct debits with `date` equal to the given value.
          - type: object
            properties:
              gte:
                type: string
                format: date
                example: '2022-01-01'
                description: Include only direct debits with `date` after or equal to given date.
              lte:
                type: string
                format: date
                example: '2022-01-31'
                description: Include only direct debits with `date` before or equal to given date.
              eq:
                type: string
                format: date
                example: '2022-01-15'
                description: Include only direct debits with `date` equal to given date.
      - description: Include only direct debits with the given direct debit scheme.
        in: query
        name: scheme
        schema:
          $ref: '#/components/schemas/DirectDebitSchemeType'
      - description: Include only direct debits that are part of the payment batch with the given batch ID.
        in: query
        name: batchId
        schema:
          type: string
      - $ref: '#/components/parameters/QueryLimit'
      - $ref: '#/components/parameters/PaginationToken'
      responses:
        '200':
          description: List of direct debits.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ListResponse'
                - properties:
                    items:
                      items:
                        $ref: '#/components/schemas/DirectDebit'
                      type: array
                  type: object
        '400':
          $ref: '#/components/responses/NotFound'
      security:
      - basicAuth:
        - direct_debits:read
      operationId: getPaymentsV2DirectDebits
      x-operation-id-source: derived
  /payments/v2/direct-debits/{id}:
    get:
      summary: Get direct debit
      description: Retrieve a specific direct debit.
      tags:
      - Direct Debits
      parameters:
      - $ref: '#/components/parameters/ResourceIDOrExternalID'
      responses:
        '200':
          description: Direct debit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectDebit'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - basicAuth:
        - direct_debits:read
      operationId: getPaymentsV2DirectDebitsById
      x-operation-id-source: derived
  /payments/v2/direct-debits/{id}/events:
    get:
      summary: List direct debit events
      description: Retrieve events for a specific direct debit. Returns a list of events. For further details on Pagination, see the section above.
      tags:
      - Direct Debits
      parameters:
      - $ref: '#/components/parameters/ResourceID'
      - $ref: '#/components/parameters/QueryLimit'
      - $ref: '#/components/parameters/PaginationToken'
      responses:
        '200':
          description: List of direct debit events.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ListResponse'
                - properties:
                    items:
                      items:
                        $ref: '#/components/schemas/Event'
                      type: array
                  type: object
        '400':
          $ref: '#/components/responses/NotFound'
      security:
      - basicAuth:
        - direct_debits:read
      operationId: getPaymentsV2DirectDebitsByIdEvents
      x-operation-id-source: derived
  /payments/v2/direct-debits/{id}:approve:
    post:
      summary: Approve direct debit
      description: Approve the specified direct debit.
      tags:
      - Direct Debits
      parameters:
      - $ref: '#/components/parameters/ResourceIDOrExternalID'
      - $ref: '#/components/parameters/IfMatchETag'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovePaymentRequest'
      responses:
        '202':
          description: The now approved direct debit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectDebit'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - basicAuth:
        - direct_debits:update
      operationId: postPaymentsV2DirectDebits{id}:approve
      x-operation-id-source: derived
  /payments/v2/direct-debits/{id}:reject:
    post:
      summary: Reject direct debit
      description: Reject the specified direct debit.
      tags:
      - Direct Debits
      parameters:
      - $ref: '#/components/parameters/ResourceIDOrExternalID'
      - $ref: '#/components/parameters/IfMatchETag'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectPaymentRequest'
      responses:
        '202':
          description: The now rejected direct debit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectDebit'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - basicAuth:
        - direct_debits:update
      operationId: postPaymentsV2DirectDebits{id}:reject
      x-operation-id-source: derived
  /payments/v2beta/direct-debit-batches:
    post:
      summary: Create direct debit batch
      description: 'Create a batch of direct debit payments.


        See https://docs.atlar.com/docs/batch-payments for more information.'
      tags:
      - Direct Debits
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDirectDebitBatchRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateDirectDebitBatchRequestFormData'
      responses:
        '201':
          description: The created direct debit batch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentBatch'
        '400':
          $ref: '#/components/responses/BadRequest'
      security:
      - basicAuth:
        - direct_debits:create
        - accounts:read
        - entities:read
        - external_accounts:read
        - counterparties:read
      operationId: postPaymentsV2betaDirectDebitBatches
      x-operation-id-source: derived
    get:
      summary: List direct debit batches
      description: Returns a list of direct debit batches.
      tags:
      - Direct Debits
      parameters:
      - $ref: '#/components/parameters/QueryLimit'
      - $ref: '#/components/parameters/PaginationToken'
      responses:
        '200':
          description: A list of direct debit batches.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ListResponse'
                - properties:
                    items:
                      items:
                        $ref: '#/components/schemas/PaymentBatch'
                      type: array
                  type: object
        '400':
          $ref: '#/components/responses/BadRequest'
      security:
      - basicAuth:
        - direct_debits:read
      operationId: getPaymentsV2betaDirectDebitBatches
      x-operation-id-source: derived
  /payments/v2beta/direct-debit-batches/{id}:
    get:
      summary: Get direct debit batch
      description: Retrieve a specific direct debit batch.
      tags:
      - Direct Debits
      parameters:
      - $ref: '#/components/parameters/ResourceIDOrExternalID'
      responses:
        '200':
          description: A direct debit batch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentBatch'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - basicAuth: []
      operationId: getPaymentsV2betaDirectDebitBatchesById
      x-operation-id-source: derived
  /payments/v2beta/direct-debit-batches/{id}/results:
    get:
      summary: List direct debit batch results
      description: 'List processing results for individual direct debit requests that were part of a direct debit batch.

        The result items represent the result(s) of processing the batch request input but doesn''t not represent the end-to-end processing of the payment.'
      tags:
      - Direct Debits
      parameters:
      - $ref: '#/components/parameters/ResourceID'
      - $ref: '#/components/parameters/PaginationToken'
      - $ref: '#/components/parameters/QueryLimit'
      - description: 'Filter based on presence of `errors`. If `true`, only

          results with at least one error will be included. If `false`, only

          results with no errors will be included.

          '
        in: query
        name: errors
        schema:
          type: boolean
      - description: 'Filter based on `skipped`. If `true`, only results related

          to input record that were skipped will be included. If

          `false`, only results that are not related to skipped

          input records will be included.

          '
        in: query
        name: skipped
        schema:
          type: boolean
      responses:
        '200':
          description: A list of payment batch results.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ListResponse'
                - properties:
                    items:
                      items:
                        $ref: '#/components/schemas/BatchResult'
                      type: array
                  type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: 'Not found will be returned if no payment batch with given

            id exists or if the payment batch is not yet in status

            `COMPLETED`.

            '
          $ref: '#/components/responses/NotFound'
      security:
      - basicAuth: []
      operationId: getPaymentsV2betaDirectDebitBatchesByIdResults
      x-operation-id-source: derived
  /payments/v2beta/direct-debit-batches/{id}:approve:
    post:
      summary: Approve direct debit batch
      description: 'Approve the batch of direct debits.


        Approval of a batch is only applicable when the batch `treatment` is `BATCH`.'
      tags:
      - Direct Debits
      parameters:
      - $ref: '#/components/parameters/ResourceIDOrExternalID'
      - $ref: '#/components/parameters/IfMatchETag'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveBatchRequest'
      responses:
        '202':
          description: 'The request to approve the batch and all the payments it

            contains has been accepted.


            Note that the approval status of the individual payments

            may be processed asynchronous.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentBatch'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - basicAuth:
        - direct_debits:update
      operationId: postPaymentsV2betaDirectDebitBatches{id}:approve
      x-operation-id-source: derived
  /payments/v2beta/direct-debit-batches/{id}:reject:
    post:
      summary: Reject direct debit batch
      description: 'Reject the batch of direct debits.


        Rejection of a batch is only applicable when the batch `treatment` is `BATCH`.'
      tags:
      - Direct Debits
      parameters:
      - $ref: '#/components/parameters/ResourceIDOrExternalID'
      - $ref: '#/components/parameters/IfMatchETag'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectPaymentRequest'
      responses:
        '202':
          description: 'The request to reject the batch and all the payments it

            contains has been accepted.


            Note that the rejection status of the individual payments

            may be processed asynchronous.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentBatch'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - basicAuth:
        - direct_debits:update
      operationId: postPaymentsV2betaDirectDebitBatches{id}:reject
      x-operation-id-source: derived
components:
  schemas:
    SchemeDetailsUrgency:
      type: string
      description: The urgency of the payment.
      enum:
      - HIGH
    AccountHolder:
      type: object
      description: Information about the legal holder of an account.
      properties:
        type:
          type: string
          enum:
          - COUNTERPARTY
          - ENTITY
          - INLINE
          readOnly: true
        id:
          type: string
          description: Resource ID of either a `Counterparty` or an `Entity`. Absent when `type` is `INLINE`, since an inline holder refers to no resource.
          readOnly: true
        externalId:
          $ref: '#/components/schemas/ExternalID'
          description: External ID of either a `Counterparty` or an `Entity`.
        legalName:
          type: string
          description: The legal name of the account holder. Some banks, and for some payment schemes, the correctness of the legal name will be validated and payments may be rejected if legal names do not match.
          readOnly: true
        address:
          description: Postal address of the account holder.
          $ref: '#/components/schemas/Address'
          readOnly: true
        nationalIdentifier:
          description: The national identifier of the account holder.
          $ref: '#/components/schemas/NationalIdentifier'
          readOnly: true
        partyType:
          description: The party type of the account holder.
          $ref: '#/components/schemas/PartyType'
          readOnly: true
        email:
          description: Email of the account holder.
          example: john.smith@example.com
          type: string
          readOnly: true
      required:
      - type
      - legalName
      examples:
      - type: ENTITY
        id: 29a4555b-99b2-4de7-9062-47c8ebc03f56
        legalName: Example Company GmbH
        address:
          country: DE
          city: Munich
          postalCode: '123456'
      - type: COUNTERPARTY
        id: f3efbb73-4e5b-4b22-adeb-918bbf1dfbd8
        legalName: John Smith
        address:
          country: US
          city: New York
          postalCode: '123456'
    Address:
      description: Postal address.
      type: object
      properties:
        country:
          $ref: '#/components/schemas/CountryCode'
          x-go-type-skip-optional-pointer: true
        countrySubdivision:
          $ref: '#/components/schemas/CountrySubdivision'
          x-go-type-skip-optional-pointer: true
        city:
          example: Stockholm
          type: string
          maxLength: 64
        postalCode:
          example: '11111'
          type: string
          maxLength: 16
        streetName:
          example: Example street
          type: string
          maxLength: 64
        streetNumber:
          example: '47'
          type: string
          maxLength: 16
    ApprovePaymentRequest:
      type: object
      properties:
        approvalStepId:
          type: string
          description: The id of the approval step to be approved.
      required:
      - approvalStepId
      examples:
      - approvalStepId: 52699442-e06f-4cda-b2a8-cdeca08ff9d3
    BatchErrors:
      description: A list of error details if the batch failed. Only populated once the batch has reached status `COMPLETED`. Only the first 255 errors (if any) will be present in this list. If there are more errors, the complete list can be retrieved using the results endpoint for the batch.
      type: array
      items:
        $ref: '#/components/schemas/ErrorDetails'
      maxItems: 255
    InternalAccountRef:
      type: object
      description: A reference to an (internal) Account.
      properties:
        type:
          $ref: '#/components/schemas/AccountType'
        id:
          type: string
          description: ID of an (internal) Account.
      required:
      - type
      - id
      examples:
      - type: ACCOUNT
        id: 31d593d7-fff9-4783-aa1d-92acb7b21a19
    ResourceID:
      type: string
      description: Unique resource identifier.
      minLength: 32
      maxLength: 64
      examples:
      - 2ed9a3ee-60aa-4f9f-a858-2eed4eefbbc8
    RoutingConstraints:
      description: Constraints on a `RoutingIdentifier`.
      type: object
      properties:
        accountNumberType:
          $ref: '#/components/schemas/AccountIdentifierType'
          x-go-type-skip-optional-pointer: true
        scheme:
          type: string
    ResourceVersion:
      type: integer
      description: 'Resource version. Starts at value `1` when the resource is

        created and increases by one for each successive update.'
      example: 1
      minimum: 1
      readOnly: true
    AmountStringValueInput:
      type: object
      properties:
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        stringValue:
          description: A string representation of the amount value, which will be a decimal number if the currency has decimals. The number is not formatted for display purposes (e.g. with thousand separator) and always contains the dot `.` character as decimal separator.
          example: '15.02'
          type: string
      required:
      - currency
      - stringValue
    PaymentBatch:
      type: object
      properties:
        id:
          description: ID of the batch.
          $ref: '#/components/schemas/ResourceID'
          example: e284485b-e41b-4237-a115-5a02507eacec
        organizationId:
          $ref: '#/components/schemas/OrganizationID'
        treatment:
          $ref: '#/components/schemas/BatchTreatmentType'
        input:
          description: Deprecated - use `inputDetails` and `inputContent`.
          $ref: '#/components/schemas/BatchInputMetadata'
          x-atlar-fields-enum-skip: true
        inputContent:
          $ref: '#/components/schemas/BatchInputContent'
        inputDetails:
          description: 'Summary of the batch input: amount totals per currency (`sums`) and optional date

            range across requested execution dates.'
          $ref: '#/components/schemas/PaymentBatchDetails'
        results:
          description: 'Deprecated - use `resultSummary` and `resultDetails`. Summary of processing results.


            The summary is only populated when the batch `status` is `COMPLETED`.


            Detailed processing results can be retrieved using

            https://docs.atlar.com/v2.0/reference/get_payments-v2beta-credit-transfer-batches-id-results.

            '
          $ref: '#/components/schemas/BatchResultsSummary'
          readOnly: true
          x-atlar-fields-enum-skip: true
        resultSummary:
          description: 'Counts of how input records were processed (total / succeeded / failed / skipped).

            Only populated when the batch `status` is `COMPLETED`.'
          $ref: '#/components/schemas/BatchResultSummary'
        resultDetails:
          description: 'Amount totals per currency for successfully processed payments in the batch.

            Only populated when the batch `status` is `COMPLETED`. May differ from

            `inputDetails.sums` when records were skipped.'
          $ref: '#/components/schemas/PaymentBatchDetails'
        status:
          $ref: '#/components/schemas/BatchStatus'
          readOnly: true
        errors:
          $ref: '#/components/schemas/BatchErrors'
        approvalSteps:
          deprecated: true
          x-deprecated-reason: Batch-level approval steps are no longer populated. Use the approval steps on each payment. This field will be removed in the future.
          description: 'Batch approval steps, including who approved or rejected (`approver`), step

            `status`, and `requiredRoleIds`.


            Approval steps will only be available once the batch

            `status` is `COMPLETED`. I.e. no action must be taken

            based on the absence of approval steps (empty array).

            '
          type: array
          items:
            $ref: '#/components/schemas/PaymentApprovalStep'
          readOnly: true
        externalId:
          $ref: '#/components/schemas/ExternalID'
        approvalResults:
          description: Counts of fully approved vs rejected payments in this batch.
          $ref: '#/components/schemas/ApprovalResults'
        creatorUserId:
          $ref: '#/components/schemas/ResourceID'
          description: ID of the user that created the batch.
          readOnly: true
        sourceAccountIds:
          type: array
          description: IDs of the accounts that the payments in this batch are initiated from.
          items:
            $ref: '#/components/schemas/ResourceID'
          uniqueItems: true
          readOnly: true
          x-omitempty: true
        metadata:
          $ref: '#/components/schemas/Metadata'
        etag:
          $ref: '#/components/schemas/ETag'
        version:
          $ref: '#/components/schemas/ResourceVersion'
        created:
          $ref: '#/components/schemas/CreatedTimestamp'
        updated:
          $ref: '#/components/schemas/UpdatedTimestamp'
      required:
      - treatment
      - id
      - organizationId
      - etag
      - status
      - version
      - created
      - updated
      - input
      - inputContent
      - inputDetails
      - approvalSteps
      - approvalResults
    BatchTreatmentType:
      type: string
      deprecated: true
      description: 'Deprecated: You can approve or reject on batch and individual level regardless of the treatment type.

        '
      enum:
      - INDIVIDUAL_PAYMENTS
      - BATCH
      example: INDIVIDUAL_PAYMENTS
    OrganizationID:
      type: string
      description: Unique resource identifier for an Organization.
      examples:
      - 0160f6ab-5741-49e1-af46-9138927e547e
    AmountInput:
      oneOf:
      - $ref: '#/components/schemas/AmountIntegerValueInput'
      - $ref: '#/components/schemas/AmountStringValueInput'
    ExternalAccountRef:
      type: object
      description: A reference to an External Account.
      properties:
        type:
          $ref: '#/components/schemas/AccountType'
        id:
          type: string
          description: ID or External ID of an External Account. Prefix External IDs with `external:`.
      required:
      - type
      - id
      example:
        type: EXTERNAL_ACCOUNT
        id: 86faeacd-05f0-4836-a86c-51b871e10299
    BatchResult:
      description: 'Result of processing an individual payment request as part of

        a batch request.

        '
      type: object
      properties:
        paymentId:
          description: 'ID of the payment (a credit transfer or direct debit

            resource). Present if the result represent the successful

            creation of a credit transfer or direct debit resource.

            '
          type: string
          $ref: '#/components/schemas/ResourceID'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetails'
            minItems: 0
          x-omitempty: true
        skipped:
          description: 'Indicates whether a given payment request was skipped when

            processed as part of a batch.

            '
          type: boolean
        recordIndex:
          description: '0-based index specifying which record in the batch input that

            this result is associated with. If the batch input was a

            CSV file the `recordIndex` will refer to rows (lines) in

            the file. If the batch input was JSON it will refer to

            JSON array indicies.


            If the error(s) are not directly related to a specific

            record/row/line the `recordIndex` will not be present.

            '
          type: integer
        externalId:
          $ref: '#/components/schemas/ExternalID'
          description: External ID of the payment, if any.
      examples:
      - paymentId: a0285f2e-f0c8-11ee-bae7-aa94e258a7ae
        recordIndex: 1
      - errors:
        - error: Account not found
          field: file.123.source.id
          code: account_not_found
        recordIndex: 123
      - skipped: true
        errors:
        - error: Invalid account number type
          field: file.456.destination.identifiers.0.type
          code: invalid_accountnumber_type_for_market
        recordIndex: 456
      - errors:
        - error: General processing failure
    MandateSnapshot:
      type: object
      description: Mandate information about the mandate to be used for a Direct Debit. This mandate data is a snapshot of the state of the mandate at the time when the Direct Debit was created.
      properties:
        id:
          description: The unique identifier of this mandate.
          $ref: '#/components/schemas/ResourceID'
          example: be7e04fe-3fa0-48f5-a993-2008409255f2
        creditorReference:
          description: The customer number that you have received from the bank.
          type: string
        mandateReference:
          type: string
          description: A unique reference to the mandate that you have signed with the debtor.
          minLength: 1
          maxLength: 35
        finalCollection:
          type: boolean
          readOnly: true
          description: 'Whether to consider this Direct Debit collection the final one for this mandate.

            This field is set automatically by the Atlar platform if the mandate has been cancelled prior to the creation of the Direct Debit.

            This field only affects certain direct debit schemes (e.g. SEPA DDs),

            where the bank is notified about the mandate cancellation in relation to the final collection.

            '
        signatureDate:
          description: The date that this mandate was signed by the end user.
          $ref: '#/components/schemas/Date'
          examples:
          - '2022-08-01'
        version:
          $ref: '#/components/schemas/ResourceVersion'
      required:
      - id
      - creditorReference
      - mandateReference
      - finalCollection
      - version
    Instrument:
      type: object
      description: The payment instrument used to initiate the payment. For example Citi has a proprietary payment instrument called WorldLink, which can be used to initiate payments.
      oneOf:
      - $ref: '#/components/schemas/CitiWorldlinkInstrument'
      - $ref: '#/components/schemas/USACHInstrument'
      discriminator:
        propertyName: type
        mapping:
          CITI_WORLDLINK: '#/components/schemas/CitiWorldlinkInstrument'
          US_ACH: '#/components/schemas/USACHInstrument'
    BatchAmountSums:
      type: array
      description: 'The total amount sum per each currency of resources in this batch.


        Note that batch amount sums reported on the batch input metadata

        refer to the total amount sums of the input records (resources)

        while the batch amount sums reported on the batch result refer

        to the total amount sums of the successfully processed records (resources).

        This means that there may be a difference in the total sum for the input

        vs the result, due to skipped records (resources).

        '
      items:
        $ref: '#/components/schemas/Amount'
      readOnly: true
    USACHInstrument:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/InstrumentType'
        usAchCompanyId:
          type: string
          description: The US ACH Company ID assigned to the account to initiate US ACH payments.
          example: '1234567890'
        usAchCompanyName:
          type: string
          description: 'Optional US ACH Company Name override. When set, it is used as the debtor name (Dbtr/Nm)

            on outgoing US ACH payments from this account instead of the account holder''s legal name.

            Only used for US ACH payments.

            '
          example: ACME PAYROLL
        usAchImmediateOrigin:
          type: string
          description: 'Optional US ACH Immediate Origin. When set, it populates the Immediate Origin field of the

            NACHA file header instead of the US ACH Company ID. Some banks assign an Immediate Origin

            that is distinct from the Company ID. Only used for US ACH payments.

            '
          example: '1234567890'
      required:
      - type
      - usAchCompanyId
    CitiWorldlinkInstrument:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/InstrumentType'
        citiWorldlinkId:
          type: string
          description: The WorldLink ID assigned to the account to initiate payments.
          example: '123456789'
      required:
      - type
      - citiWorldlinkId
    PartyType:
      type: string
      description: The legal type of a party
      enum:
      - INDIVIDUAL
      - COMPANY
      example: INDIVIDUAL
    ETag:
      type: string
      description: '[ETag](https://en.wikipedia.org/wiki/HTTP_ETag) based on the

        resource version. This can be passed along in `If-Match` HTTP

        header when updating a resource to perform a conditional

        update.'
      pattern: ^version:\d{1,4}$
      example: version:3
      readOnly: true
      externalDocs:
        url: https://en.wikipedia.org/wiki/HTTP_ETag
    Date:
      type: string
      format: date
      description: '`full-date` notation as defined by [RFC 3339, section 5.6](https://datatracker.ietf.org/doc/html/rfc3339#section-5.6), for example, `2017-07-21`.'
      example: '2022-05-07'
    AccountIdentifierType:
      type: string
      enum:
      - IBAN
      - NUMBER
      - ADYEN
      - AU_BPAY_BILLER_CODE
      - DK_FIK
      - INVESTMENT_NUMBER
      - NATIONAL_ID_NUMBER
      - PAYPAL
      - PROPRIETARY
      - SE_BANKGIRO
      - SE_PLUSGIRO
      - SOLDO
      - WALLET_ADYEN_BALANCE_PLATFORM
      - WALLET_AIRWALLEX
      - WALLET_AIRWALLEX_NUMBER
      - WALLET_CURRENCYCLOUD
      - WALLET_FLASH_PAYMENTS
      - WALLET_FREEMARKET
      - WALLET_HYPERWALLET
      - WALLET_INPAY
      - WALLET_LEAD
      - WALLET_MERCURY
      - WALLET_MONEYCORP
      - WALLET_PAYHAWK
      - WALLET_REVOLUT
      - WALLET_SKRILL
      - WALLET_STRIPE
      - WALLET_SWISSQUOTE
      - WALLET_UNIT
      description: 'Account Identifier type. Choose among:

        <ul>

        <li><code>IBAN</code> — IBAN</li>

        <li><code>NUMBER</code> — Account number</li>

        <li><code>ADYEN</code> — Adyen identifier</li>

        <li><code>AU_BPAY_BILLER_CODE</code> — Australian BPAY Biller Code</li>

        <li><code>DK_FIK</code> — FIK creditor number</li>

        <li><code>INVESTMENT_NUMBER</code> — Investment number</li>

        <li><code>NATIONAL_ID_NUMBER</code> — National Identification Number</li>

        <li><code>PAYPAL</code> — PayPal wallet identifier</li>

        <li><code>PROPRIETARY</code> — Proprietary identifier</li>

        <li><code>SE_BANKGIRO</code> — <a href="https://www.bankgirot.se/en/">Bankgiro number</a></li>

        <li><code>SE_PLUSGIRO</code> — <a href="https://www.nordea.se/foretag/produkter/betala/plusgirot.html">Plusgiro number</a></li>

        <li><code>SOLDO</code> — Soldo entity identifier</li>

        <li><code>WALLET_ADYEN_BALANCE_PLATFORM</code> — Adyen balance platform wallet identifier</li>

        <li><code>WALLET_AIRWALLEX</code> — Airwallex wallet identifier</li>

        <li><code>WALLET_AIRWALLEX_NUMBER</code> — Airwallex account number</li>

        <li><code>WALLET_CURRENCYCLOUD</code> — Currencycloud wallet identifier</li>

        <li><code>WALLET_FLASH_PAYMENTS</code> — Flash Payments wallet identifier</li>

        <li><code>WALLET_FREEMARKET</code> — Freemarket wallet identifier</li>

        <li><code>WALLET_HYPERWALLET</code> — Hyperwallet wallet identifier</li>

        <li><code>WALLET_INPAY</code> — Inpay account identifier</li>

        <li><code>WALLET_LEAD</code> — Lead wallet identifier</li>

        <li><code>WALLET_MERCURY</code> — Mercury wallet identifier</li>

        <li><code>WALLET_MONEYCORP</code> — Moneycorp wallet identifier</li>

        <li><code>WALLET_PAYHAWK</code> — Payhawk wallet identifier</li>

        <li><code>WALLET_REVOLUT</code> — Revolut wallet identifier</li>

        <li><code>WALLET_SKRILL</code> — Skrill wallet identifier</li>

        <li><code>WALLET_STRIPE</code> — Stripe wallet identifier</li>

        <li><code>WALLET_SWISSQUOTE</code> — Swissquote wallet identifier</li>

        <li><code>WALLET_UNIT</code> — Unit wallet identifier</li>

        </ul>

        For further information please refer to <a href="https://docs.atlar.com/v2.0/docs/payment-details#account-identifiers">Account Identifiers</a>'
      example: IBAN
    PaymentReference:
      type: string
      description: This reference will be sent to the destination bank and recipient. (This type of reference is sometimes also referred to as remittance information.)
      maxLength: 140
    RoutingIdentifier:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/RoutingIdentifierType'
        number:
          type: string
          description: The form of the routing number depends on `type`. E.g. for `BIC` the value should be an 8 or 11 character BIC/SWIFT code. For `GB_DSC` (UK domestic routing) the value should be a six digit sort code.
          minLength: 1
          maxLength: 255
        invalid:
          type: boolean
          description: Will be `true` if the routing identifier is invalid according to Atlar validation rules.
          readOnly: true
        constraints:
          $ref: '#/components/schemas/RoutingConstraints'
      required:
      - type
      - number
      examples:
      - type: BIC
        number: BUKBGB22
      - type: US_ABA
        number: '123456789'
      - type: DE_BLZ
        number: '12345678'
      - type: SE_SBA
        number: '9960'
      - type: BIC
        number: '123'
        invalid: true
    CreatedTimestamp:
      type: string
      format: date-time
      description: Time at which the resource was created.
      example: '2022-05-04T18:31:12.889104898Z'
      readOnly: true
    SchemeDetails:
      type: object
      properties:
        instrument:
          $ref: '#/components/schemas/Instrument'
        intraCompany:
          type: boolean
          description: Whether the payment is between companies within the same group.
        initiatorId:
          type: string
        urgency:
          $ref: '#/components/schemas/SchemeDetailsUrgency'
    CreateDirectDebitBatchRequestFormData:
      type: object
      properties:
        treatment:
          $ref: '#/components/schemas/BatchTreatmentType'
        fileContentType:
          $ref: '#/components/schemas/DirectDebitTransferBatchContentType'
        skipValidationErrors:
          type: boolean
          description: Skip/ignore input records that contain validation errors.
        file:
          type: string
          format: binary
        metadata:
          $ref: '#/components/schemas/Metadata'
      required:
      - treatment
      - fileContentType
      - file
    DirectDebitTransferBatchContentType:
      type: string
      description: 'The content type of the batch.

        See https://docs.atlar.com/docs/batch-payments#csv-format for details on the CSV format for direct debit batches.'
      enum:
      - application/vnd.atlar.payments.v2.direct-debit.batch+csv
      - application/vnd.atlar.payments.v2.direct-debit.batch+json
      example: application/vnd.atlar.payments.v2.direct-debit.batch+csv
    BatchDetails:
      type: object
      properties:
        id:
          description: ID of the batch.
          $ref: '#/components/schemas/ResourceID'
        treatment:
          $ref: '#/components/schemas/BatchTreatmentType'
      required:
      - id
      - treatment
    AccountSnapshot:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/AccountType'
        id:
          description: ID of the (internal) Account.
          $ref: '#/components/schemas/ResourceID'
        organizationId:
          $ref: '#/components/schemas/OrganizationID'
        market:
          $ref: '#/components/schemas/MarketCode'
          readOnly: true
        identifiers:
          type: array
          items:
            $ref: '#/components/schemas/AccountIdentifier'
          minItems: 1
          uniqueItems: true
          readOnly: true
        routing:
          type: array
          items:
            $ref: '#/components/schemas/RoutingIdentifier'
          uniqueItems: true
          maxItems: 5
          readOnly: true
        currency:
          $ref: '#/components/schemas/CurrencyCode'
          readOnly: true
      required:
      - type
      - id
      - organizationId
      - market
      - currency
      - identifiers
      - routing
      examples:
      - id: ac1963d7-fff9-4783-aa1d-92acb7b21a19
        type: ACCOUNT
        organizationId: 0160f6ab-5741-49e1-af46-9138927e547e
        market: DE
        currency: EUR
        identifiers:
        - market: DE
          type: IBAN
          number: DE89370400440532013000
        routing:
        - type: BIC
          number: COBADEFFXXX
    DirectDebit:
      type: object
      properties:
        id:
          description: ID of the direct debit.
          $ref: '#/components/schemas/ResourceID'
          example: 76992987-48fc-4b03-b609-ea6fdc3045b4
        organizationId:
          $ref: '#/components/schemas/OrganizationID'
        creatorUserId:
          $ref: '#/components/schemas/ResourceID'
          description: ID of the user that created the direct debit.
          readOnly: true
        amount:
          $ref: '#/components/schemas/Amount'
          readOnly: true
        scheme:
          $ref: '#/components/schemas/DirectDebitSchemeType'
          readOnly: true
        schemeDetails:
          $ref: '#/components/schemas/SchemeDetails'
          readOnly: true
        date:
          description: Requested payment execution date.
          $ref: '#/components/schemas/Date'
          example: '2022-05-07'
          readOnly: true
        status:
          $ref: '#/components/schemas/PaymentStatus'
          readOnly: true
        statusReason:
          $ref: '#/components/schemas/PaymentStatusReason'
          readOnly: true
        destination:
          description: Destination account which will receive funds. This account will be credited.
          $ref: '#/components/schemas/AccountSnapshot'
          readOnly: true
        destinationHolder:
          $ref: '#/components/schemas/AccountHolder'
          readOnly: true
        source:
          description: Source account from which funds will be collected. This account will be debited.
          $ref: '#/components/schemas/ExternalAccountSnapshot'
          readOnly: true
        sourceHolder:
          $ref: '#/components/schemas/AccountHolder'
          readOnly: true
        mandate:
          description: The mandate which represents the end user's consent to executing this direct debit.
          $ref: '#/components/schemas/MandateSnapshot'
          readOnly: true
        approvalSteps:
          type: array
          items:
            $ref: '#/components/schemas/PaymentApprovalStep'
          readOnly: true
        attachedTransactions:
          type: array
          items:
            $ref: '#/components/schemas/AttachedTransactionRef'
          readOnly: true
        reference:
          $ref: '#/components/schemas/PaymentReference'
          readOnly: true
        categoryPurpose:
          $ref: '#/components/schemas/CategoryPurpose'
          readOnly: true
        chargeBearer:
          $ref: '#/components/schemas/ChargeBearer'
          readOnly: true
        connectionInstructionId:
          type: string
          description: The ID of the instruction that was sent to the bank in which this direct debit was included when it was created.
          example: c1d6502c-07c7-4c77-bee5-963f9464c7d8
          readOnly: true
        batch:
          description: Details of the associated payments batch if the direct debit was created as part of a batch.
          $ref: '#/components/schemas/BatchDetails'
        paymentScheduleId:
          description: ID of the payment schedule associated with this direct debit.
          $ref: '#/components/schemas/ResourceID'
        etag:
          $ref: '#/components/schemas/ETag'
        externalId:
          $ref: '#/components/schemas/ExternalID'
          readOnly: true
        metadata:
          $ref: '#/components/schemas/Metadata'
          readOnly: true
        version:
          $ref: '#/components/schemas/ResourceVersion'
        created:
          $ref: '#/components/schemas/CreatedTimestamp'
        updated:
          $ref: '#/components/schemas/UpdatedTimestamp'
      required:
      - id
      - organizationId
      - amount
      - scheme
      - date
      - status
      - destination
      - destinationHolder
      - source
      - sourceHolder
      - approvalSteps
      - reference
      - version
      - etag
      - created
      - updated
      - attachedTransactions
    AttachedTransactionRef:
      type: object
      description: An association between a _transactable_ payment resource, e.g. a _Credit Transfer_, _Direct Debit_, or _Expected Transaction_, and an account _Transaction_.
      properties:
        type:
          type: string
          description: The resource type of the attached transaction
          enum:
          - TRANSACTION
          readOnly: true
        id:
          type: string
          description: ID of the attached transaction resource.
          readOnly: true
      examples:
      - type: TRANSACTION
        id: 27abf7cb-3867-4119-bfa7-ee3fb667ecf3
      required:
      - type
      - id
    InstrumentInput:
      type: object
      oneOf:
      - $ref: '#/components/schemas/CitiWorldlinkInstrumentInput'
      discriminator:
        propertyName: type
        mapping:
          CITI_WORLDLINK: '#/components/schemas/CitiWorldlinkInstrumentInput'
    ChargeBearer:
      type: string
      description: Charge bearer specifies which party should bear the charges of the transaction.
      enum:
      - SHARED
      - DEBTOR
      - CREDITOR
      - SERVICE_LEVEL
      example: SHARED
    InstrumentType:
      type: string
      description: The type of the payment instrument.
      enum:
      - US_ACH
      - CITI_WORLDLINK
      example: CITI_WORLDLINK
    MarketCode:
      type: string
      description: Two-letter ISO 3166-1 alpha2 country code.
      example: DE
      minLength: 2
      maxLength: 2
      pattern: ^[A-Z]{2,2}$
    PaymentStatus:
      description: Status of a payment. Applicable to both credit transfer payments and direct debit payments.
      type: string
      enum:
      - CREATED
      - APPROVED
      - REJECTED
      - PENDING_SUBMISSION
      - SENT
      - PENDING_AT_BANK
      - ACCEPTED
      - EXECUTED
      - FAILED
      - RETURNED
      - UNKNOWN
      example: SENT
    BatchStatus:
      type: string
      description: 'The status of this batch. The status only refers to the

        processing of the input, not the processing or success of

        the resources themselves.


        `COMPLETED` is the only end-state. Failure is indicated by a non-empty list of `errors`.

        '
      example: COMPLETED
      enum:
      - CREATED
      - PROCESSING_STARTED
      - COMPLETED
    PaymentBatchDetails:
      description: Details summarizing the contents of the batch — primarily amount totals per currency.
      type: object
      properties:
        sums:
          description: 'Total amount sum per currency for the payments covered by this details object

            (input records when under `inputDetails`, successfully processed payments when

            under `resultDetails`).'
          $ref: '#/components/schemas/BatchAmountSums'
      required:
      - sums
    CountrySubdivision:
      type: string
      description: 'Country subdivision code (second part of the ISO 3166-2 code).

        E.g. state code `CA` for the state of California in the USA, `ON` for the province of Ontario in Canada, `NSW` for the state of New South Wales in Australia.

        ISO 3166-2 codes can be found on the ISO website, for example, for the USA: https://www.iso.org/obp/ui/#iso:code:3166:US.

        In the USA the state code is required for domestic payments, in Canada the province code is required for domestic payments.'
      example: US-CA
      maxLength: 6
      pattern: ^[A-Z]{2,2}-[A-Z0-9]{1,3}$
    DirectDebitSchemeType:
      type: string
      description: "Direct debit payment scheme. Choose among: <ul>\n  <li><code>SDD_CORE</code> (<a\nhref=\"https://www.europeanpaymentscouncil.eu/what-we-do/epc-payment-schemes/sepa-direct-debit/sepa-direct-debit-core-rulebook-and-implementation\">SEPA Direct Debit Core</a>)</li>\n  <li><code>SDD_B2B</code> (<a\nhref=\"https://www.europeanpaymentscouncil.eu/what-we-do/epc-payment-schemes/sepa-direct-debit/sepa-direct-debit-b2b-rulebook-and-implementation\">SEPA Direct Debit B2B</a>)</li>\n  <li><code>GB_DD_BACS</code> (UK <a href=\"https://www.bacs.co.uk\">BACS</a> Direct Debit)</li>\n  <li><code>AUTOGIRO</code> (Swedish <a href=\"https://www.bankgirot.se/autogiro\">Bg AutoGiro</a>)</li>\n  <li><code>CH_DD_LSV</code> (Swiss <a href=\"https://www.six-group.com/en/products-services/banking-services/billing-and-payments/direct-debits.html\">Direct Debit LSV+</a>)</li>\n  <li><code>CH_DD_BDD</code> (Swiss <a href=\"https://www.six-group.com/en/products-services/banking-services/billing-and-payments/direct-debits.html\">Direct Debit BDD</a>)</li>\n  <li><code>US_DD_ACH</code> (US ACH Direct Debit)</li>\n</ul>"
      enum:
      - SDD_CORE
      - SDD_B2B
      - GB_DD_BACS
      - AUTOGIRO
      - CH_DD_LSV
      - CH_DD_BDD
      - US_DD_ACH
      example: SDD_CORE
    CreateDirectDebitRequest:
      type: object
      properties:
        amount:
          $ref: '#/components/schemas/AmountInput'
        scheme:
          $ref: '#/components/schemas/DirectDebitSchemeType'
        schemeDetails:
          $ref: '#/components/schemas/SchemeDetailsInput'
        date:
          description: Requested payment execution date. It is a local date from the source account's point-of-view. Cannot be set to before the current date, and not more than 60 days into the future.
          $ref: '#/components/schemas/Date'
        source:
          description: A reference identifying the source account to collect money from. Can only be an external account.
          oneOf:
          - $ref: '#/components/schemas/ExternalAccountRef'
          discriminator:
            propertyName: type
            mapping:
              EXTERNAL_ACCOUNT: '#/components/schemas/ExternalAccountRef'
        destination:
          $ref: '#/components/schemas/InternalAccountRef'
        reference:
          $ref: '#/components/schemas/PaymentReference'
        categoryPurpose:
          $ref: '#/components/schemas/CategoryPurpose'
        chargeBearer:
          $ref: '#/components/schemas/ChargeBearer'
        externalId:
          $ref: '#/components/schemas/ExternalID'
        metadata:
          $ref: '#/components/schemas/Metadata'
        paymentScheduleId:
          description: ID of the payment schedule to associate with this direct debit. Defaults to the organization's default schedule.
          $ref: '#/components/schemas/ResourceID'
      required:
      - amount
      - scheme
      - date
      - source
      - destination
      - reference
    ExternalAccountSnapshot:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/AccountType'
          readOnly: true
        id:
          description: ID of the External Account.
          $ref: '#/components/schemas/ResourceID'
        externalId:
          $ref: '#/components/schemas/ExternalID'
          description: External ID of the External Account.
        organizationId:
          $ref: '#/components/schemas/OrganizationID'
        market:
          $ref: '#/components/schemas/MarketCode'
          readOnly: true
        identifiers:
          type: array
          items:
            $ref: '#/components/schemas/AccountIdentifier'
          minItems: 1
          uniqueItems: true
          readOnly: true
        routing:
          type: array
          items:
            $ref: '#/components/schemas/RoutingIdentifier'
          uniqueItems: true
          readOnly: true
          x-omitempty: true
      required:
      - type
      - id
      - organizationId
      - market
      - identifiers
      example:
        id: 31d593d7-fff9-4783-aa1d-92acb7b21a19
        organizationId: 605e26fc-4fce-495a-a92f-2c3592d7287e
        market: GB
        type: EXTERNAL_ACCOUNT
        identifiers:
        - type: IBAN
          market: GB
          number: GB33BUKB20201555555555
        routing:
        - type: BIC
          number: BUKBGB22XXX
    CountryCode:
      type: string
      description: Two-letter ISO 3166-1 alpha2 country code.
      example: DE
      minLength: 2
      maxLength: 2
      pattern: ^[A-Z]{2,2}$
    CurrencyCode:
      type: string
      description: Three-letter ISO 4217 currency code.
      example: EUR
      minLength: 3
      maxLength: 3
      pattern: ^[A-Z]{3,3}$
    BatchInputMetadata:
      description: Metadata describing the original input that was used to create a payments batch.
      type: object
      properties:
        recordCount:
          type: integer
          description: Deprecated. Has moved into `content`. Total count of input records (payments) in the input batch.
          readOnly: true
        sums:
          $ref: '#/components/schemas/BatchAmountSums'
        content:
          $ref: '#/components/schemas/BatchInputContent'
      required:
      - recordCount
      - sums
      - content
    SchemeDetailsInput:
      type: object
      properties:
        instrument:
          $ref: '#/components/schemas/InstrumentInput'
        intraCompany:
          type: boolean
          description: Whether the payment is between companies within the same group.
        urgency:
          $ref: '#/components/schemas/SchemeDetailsUrgency'
    UserAuditInfo:
      type: object
      description: User information for audit trail.
      properties:
        id:
          $ref: '#/components/schemas/ResourceID'
          description: User ID
          example: 54528335-739e-4de9-bdb3-28f96c98785d
        username:
          type: string
          example: john.smith@example.com
          readOnly: true
        name:
          type: string
          description: User given name(s) information. May be a concatenation of firstname, lastname etc.
          example: John Smith
          readOnly: true
        roleId:
          type: string
          description: Role ID
          example: 2a1e16eb-2f83-4597-99e2-cffbc4311df2
          readOnly: true
      required:
      - id
      - username
    AccountIdentifier:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/AccountIdentifierType'
        market:
          $ref: '#/components/schemas/MarketCode'
          description: 'The market of the `AccountIdentifier` specifies in which market-context the identifier should be treated.


            A `NUMBER` from Sweden does not look and does not validate in the same way as a `NUMBER` from GB. The market

            code is, in most cases, the same as where the account itself is domiciled, but not necessarily. An examples

            of this discrepancy is Jersey which may have domiciled accounts with market `JE`, but the account identifier

            would be an `IBAN` with country code `GB`.'
        number:
          type: string
          description: The unformatted identifier itself. For type `NUMBER` the structure of the account number is country-specific.
          minLength: 1
          maxLength: 255
        invalid:
          type: boolean
          description: Will be `true` if the account identifier is invalid according to Atlar account identifier validation rules.
          readOnly: true
      required:
      - type
      - market
      - number
      examples:
      - type: IBAN
        market: DE
        number: DE75512108001245126199
      - type: NUMBER
        market: GB
        number: '12345678'
      - type: NUMBER
        market: SE
        number: '6114517182351'
      - type: IBAN
        market: DE
        number: '123'
        invalid: true
    NationalIdentifier:
      type: object
      properties:
        type:
