openapi: 3.2.0
info:
  title: Atlar API (v2) Credit Transfers API
  description: Atlar API (v2)
  version: '0.1'
  contact:
    email: support@atlar.com
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.txt
servers:
- url: https://api.atlar.com
tags:
- name: Credit Transfers
  description: Credit transfers are payments initiated by a debtor to transfer funds to a creditor's account.
  x-displayName: Credit Transfers
paths:
  /payments/v2/credit-transfers:
    post:
      summary: Create credit transfer
      description: Create a credit transfer payment.
      tags:
      - Credit Transfers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCreditTransferRequest'
            examples:
              createCreditTransfer_SCT_request:
                $ref: '#/components/examples/CreateCreditTransfer_SCT_Request'
      responses:
        '201':
          description: The created credit transfer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditTransfer'
              examples:
                createCreditTransfer_SCT_Response:
                  $ref: '#/components/examples/CreateCreditTransfer_SCT_Response'
        '400':
          $ref: '#/components/responses/BadRequest'
      security:
      - basicAuth:
        - credit_transfers:create
        - accounts:read
        - entities:read
        - external_accounts:read
        - counterparties:read
      operationId: postPaymentsV2CreditTransfers
      x-operation-id-source: derived
    get:
      summary: List credit transfers
      description: Returns a list of credit transfers. Sort order is always descending on date.
      tags:
      - Credit Transfers
      parameters:
      - description: Include only credit transfers for the given source account.
        in: query
        name: accountId
        schema:
          type: string
      - description: Include only credit transfers with the given status.
        in: query
        name: status
        schema:
          type: string
          enum:
          - CREATED
          - APPROVED
        example: APPROVED
      - description: Include only credit transfers with property `date` matching the given value. The parameter value may be either a string for equality matching, or an object for range-like matching criteria.
        in: query
        name: date
        explode: true
        style: deepObject
        schema:
          oneOf:
          - type: string
            format: date
            example: '2022-01-15'
            description: Include only credit transfers with `date` equal to the given value.
          - type: object
            properties:
              gte:
                type: string
                format: date
                example: '2022-01-01'
                description: Include only credit transfers with `date` after or equal to given date.
              lte:
                type: string
                format: date
                example: '2022-01-31'
                description: Include only credit transfers with `date` before or equal to given date.
              eq:
                type: string
                format: date
                example: '2022-01-15'
                description: Include only credit transfers with `date` equal to given date.
      - description: Include only credit transfers that are part of the payment batch with the given batch ID.
        in: query
        name: batchId
        schema:
          type: string
      - $ref: '#/components/parameters/QueryLimit'
      - $ref: '#/components/parameters/PaginationToken'
      responses:
        '200':
          description: A list of credit transfers.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ListResponse'
                - properties:
                    items:
                      items:
                        $ref: '#/components/schemas/CreditTransfer'
                      type: array
                  type: object
        '400':
          $ref: '#/components/responses/BadRequest'
      security:
      - basicAuth:
        - credit_transfers:read
      operationId: getPaymentsV2CreditTransfers
      x-operation-id-source: derived
  /payments/v2/credit-transfers/{id}:
    get:
      summary: Get credit transfer
      description: Retrieve a specific credit transfer.
      tags:
      - Credit Transfers
      parameters:
      - $ref: '#/components/parameters/ResourceIDOrExternalID'
      responses:
        '200':
          description: A credit transfer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditTransfer'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - basicAuth:
        - credit_transfers:read
      operationId: getPaymentsV2CreditTransfersById
      x-operation-id-source: derived
    patch:
      summary: Update credit transfer
      description: 'Update a credit transfer.


        The credit transfer execution date can only be changed if the

        credit transfer has not been scheduled for submission yet.'
      tags:
      - Credit Transfers
      parameters:
      - $ref: '#/components/parameters/ResourceIDOrExternalID'
      - $ref: '#/components/parameters/IfMatchETag'
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/CreditTransferJSONPatchRequest'
            examples:
              UpdateDate:
                summary: Change payment execution date.
                value:
                - op: replace
                  path: /date
                  value: '2022-05-08'
              UpdateStatus:
                summary: Change payment status.
                value:
                - op: replace
                  path: /status
                  value: RETURNED
      responses:
        '202':
          description: The updated credit transfer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditTransfer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - basicAuth:
        - credit_transfers:update
      operationId: patchPaymentsV2CreditTransfersById
      x-operation-id-source: derived
  /payments/v2/credit-transfers/{id}/events:
    get:
      summary: List credit transfer events
      description: Retrieve events for a specific credit transfer. Returns a list of events. For further details on Pagination, see the section above.
      tags:
      - Credit Transfers
      parameters:
      - $ref: '#/components/parameters/ResourceID'
      - $ref: '#/components/parameters/QueryLimit'
      - $ref: '#/components/parameters/PaginationToken'
      responses:
        '200':
          description: List of credit transfer events.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ListResponse'
                - properties:
                    items:
                      items:
                        $ref: '#/components/schemas/Event'
                      type: array
                  type: object
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - basicAuth:
        - credit_transfers:read
      operationId: getPaymentsV2CreditTransfersByIdEvents
      x-operation-id-source: derived
  /payments/v2/credit-transfers/{id}:approve:
    post:
      summary: Approve credit transfer
      description: Approve the specified credit transfer.
      tags:
      - Credit Transfers
      parameters:
      - $ref: '#/components/parameters/ResourceIDOrExternalID'
      - $ref: '#/components/parameters/IfMatchETag'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovePaymentRequest'
      responses:
        '202':
          description: The now approved credit transfer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditTransfer'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - basicAuth:
        - credit_transfers:update
      operationId: postPaymentsV2CreditTransfers{id}:approve
      x-operation-id-source: derived
  /payments/v2/credit-transfers/{id}:reject:
    post:
      summary: Reject credit transfer
      description: Reject the specified credit transfer.
      tags:
      - Credit Transfers
      parameters:
      - $ref: '#/components/parameters/ResourceIDOrExternalID'
      - $ref: '#/components/parameters/IfMatchETag'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectPaymentRequest'
      responses:
        '202':
          description: The now rejected credit transfer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditTransfer'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - basicAuth:
        - credit_transfers:update
      operationId: postPaymentsV2CreditTransfers{id}:reject
      x-operation-id-source: derived
  /payments/v2beta/credit-transfer-batches:
    post:
      summary: Create credit transfer batch
      description: 'Create a batch of credit transfer payments.


        See https://docs.atlar.com/docs/batch-payments for more information.'
      tags:
      - Credit Transfers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCreditTransferBatchRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateCreditTransferBatchRequestFormData'
      responses:
        '201':
          description: The created credit transfer batch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentBatch'
        '400':
          $ref: '#/components/responses/BadRequest'
      security:
      - basicAuth:
        - credit_transfers:create
        - accounts:read
        - entities:read
        - external_accounts:read
        - counterparties:read
      operationId: postPaymentsV2betaCreditTransferBatches
      x-operation-id-source: derived
    get:
      summary: List credit transfer batches
      description: 'Returns credit transfer batches — groups of outbound payments created together

        (for example via CSV/JSON upload or API). Newest batches first.


        Individual payments belonging to a batch are credit transfer resources whose `batch.id`

        matches this batch.'
      tags:
      - Credit Transfers
      parameters:
      - $ref: '#/components/parameters/QueryLimit'
      - $ref: '#/components/parameters/PaginationToken'
      responses:
        '200':
          description: A list of credit transfer batches.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ListResponse'
                - properties:
                    items:
                      items:
                        $ref: '#/components/schemas/PaymentBatch'
                      type: array
                  type: object
        '400':
          $ref: '#/components/responses/BadRequest'
      security:
      - basicAuth:
        - credit_transfers:read
      operationId: getPaymentsV2betaCreditTransferBatches
      x-operation-id-source: derived
  /payments/v2beta/credit-transfer-batches/{id}:
    get:
      summary: Get credit transfer batch
      description: Retrieve a specific credit transfer batch by id or external id.
      tags:
      - Credit Transfers
      parameters:
      - $ref: '#/components/parameters/ResourceIDOrExternalID'
      responses:
        '200':
          description: A credit transfer batch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentBatch'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - basicAuth:
        - credit_transfers:read
      operationId: getPaymentsV2betaCreditTransferBatchesById
      x-operation-id-source: derived
  /payments/v2beta/credit-transfer-batches/{id}/results:
    get:
      summary: List credit transfer batch results
      description: 'List processing results for individual credit transfer requests that were part of a credit transfer batch.

        The result items represent the result(s) of processing the batch request input but doesn''t not represent the end-to-end processing of the payment.'
      tags:
      - Credit Transfers
      parameters:
      - $ref: '#/components/parameters/ResourceID'
      - $ref: '#/components/parameters/PaginationToken'
      - $ref: '#/components/parameters/QueryLimit'
      - description: 'Filter based on presence of `errors`. If `true`, only

          results with at least one error will be included. If `false`, only

          results with no errors will be included.

          '
        in: query
        name: errors
        schema:
          type: boolean
      - description: 'Filter based on `skipped`. If `true`, only results related

          to input record that were skipped will be included. If

          `false`, only results that are not related to skipped

          input records will be included.

          '
        in: query
        name: skipped
        schema:
          type: boolean
      responses:
        '200':
          description: A list of payment batch results.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ListResponse'
                - properties:
                    items:
                      items:
                        $ref: '#/components/schemas/BatchResult'
                      type: array
                  type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: 'Not found will be returned if no payment batch with given

            id exists or if the payment batch is not yet in status

            `COMPLETED`.

            '
          $ref: '#/components/responses/NotFound'
      security:
      - basicAuth: []
      operationId: getPaymentsV2betaCreditTransferBatchesByIdResults
      x-operation-id-source: derived
  /payments/v2beta/credit-transfer-batches/{id}:approve:
    post:
      summary: Approve credit transfer batch
      description: 'Approve the batch of credit transfers.


        Approval of a batch is only applicable when the batch `treatment` is `BATCH`.'
      tags:
      - Credit Transfers
      parameters:
      - $ref: '#/components/parameters/ResourceIDOrExternalID'
      - $ref: '#/components/parameters/IfMatchETag'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveBatchRequest'
      responses:
        '202':
          description: 'The request to approve the batch and all the payments it

            contains has been accepted.


            Note that the approval status of the individual payments

            may be processed asynchronous.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentBatch'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - basicAuth:
        - credit_transfers:update
      operationId: postPaymentsV2betaCreditTransferBatches{id}:approve
      x-operation-id-source: derived
  /payments/v2beta/credit-transfer-batches/{id}:reject:
    post:
      summary: Reject credit transfer batch
      description: 'Reject the batch of credit transfers.


        Rejection of a batch is only applicable when the batch `treatment` is `BATCH`.'
      tags:
      - Credit Transfers
      parameters:
      - $ref: '#/components/parameters/ResourceIDOrExternalID'
      - $ref: '#/components/parameters/IfMatchETag'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectPaymentRequest'
      responses:
        '202':
          description: 'The request to reject the batch and all the payments it

            contains has been accepted.


            Note that the rejection status of the individual payments

            may be processed asynchronous.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentBatch'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - basicAuth:
        - credit_transfers:update
      operationId: postPaymentsV2betaCreditTransferBatches{id}:reject
      x-operation-id-source: derived
components:
  schemas:
    SchemeDetailsUrgency:
      type: string
      description: The urgency of the payment.
      enum:
      - HIGH
    AccountHolder:
      type: object
      description: Information about the legal holder of an account.
      properties:
        type:
          type: string
          enum:
          - COUNTERPARTY
          - ENTITY
          - INLINE
          readOnly: true
        id:
          type: string
          description: Resource ID of either a `Counterparty` or an `Entity`. Absent when `type` is `INLINE`, since an inline holder refers to no resource.
          readOnly: true
        externalId:
          $ref: '#/components/schemas/ExternalID'
          description: External ID of either a `Counterparty` or an `Entity`.
        legalName:
          type: string
          description: The legal name of the account holder. Some banks, and for some payment schemes, the correctness of the legal name will be validated and payments may be rejected if legal names do not match.
          readOnly: true
        address:
          description: Postal address of the account holder.
          $ref: '#/components/schemas/Address'
          readOnly: true
        nationalIdentifier:
          description: The national identifier of the account holder.
          $ref: '#/components/schemas/NationalIdentifier'
          readOnly: true
        partyType:
          description: The party type of the account holder.
          $ref: '#/components/schemas/PartyType'
          readOnly: true
        email:
          description: Email of the account holder.
          example: john.smith@example.com
          type: string
          readOnly: true
      required:
      - type
      - legalName
      examples:
      - type: ENTITY
        id: 29a4555b-99b2-4de7-9062-47c8ebc03f56
        legalName: Example Company GmbH
        address:
          country: DE
          city: Munich
          postalCode: '123456'
      - type: COUNTERPARTY
        id: f3efbb73-4e5b-4b22-adeb-918bbf1dfbd8
        legalName: John Smith
        address:
          country: US
          city: New York
          postalCode: '123456'
    CreditTransfer:
      type: object
      properties:
        id:
          description: ID of the credit transfer.
          $ref: '#/components/schemas/ResourceID'
          example: 76992987-48fc-4b03-b609-ea6fdc3045b4
        organizationId:
          $ref: '#/components/schemas/OrganizationID'
        creatorUserId:
          $ref: '#/components/schemas/ResourceID'
          description: ID of the user that created the credit transfer.
          readOnly: true
        amount:
          $ref: '#/components/schemas/Amount'
          readOnly: true
        scheme:
          $ref: '#/components/schemas/CreditTransferSchemeType'
          readOnly: true
        schemeDetails:
          $ref: '#/components/schemas/SchemeDetails'
          readOnly: true
        date:
          description: Requested payment execution date.
          $ref: '#/components/schemas/Date'
          example: '2022-05-07'
          readOnly: true
        status:
          $ref: '#/components/schemas/PaymentStatus'
          readOnly: true
        statusReason:
          $ref: '#/components/schemas/PaymentStatusReason'
          readOnly: true
        source:
          $ref: '#/components/schemas/AccountSnapshot'
          description: Source account from which funds will be withdrawn. This account will be debited.
          readOnly: true
        sourceHolder:
          $ref: '#/components/schemas/AccountHolder'
          readOnly: true
        destination:
          description: Destination account to which funds will be sent. This account will be credited.
          oneOf:
          - $ref: '#/components/schemas/ExternalAccountSnapshot'
          - $ref: '#/components/schemas/AccountSnapshot'
          - $ref: '#/components/schemas/InlineExternalAccountSnapshot'
          discriminator:
            propertyName: type
            mapping:
              ACCOUNT: '#/components/schemas/AccountSnapshot'
              EXTERNAL_ACCOUNT: '#/components/schemas/ExternalAccountSnapshot'
              INLINE: '#/components/schemas/InlineExternalAccountSnapshot'
          readOnly: true
        destinationHolder:
          $ref: '#/components/schemas/AccountHolder'
          readOnly: true
        approvalSteps:
          type: array
          items:
            $ref: '#/components/schemas/PaymentApprovalStep'
          readOnly: true
        attachedTransactions:
          type: array
          items:
            $ref: '#/components/schemas/AttachedTransactionRef'
          readOnly: true
        reference:
          $ref: '#/components/schemas/PaymentReference'
        referenceType:
          $ref: '#/components/schemas/RemittanceType'
          description: The reference type requested at creation time, if any.
          readOnly: true
        categoryPurpose:
          $ref: '#/components/schemas/CategoryPurpose'
        chargeBearer:
          $ref: '#/components/schemas/ChargeBearer'
        regulatoryReporting:
          type: array
          x-omitempty: true
          items:
            $ref: '#/components/schemas/RegulatoryReportingDetails'
          maxItems: 10
          readOnly: true
        taxDetails:
          description: Tax payment details for split payment schemes like Polish MPP.
          $ref: '#/components/schemas/TaxDetails'
          readOnly: true
        connectionInstructionId:
          type: string
          description: The ID of the instruction that was sent to the bank in which this credit transfer was included when it was created.
          example: c1d6502c-07c7-4c77-bee5-963f9464c7d8
          readOnly: true
        batch:
          description: Details of the associated payments batch if the credit transfer was created as part of a batch.
          $ref: '#/components/schemas/BatchDetails'
        paymentScheduleId:
          description: ID of the payment schedule associated with this credit transfer.
          $ref: '#/components/schemas/ResourceID'
        etag:
          $ref: '#/components/schemas/ETag'
        externalId:
          $ref: '#/components/schemas/ExternalID'
          readOnly: true
        metadata:
          $ref: '#/components/schemas/Metadata'
          readOnly: true
        version:
          $ref: '#/components/schemas/ResourceVersion'
        created:
          $ref: '#/components/schemas/CreatedTimestamp'
        updated:
          $ref: '#/components/schemas/UpdatedTimestamp'
      required:
      - id
      - organizationId
      - amount
      - scheme
      - date
      - status
      - source
      - sourceHolder
      - destination
      - destinationHolder
      - reference
      - approvalSteps
      - version
      - etag
      - created
      - updated
      - attachedTransactions
    Address:
      description: Postal address.
      type: object
      properties:
        country:
          $ref: '#/components/schemas/CountryCode'
          x-go-type-skip-optional-pointer: true
        countrySubdivision:
          $ref: '#/components/schemas/CountrySubdivision'
          x-go-type-skip-optional-pointer: true
        city:
          example: Stockholm
          type: string
          maxLength: 64
        postalCode:
          example: '11111'
          type: string
          maxLength: 16
        streetName:
          example: Example street
          type: string
          maxLength: 64
        streetNumber:
          example: '47'
          type: string
          maxLength: 16
    ApprovePaymentRequest:
      type: object
      properties:
        approvalStepId:
          type: string
          description: The id of the approval step to be approved.
      required:
      - approvalStepId
      examples:
      - approvalStepId: 52699442-e06f-4cda-b2a8-cdeca08ff9d3
    BatchErrors:
      description: A list of error details if the batch failed. Only populated once the batch has reached status `COMPLETED`. Only the first 255 errors (if any) will be present in this list. If there are more errors, the complete list can be retrieved using the results endpoint for the batch.
      type: array
      items:
        $ref: '#/components/schemas/ErrorDetails'
      maxItems: 255
    InternalAccountRef:
      type: object
      description: A reference to an (internal) Account.
      properties:
        type:
          $ref: '#/components/schemas/AccountType'
        id:
          type: string
          description: ID of an (internal) Account.
      required:
      - type
      - id
      examples:
      - type: ACCOUNT
        id: 31d593d7-fff9-4783-aa1d-92acb7b21a19
    ResourceID:
      type: string
      description: Unique resource identifier.
      minLength: 32
      maxLength: 64
      examples:
      - 2ed9a3ee-60aa-4f9f-a858-2eed4eefbbc8
    CreateCreditTransferRequest:
      type: object
      properties:
        amount:
          $ref: '#/components/schemas/AmountInput'
        scheme:
          $ref: '#/components/schemas/CreditTransferSchemeType'
        schemeDetails:
          $ref: '#/components/schemas/SchemeDetailsInput'
        date:
          description: Requested payment execution date. It is a local date from the source account's point-of-view. Cannot be set to before the current date, and not more than 60 days into the future.
          $ref: '#/components/schemas/Date'
          example: '2022-05-07'
        source:
          description: A reference identifying the source account (as found from `/financial-data/v2/accounts`).
          $ref: '#/components/schemas/InternalAccountRef'
        destination:
          $ref: '#/components/schemas/CreditTransferDestination'
        reference:
          $ref: '#/components/schemas/PaymentReference'
        referenceType:
          $ref: '#/components/schemas/RemittanceType'
          description: 'Optional hint about how `reference` should be carried toward

            the destination bank. If the payment scheme supports the

            requested type Atlar will comply; otherwise Atlar may ignore

            the hint and pick the appropriate carrier for the scheme.

            Omitting this field lets Atlar choose per scheme.

            '
        categoryPurpose:
          $ref: '#/components/schemas/CategoryPurpose'
        chargeBearer:
          $ref: '#/components/schemas/ChargeBearer'
        regulatoryReporting:
          description: Regulatory reporting can be used to provide additional information when needed due to regulatory and statutory requirements.
          type: array
          maxItems: 10
          x-omitempty: true
          items:
            $ref: '#/components/schemas/RegulatoryReportingDetails'
        taxDetails:
          description: Tax payment details for split payment schemes like Polish MPP (Mechanizm Podzielonej Płatności). When specified and supported, the bank will automatically route the tax amount to the vendor's VAT account.
          $ref: '#/components/schemas/TaxDetailsInput'
        externalId:
          $ref: '#/components/schemas/ExternalID'
        metadata:
          $ref: '#/components/schemas/Metadata'
        paymentScheduleId:
          description: ID of the payment schedule to associate with this credit transfer. Defaults to the organization's default schedule.
          $ref: '#/components/schemas/ResourceID'
      required:
      - amount
      - scheme
      - date
      - source
      - destination
      - reference
    PaymentJSONPatchReplaceDate:
      description: Change payment execution date.
      type: object
      properties:
        op:
          type: string
          enum:
          - replace
        path:
          type: string
          enum:
          - /date
        value:
          $ref: '#/components/schemas/Date'
          example: '2022-05-08'
      additionalProperties: false
      required:
      - op
      - path
      - value
    RoutingConstraints:
      description: Constraints on a `RoutingIdentifier`.
      type: object
      properties:
        accountNumberType:
          $ref: '#/components/schemas/AccountIdentifierType'
          x-go-type-skip-optional-pointer: true
        scheme:
          type: string
    ResourceVersion:
      type: integer
      description: 'Resource version. Starts at value `1` when the resource is

        created and increases by one for each successive update.'
      example: 1
      minimum: 1
      readOnly: true
    AmountStringValueInput:
      type: object
      properties:
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        stringValue:
          description: A string representation of the amount value, which will be a decimal number if the currency has decimals. The number is not formatted for display purposes (e.g. with thousand separator) and always contains the dot `.` character as decimal separator.
          example: '15.02'
          type: string
      required:
      - currency
      - stringValue
    BatchTreatmentType:
      type: string
      deprecated: true
      description: 'Deprecated: You can approve or reject on batch and individual level regardless of the treatment type.

        '
      enum:
      - INDIVIDUAL_PAYMENTS
      - BATCH
      example: INDIVIDUAL_PAYMENTS
    PaymentBatch:
      type: object
      properties:
        id:
          description: ID of the batch.
          $ref: '#/components/schemas/ResourceID'
          example: e284485b-e41b-4237-a115-5a02507eacec
        organizationId:
          $ref: '#/components/schemas/OrganizationID'
        treatment:
          $ref: '#/components/schemas/BatchTreatmentType'
        input:
          description: Deprecated - use `inputDetails` and `inputContent`.
          $ref: '#/components/schemas/BatchInputMetadata'
          x-atlar-fields-enum-skip: true
        inputContent:
          $ref: '#/components/schemas/BatchInputContent'
        inputDetails:
          description: 'Summary of the batch input: amount totals per currency (`sums`) and optional date

            range across requested execution dates.'
          $ref: '#/components/schemas/PaymentBatchDetails'
        results:
          description: 'Deprecated - use `resultSummary` and `resultDetails`. Summary of processing results.


            The summary is only populated when the batch `status` is `COMPLETED`.


            Detailed processing results can be retrieved using

            https://docs.atlar.com/v2.0/reference/get_payments-v2beta-credit-transfer-batches-id-results.

            '
          $ref: '#/components/schemas/BatchResultsSummary'
          readOnly: true
          x-atlar-fields-enum-skip: true
        resultSummary:
          description: 'Counts of how input records were processed (total / succeeded / failed / skipped).

            Only populated when the batch `status` is `COMPLETED`.'
          $ref: '#/components/schemas/BatchResultSummary'
        resultDetails:
          description: 'Amount totals per currency for successfully processed payments in the batch.

            Only populated when the batch `status` is `COMPLETED`. May differ from

            `inputDetails.sums` when records were skipped.'
          $ref: '#/components/schemas/PaymentBatchDetails'
        status:
          $ref: '#/components/schemas/BatchStatus'
          readOnly: true
        errors:
          $ref: '#/components/schemas/BatchErrors'
        approvalSteps:
          deprecated: true
          x-deprecated-reason: Batch-level approval steps are no longer populated. Use the approval steps on each payment. This field will be removed in the future.
          description: 'Batch approval steps, including who approved or rejected (`approver`), step

            `status`, and `requiredRoleIds`.


            Approval steps will only be available once the batch

            `status` is `COMPLETED`. I.e. no action must be taken

            based on the absence of approval steps (empty array).

            '
          type: array
          items:
            $ref: '#/components/schemas/PaymentApprovalStep'
          readOnly: true
        externalId:
          $ref: '#/components/schemas/ExternalID'
        approvalResults:
          description: Counts of fully approved vs rejected payments in this batch.
          $ref: '#/components/schemas/ApprovalResults'
        creatorUserId:
          $ref: '#/components/schemas/ResourceID'
          description: ID of the user that created the batch.
          readOnly: true
        sourceAccountIds:
          type: array
          description: IDs of the accounts that the payments in this batch are initiated from.
          items:
            $ref: '#/components/schemas/ResourceID'
          uniqueItems: true
          readOnly: true
          x-omitempty: true
        metadata:
          $ref: '#/components/schemas/Metadata'
        etag:
          $ref: '#/components/schemas/ETag'
        version:
          $ref: '#/components/schemas/ResourceVersion'
        created:
          $ref: '#/components/schemas/CreatedTimestamp'
        updated:
          $ref: '#/components/schemas/UpdatedTimestamp'
      required:
      - treatment
      - id
      - organizationId
      - etag
      - status
      - version
      - created
      - updated
      - input
      - inputContent
      - inputDetails
      - approvalSteps
      - approvalResults
    PaymentJSONPatchReplaceStatusReasonCode:
      description: Set payment status reason (code). This can only be used toghether with `replace` path `/status`.
      externalDocs:
        url: https://www.iso20022.org/catalogue-messages/additional-content-messages/external-code-sets
      type: object
      properties:
        op:
          type: string
          enum:
          - replace
        path:
          type: string
          enum:
          - /statusReason/code
        value:
          type: string
          description: A ISO 20022 status reason code in the <a href="https://www.iso20022.org/catalogue-messages/additional-content-messages/external-code-sets">external code set</a> _ExternalStatusReason1Code_.
          minLength: 4
          maxLength: 4
      additionalProperties: false
      required:
      - op
      - path
      - value
    OrganizationID:
      type: string
      description: Unique resource identifier for an Organization.
      examples:
      - 0160f6ab-5741-49e1-af46-9138927e547e
    AmountInput:
      oneOf:
      - $ref: '#/components/schemas/AmountIntegerValueInput'
      - $ref: '#/components/schemas/AmountStringValueInput'
    ExternalAccountRef:
      type: object
      description: A reference to an External Account.
      properties:
        type:
          $ref: '#/components/schemas/AccountType'
        id:
          type: string
          description: ID or External ID of an External Account. Prefix External IDs with `external:`.
      required:
      - type
      - id
      example:
        type: EXTERNAL_ACCOUNT
        id: 86faeacd-05f0-4836-a86c-51b871e10299
    BatchResult:
      description: 'Result of processing an individual payment request as part of

        a batch request.

        '
      type: object
      properties:
        paymentId:
          description: 'ID of the payment (a credit transfer or direct debit

            resource). Present if the result represent the successful

            creation of a credit transfer or direct debit resource.

            '
          type: string
          $ref: '#/components/schemas/ResourceID'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetails'
            minItems: 0
          x-omitempty: true
        skipped:
          description: 'Indicates whether a given payment request was skipped when

            processed as part of a batch.

            '
          type: boolean
        recordIndex:
          description: '0-based index specifying which record in the batch input that

            this result is associated with. If the batch input was a

            CSV file the `recordIndex` will refer to rows (lines) in

            the file. If the batch input was JSON it will refer to

            JSON array indicies.


            If the error(s) are not directly related to a specific

            record/row/line the `recordIndex` will not be present.

            '
          type: integer
        externalId:
          $ref: '#/components/schemas/ExternalID'
          description: External ID of the payment, if any.
      examples:
      - paymentId: a0285f2e-f0c8-11ee-bae7-aa94e258a7ae
        recordIndex: 1
      - errors:
        - error: Account not found
          field: file.123.source.id
          code: account_not_found
        recordIndex: 123
      - skipped: true
        errors:
        - error: Invalid account number type
          field: file.456.destination.identifiers.0.type
          code: invalid_accountnumber_type_for_market
        recordIndex: 456
      - errors:
        - error: General processing failure
    CreateCreditTransferBatchRequest:
      type: object
      properties:
        treatment:
          $ref: '#/components/schemas/BatchTreatmentType'
        payments:
          type: array
          items:
            $ref: '#/components/schemas/CreateCreditTransferRequest'
          minItems: 1
          maxItems: 2000
        externalId:
          $ref: '#/components/schemas/ExternalID'
        skipValidationErrors:
          type: boolean
          description: Skip/ignore input records that contain validation errors.
        metadata:
          $ref: '#/components/schemas/Metadata'
      required:
      - treatment
      - payments
    Instrument:
      type: object
      description: The payment instrument used to initiate the payment. For example Citi has a proprietary payment instrument called WorldLink, which can be used to initiate payments.
      oneOf:
      - $ref: '#/components/schemas/CitiWorldlinkInstrument'
      - $ref: '#/components/schemas/USACHInstrument'
      discriminator:
        propertyName: type
        mapping:
          CITI_WORLDLINK: '#/components/schemas/CitiWorldlinkInstrument'
          US_ACH: '#/components/schemas/USACHInstrument'
    CreditTransferSchemeType:
      type: string
      description: "Payment scheme. Choose among: <ul>\n  <li><code>SCT</code> (<a href=\"https://www.europeanpaymentscouncil.eu/what-we-do/sepa-credit-transfer\">SEPA Credit\nTransfer</a>)</li>\n  <li><code>SCT_INST</code> (<a href=\"https://www.europeanpaymentscouncil.eu/what-we-do/sepa-instant-credit-transfer\">SEPA Instant\nCredit Transfer</a>)</li>\n  <li><code>CROSS_BORDER</code> (<a href=\"https://www.swift.com\">Swift</a>)</li>\n  <li><code>GB_CT_BACS</code> (UK account-to-account <a href=\"https://www.bacs.co.uk\">BACS</a>)\n  <li><code>GB_CT_CHAPS</code> (UK account-to-account <a\nhref=\"https://www.bankofengland.co.uk/payment-and-settlement/chaps\">CHAPS</a>)</li>\n  <li><code>GB_CT_FPS</code> (UK account-to-account <a\nhref=\"https://www.wearepay.uk/what-we-do/payment-systems/faster-payment-system/\">Faster Payments</a>)</li>\n  <li><code>SE_A2A</code> (Swedish account-to-account)</li>\n  <li><code>SE_GIRO</code> (Swedish <a href=\"https://www.bankgirot.se\">Bankgiro</a> and/or <a\nhref=\"https://en.wikipedia.org/wiki/PlusGirot\">PlusGiro</a>)</li>\n  <li><code>DK_A2A</code> (Danish account-to-account)</li>\n  <li><code>DK_CT_SAMEDAY</code> (Danish same-day credit transfer)</li>\n  <li><code>DK_CT_INST</code> (Danish instant credit transfer)</li>\n  <li><code>DK_CT_FIK71</code> (Danish FIK71 credit transfer)</li>\n  <li><code>DK_CT_FIK73</code> (Danish FIK73 credit transfer)</li>\n  <li><code>DK_CT_FIK75</code> (Danish FIK75 credit transfer)</li>\n  <li><code>DK_CT_NEMKONTO</code> (Danish NemKonto credit transfer)</li>\n  <li><code>DK_CT_T2</code> (Danish T2 credit transfer)</li>\n  <li><code>CH_CT</code> (Swiss account-to-account)</li>\n  <li><code>NO_CT</code> (Norwegian account-to-account)</li>\n  <li><code>NO_CT_KID</code> (Norwegian KID payment)</li>\n  <li><code>US_CT_ACH</code> (US ACH)</li>\n  <li><code>US_CT_WIRE</code> (US Wire)</li>\n  <li><code>IS_CT</code> (Icelandic account-to-account)</li>\n  <li><code>AU_CT</code> (Australian account-to-account)</li>\n  <li><code>AU_CT_BECS</code> (Australian BECS)</li>\n  <li><code>AU_CT_BPAY</code> (Australian <a href=\"https://www.bpay.com.au/\">BPAY</a>)</li>\n  <li><code>HK_CT</code> (Hong Kong account-to-account)</li>\n  <li><code>HK_CT_CHATS</code> (Hong Kong CHATS)</li>\n  <li><code>HK_CT_FPS</code> (Hong Kong Faster Payment System)</li>\n  <li><code>IL_CT</code> (Israel account-to-account)</li>\n  <li><code>SG_CT</code> (Singapore account-to-account)</li>\n  <li><code>SG_CT_FAST</code> (Singapore FAST)</li>\n  <li><code>SG_CT_GIRO</code> (Singapore Giro)</li>\n  <li><code>SG_CT_MEPS</code> (Singapore MEPS+)</li>\n  <li><code>BG_CT</code> (Bulgarian account-to-account)</li>\n  <li><code>CL_CT</code> (Chilean account-to-account)</li>\n  <li><code>CO_CT</code> (Colombian account-to-account)</li>\n  <li><code>CR_CT</code> (Costa Rican account-to-account)</li>\n  <li><code>CZ_CT</code> (Czech account-to-account)</li>\n  <li><code>MX_CT</code> (Mexican account-to-account)</li>\n  <li><code>MX_CT_SPID</code> (Mexican account-to-account SPID USD)</li>\n  <li><code>MX_CT_SPEI</code> (Mexican SPEI)</li>\n  <li><code>MX_CT_TEF</code> (Mexican TEF)</li>\n  <li><code>MY_CT_IBG</code> (Malaysian Interbank GIRO)</li>\n  <li><code>MY_CT_RENTAS</code> (Malaysian RENTAS)</li>\n  <li><code>KR_CT</code> (South Korean account-to-account)</li>\n  <li><code>TH_CT</code> (Thai account-to-account)</li>\n  <li><code>CA_CT_LYNX</code> (Canadian Lynx credit transfer)</li>\n  <li><code>CA_CT_ACSS</code> (Canadian ACSS credit transfer)</li>\n  <li><code>PE_CT</code> (Peruvian account-to-account)</li>\n  <li><code>PL_CT</code> (Polish account-to-account)</li>\n  <li><code>RO_CT</code> (Romanian account-to-account)</li>\n  <li><code>TR_CT</code> (Turkish account-to-account)</li>\n  <li><code>AE_CT</code> (UAE account-to-account)</li>\n  <li><code>AE_CT_IPI</code> (UAE Instant Payment Instruction)</li>\n  <li><code>DE_CT</code> (Legacy German account-to-account)</li>\n  <li><code>FR_CT</code> (Legacy French account-to-account)</li>\n  <li><code>IN_IMPS</code> (India Immediate Payment Service)</li>\n  <li><code>IN_NEFT</code> (India National Electronic Funds Transfer)</li>\n  <li><code>IN_RTGS</code> (India Real-Time Gross Settlement)</li>\n  <li><code>BR_CT_PIX</code> (Brazilian <a href=\"https://www.bcb.gov.br/en/financialstability/pix_en\">PIX</a>)</li>\n  <li><code>BR_CT_TED</code> (Brazilian <a href=\"https://www.bcb.gov.br/meubc/faqs/p/o-que-e-transferencia-eletronica-disponivel-ted\">TED</a>))</li>\n  <li><code>BOOK_TRANSFER</code> (Book Transfer)</li>\n  <li><code>CN_CT_BEPS</code> (Chinese Bulk Electronic Payment System)</li>\n  <li><code>CN_CT_HVPS</code> (Chinese High Value Payment System)</li>\n  <li><code>VN_CT</code> (Vietnamese account-to-account)</li>\n  <li><code>PH_CT_PESONET</code> (Philippines PESONet)</li>\n  <li><code>PH_CT_INSTAPAY</code> (Philippines InstaPay)</li>\n  <li><code>PH_CT_PHILPASS</code> (Philippines PhilPaSS)</li>\n  <li><code>PH_CT_PDDTS</code> (Philippines Domestic Dollar Transfer System)</li>\n  <li><code>RS_CT</code> (Serbian account-to-account)</li>\n  <li><code>JP_CT</code> (Japanese account-to-account)</li>\n  <li><code>MU_CT</code> (Mauritian account-to-account)</li>\n  <li><code>KE_CT_RTGS</code> (Kenya Real-Time Gross Settlement)</li>\n  <li><code>GE_CT_RTGS</code> (Georgia Real-Time Gross Settlement)</li>\n  <li><code>ZA_CT_EFT</code> (South African domestic EFT)</li>\n  <li><code>BD_CT_BEFTN</code> (Bangladesh Electronic Funds Transfer Network)</li>\n  <li><code>BD_CT_RTGS</code> (Bangladesh Real-Time Gross Settlement)</li>\n  <li><code>MA_CT</code> (Moroccan account-to-account)</li>\n  <li><code>SA_CT_SARIE</code> (Saudi Arabian SARIE)</li>\n</ul>"
