    BatchAmountSums:
      type: array
      description: 'The total amount sum per each currency of resources in this batch.


        Note that batch amount sums reported on the batch input metadata

        refer to the total amount sums of the input records (resources)

        while the batch amount sums reported on the batch result refer

        to the total amount sums of the successfully processed records (resources).

        This means that there may be a difference in the total sum for the input

        vs the result, due to skipped records (resources).

        '
      items:
        $ref: '#/components/schemas/Amount'
      readOnly: true
    USACHInstrument:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/InstrumentType'
        usAchCompanyId:
          type: string
          description: The US ACH Company ID assigned to the account to initiate US ACH payments.
          example: '1234567890'
        usAchCompanyName:
          type: string
          description: 'Optional US ACH Company Name override. When set, it is used as the debtor name (Dbtr/Nm)

            on outgoing US ACH payments from this account instead of the account holder''s legal name.

            Only used for US ACH payments.

            '
          example: ACME PAYROLL
        usAchImmediateOrigin:
          type: string
          description: 'Optional US ACH Immediate Origin. When set, it populates the Immediate Origin field of the

            NACHA file header instead of the US ACH Company ID. Some banks assign an Immediate Origin

            that is distinct from the Company ID. Only used for US ACH payments.

            '
          example: '1234567890'
      required:
      - type
      - usAchCompanyId
    PartyType:
      type: string
      description: The legal type of a party
      enum:
      - INDIVIDUAL
      - COMPANY
      example: INDIVIDUAL
    CitiWorldlinkInstrument:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/InstrumentType'
        citiWorldlinkId:
          type: string
          description: The WorldLink ID assigned to the account to initiate payments.
          example: '123456789'
      required:
      - type
      - citiWorldlinkId
