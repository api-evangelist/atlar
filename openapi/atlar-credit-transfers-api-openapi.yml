      example: IBAN
    PaymentReference:
      type: string
      description: This reference will be sent to the destination bank and recipient. (This type of reference is sometimes also referred to as remittance information.)
      maxLength: 140
    RoutingIdentifier:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/RoutingIdentifierType'
        number:
          type: string
          description: The form of the routing number depends on `type`. E.g. for `BIC` the value should be an 8 or 11 character BIC/SWIFT code. For `GB_DSC` (UK domestic routing) the value should be a six digit sort code.
          minLength: 1
          maxLength: 255
        invalid:
          type: boolean
          description: Will be `true` if the routing identifier is invalid according to Atlar validation rules.
          readOnly: true
        constraints:
          $ref: '#/components/schemas/RoutingConstraints'
      required:
      - type
      - number
      examples:
      - type: BIC
        number: BUKBGB22
      - type: US_ABA
        number: '123456789'
      - type: DE_BLZ
        number: '12345678'
      - type: SE_SBA
        number: '9960'
      - type: BIC
        number: '123'
        invalid: true
    TaxDetails:
      type: object
      description: Tax payment details for split payment schemes.
      properties:
        type:
          $ref: '#/components/schemas/TaxDetailsType'
        amount:
          $ref: '#/components/schemas/Amount'
        creditorId:
          type: string
        invoiceNumber:
          type: string
      required:
      - type
      - amount
    TaxDetailsType:
      type: string
      description: Type of tax payment scheme.
      enum:
      - PL_MPP
      example: PL_MPP
    CreatedTimestamp:
      type: string
      format: date-time
      description: Time at which the resource was created.
      example: '2022-05-04T18:31:12.889104898Z'
      readOnly: true
    SchemeDetails:
      type: object
      properties:
        instrument:
          $ref: '#/components/schemas/Instrument'
        intraCompany:
          type: boolean
          description: Whether the payment is between companies within the same group.
        initiatorId:
          type: string
        urgency:
          $ref: '#/components/schemas/SchemeDetailsUrgency'
    PaymentJSONPatchReplaceAttachedTransactions:
      description: Change the attached transactions of a payment.
      type: object
      properties:
        op:
          type: string
          enum:
          - replace
        path:
          type: string
          enum:
          - /attachedTransactions
        value:
          type: array
          items:
            $ref: '#/components/schemas/AttachedTransactionRef'
      required:
      - op
      - path
      - value
    PaymentJSONPatchReplaceStatus:
      description: Change payment status. This is forcing a status change and is by-passing the standard Atlar payment state/status machine.
      type: object
      properties:
        op:
          type: string
          enum:
          - replace
        path:
          type: string
          enum:
          - /status
        value:
          $ref: '#/components/schemas/PaymentStatus'
          example: RETURNED
      additionalProperties: false
      required:
      - op
      - path
      - value
    BatchDetails:
      type: object
      properties:
        id:
          description: ID of the batch.
          $ref: '#/components/schemas/ResourceID'
        treatment:
          $ref: '#/components/schemas/BatchTreatmentType'
      required:
      - id
      - treatment
    AccountSnapshot:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/AccountType'
        id:
          description: ID of the (internal) Account.
          $ref: '#/components/schemas/ResourceID'
        organizationId:
          $ref: '#/components/schemas/OrganizationID'
        market:
          $ref: '#/components/schemas/MarketCode'
          readOnly: true
        identifiers:
          type: array
          items:
            $ref: '#/components/schemas/AccountIdentifier'
          minItems: 1
          uniqueItems: true
          readOnly: true
        routing:
          type: array
          items:
            $ref: '#/components/schemas/RoutingIdentifier'
          uniqueItems: true
          maxItems: 5
          readOnly: true
        currency:
          $ref: '#/components/schemas/CurrencyCode'
          readOnly: true
      required:
      - type
      - id
      - organizationId
      - market
      - currency
      - identifiers
      - routing
      examples:
      - id: ac1963d7-fff9-4783-aa1d-92acb7b21a19
        type: ACCOUNT
        organizationId: 0160f6ab-5741-49e1-af46-9138927e547e
        market: DE
        currency: EUR
        identifiers:
        - market: DE
          type: IBAN
          number: DE89370400440532013000
        routing:
        - type: BIC
          number: COBADEFFXXX
    AttachedTransactionRef:
      type: object
      description: An association between a _transactable_ payment resource, e.g. a _Credit Transfer_, _Direct Debit_, or _Expected Transaction_, and an account _Transaction_.
      properties:
        type:
          type: string
          description: The resource type of the attached transaction
          enum:
          - TRANSACTION
          readOnly: true
        id:
          type: string
          description: ID of the attached transaction resource.
          readOnly: true
      examples:
      - type: TRANSACTION
        id: 27abf7cb-3867-4119-bfa7-ee3fb667ecf3
      required:
      - type
      - id
    InstrumentInput:
      type: object
      oneOf:
      - $ref: '#/components/schemas/CitiWorldlinkInstrumentInput'
      discriminator:
        propertyName: type
        mapping:
          CITI_WORLDLINK: '#/components/schemas/CitiWorldlinkInstrumentInput'
    ChargeBearer:
      type: string
      description: Charge bearer specifies which party should bear the charges of the transaction.
      enum:
      - SHARED
      - DEBTOR
      - CREDITOR
      - SERVICE_LEVEL
      example: SHARED
    InstrumentType:
      type: string
      description: The type of the payment instrument.
      enum:
      - US_ACH
      - CITI_WORLDLINK
      example: CITI_WORLDLINK
    MarketCode:
      type: string
      description: Two-letter ISO 3166-1 alpha2 country code.
      example: DE
      minLength: 2
      maxLength: 2
      pattern: ^[A-Z]{2,2}$
    PaymentStatus:
      description: Status of a payment. Applicable to both credit transfer payments and direct debit payments.
      type: string
      enum:
      - CREATED
      - APPROVED
      - REJECTED
      - PENDING_SUBMISSION
      - SENT
      - PENDING_AT_BANK
      - ACCEPTED
      - EXECUTED
      - FAILED
      - RETURNED
      - UNKNOWN
      example: SENT
    BatchStatus:
      type: string
      description: 'The status of this batch. The status only refers to the

        processing of the input, not the processing or success of

        the resources themselves.


        `COMPLETED` is the only end-state. Failure is indicated by a non-empty list of `errors`.

        '
      example: COMPLETED
      enum:
      - CREATED
      - PROCESSING_STARTED
      - COMPLETED
    PaymentBatchDetails:
      description: Details summarizing the contents of the batch — primarily amount totals per currency.
      type: object
      properties:
        sums:
          description: 'Total amount sum per currency for the payments covered by this details object

            (input records when under `inputDetails`, successfully processed payments when

            under `resultDetails`).'
          $ref: '#/components/schemas/BatchAmountSums'
      required:
      - sums
    CountrySubdivision:
      type: string
      description: 'Country subdivision code (second part of the ISO 3166-2 code).

        E.g. state code `CA` for the state of California in the USA, `ON` for the province of Ontario in Canada, `NSW` for the state of New South Wales in Australia.

        ISO 3166-2 codes can be found on the ISO website, for example, for the USA: https://www.iso.org/obp/ui/#iso:code:3166:US.

        In the USA the state code is required for domestic payments, in Canada the province code is required for domestic payments.'
      example: US-CA
      maxLength: 6
      pattern: ^[A-Z]{2,2}-[A-Z0-9]{1,3}$
    ExternalAccountSnapshot:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/AccountType'
          readOnly: true
        id:
          description: ID of the External Account.
          $ref: '#/components/schemas/ResourceID'
        externalId:
          $ref: '#/components/schemas/ExternalID'
          description: External ID of the External Account.
        organizationId:
          $ref: '#/components/schemas/OrganizationID'
        market:
          $ref: '#/components/schemas/MarketCode'
          readOnly: true
        identifiers:
          type: array
          items:
            $ref: '#/components/schemas/AccountIdentifier'
          minItems: 1
          uniqueItems: true
          readOnly: true
        routing:
          type: array
          items:
            $ref: '#/components/schemas/RoutingIdentifier'
          uniqueItems: true
          readOnly: true
          x-omitempty: true
      required:
      - type
      - id
      - organizationId
      - market
      - identifiers
      example:
        id: 31d593d7-fff9-4783-aa1d-92acb7b21a19
        organizationId: 605e26fc-4fce-495a-a92f-2c3592d7287e
        market: GB
        type: EXTERNAL_ACCOUNT
        identifiers:
        - type: IBAN
          market: GB
          number: GB33BUKB20201555555555
        routing:
        - type: BIC
          number: BUKBGB22XXX
    CountryCode:
      type: string
      description: Two-letter ISO 3166-1 alpha2 country code.
      example: DE
      minLength: 2
      maxLength: 2
      pattern: ^[A-Z]{2,2}$
    InlineAccountHolder:
      type: object
      description: Information about the legal holder of an account.
      properties:
        externalId:
          $ref: '#/components/schemas/ExternalID'
          description: Only persisted when an inline destination results in a `Counterparty` being created. It is ignored when the destination is stored inline on the payment instruction.
        legalName:
          type: string
          description: The legal name of the account holder. Some banks, and for some payment schemes, the correctness of the legal name will be validated and payments may be rejected if legal names do not match.
        partyType:
          description: The party type of the account holder.
          $ref: '#/components/schemas/PartyType'
        address:
          description: Postal address of the account holder.
          $ref: '#/components/schemas/Address'
        nationalIdentifier:
          description: The national identifier of the account holder.
          $ref: '#/components/schemas/NationalIdentifier'
        email:
          description: Email of the account holder.
          example: john.smith@example.com
          type: string
          maxLength: 256
      required:
      - legalName
      examples:
      - legalName: Example Company GmbH
        address:
          country: DE
          city: Berlin
          postalCode: '10115'
          streetName: Friedrichstrasse
          streetNumber: '123'
    InlineExternalAccountSnapshot:
      type: object
      description: A destination account that was defined inline on the payment instruction. It does not refer to an `ExternalAccount` or any other resource, and therefore has no `id`.
      properties:
        type:
          $ref: '#/components/schemas/AccountType'
          readOnly: true
        organizationId:
          $ref: '#/components/schemas/OrganizationID'
        market:
          $ref: '#/components/schemas/MarketCode'
          readOnly: true
        identifiers:
          type: array
          items:
            $ref: '#/components/schemas/AccountIdentifier'
          minItems: 1
          uniqueItems: true
          readOnly: true
        routing:
          type: array
          items:
            $ref: '#/components/schemas/RoutingIdentifier'
          uniqueItems: true
          readOnly: true
          x-omitempty: true
      required:
      - type
      - organizationId
      - market
      - identifiers
      example:
        organizationId: 605e26fc-4fce-495a-a92f-2c3592d7287e
        market: GB
        type: INLINE
        identifiers:
        - type: IBAN
          market: GB
          number: GB33BUKB20201555555555
        routing:
        - type: BIC
          number: BUKBGB22XXX
    CurrencyCode:
      type: string
      description: Three-letter ISO 4217 currency code.
      example: EUR
      minLength: 3
      maxLength: 3
      pattern: ^[A-Z]{3,3}$
    BatchInputMetadata:
      description: Metadata describing the original input that was used to create a payments batch.
      type: object
      properties:
        recordCount:
          type: integer
          description: Deprecated. Has moved into `content`. Total count of input records (payments) in the input batch.
          readOnly: true
        sums:
          $ref: '#/components/schemas/BatchAmountSums'
        content:
          $ref: '#/components/schemas/BatchInputContent'
      required:
      - recordCount
      - sums
      - content
    SchemeDetailsInput:
      type: object
      properties:
        instrument:
          $ref: '#/components/schemas/InstrumentInput'
        intraCompany:
          type: boolean
          description: Whether the payment is between companies within the same group.
        urgency:
          $ref: '#/components/schemas/SchemeDetailsUrgency'
    CreditTransferBatchContentType:
      type: string
      description: 'The content type of the batch.


        See https://docs.atlar.com/docs/batch-payments#csv-format for details on the CSV format for credit transfer batches.'
      enum:
      - application/vnd.atlar.payments.v2.credit-transfer.batch+csv
      - application/vnd.atlar.payments.v2.credit-transfer.batch+json
      example: application/vnd.atlar.payments.v2.credit-transfer.batch+csv
    NationalIdentifier:
      type: object
      properties:
        type:
          type: string
          description: Type of the national identifier.
          enum:
          - CIVIC
          - COMPANY
          example: CIVIC
        market:
          $ref: '#/components/schemas/MarketCode'
        number:
          type: string
          description: The identifier itself.
          example: '2012121212'
      required:
      - type
      - market
      - number
    AccountIdentifier:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/AccountIdentifierType'
        market:
          $ref: '#/components/schemas/MarketCode'
          description: 'The market of the `AccountIdentifier` specifies in which market-context the identifier should be treated.


            A `NUMBER` from Sweden does not look and does not validate in the same way as a `NUMBER` from GB. The market

            code is, in most cases, the same as where the account itself is domiciled, but not necessarily. An examples

            of this discrepancy is Jersey which may have domiciled accounts with market `JE`, but the account identifier

            would be an `IBAN` with country code `GB`.'
        number:
          type: string
          description: The unformatted identifier itself. For type `NUMBER` the structure of the account number is country-specific.
          minLength: 1
          maxLength: 255
        invalid:
          type: boolean
          description: Will be `true` if the account identifier is invalid according to Atlar account identifier validation rules.
          readOnly: true
      required:
      - type
      - market
      - number
      examples:
      - type: IBAN
        market: DE
        number: DE75512108001245126199
      - type: NUMBER
        market: GB
        number: '12345678'
      - type: NUMBER
        market: SE
        number: '6114517182351'
      - type: IBAN
        market: DE
        number: '123'
        invalid: true
    RemittanceType:
      type: string
      description: "The kind of reference carried by a payment's remittance information.\n\n- `UNSTRUCTURED`: free-text remittance information, carried on\n  pain.001 as `<RmtInf><Ustrd>`.\n- `CREDITOR_REFERENCE`: a structured creditor reference such as\n  ISO 11649 (RF), Finnish Viitenumero, Norwegian KID, or Swedish\n  Bankgiro/Plusgiro OCR. Carried on pain.001 as\n  `<RmtInf><Strd><CdtrRefInf>` with `<Cd>SCOR</Cd>`.\n- `STRUCTURED`: **deprecated** — use `CREDITOR_REFERENCE` instead.\n  Retained so existing persisted records still parse.\n"
      enum:
      - STRUCTURED
      - UNSTRUCTURED
      - CREDITOR_REFERENCE
      example: CREDITOR_REFERENCE
    UserAuditInfo:
      type: object
      description: User information for audit trail.
      properties:
        id:
          $ref: '#/components/schemas/ResourceID'
          description: User ID
          example: 54528335-739e-4de9-bdb3-28f96c98785d
        username:
          type: string
          example: john.smith@example.com
          readOnly: true
        name:
          type: string
          description: User given name(s) information. May be a concatenation of firstname, lastname etc.
          example: John Smith
          readOnly: true
        roleId:
          type: string
          description: Role ID
          example: 2a1e16eb-2f83-4597-99e2-cffbc4311df2
          readOnly: true
      required:
      - id
      - username
    ApproveBatchRequest:
      type: object
      properties:
        approvalStepId:
          type: string
          description: The id of the approval step to be approved.
      required:
      - approvalStepId
      examples:
      - approvalStepId: 2cf21abd-afab-4a3c-a0e8-c973ec8181f2
    AccountType:
      type: string
      enum:
      - ACCOUNT
      - EXTERNAL_ACCOUNT
      - INLINE
      description: Account type specifier. `ACCOUNT` for internal _Account_ resources. `EXTERNAL_ACCOUNT` for _External Account_ resources.
    RoutingIdentifierType:
      type: string
      enum:
      - BIC
      - AT_BLZ
      - AU_BSB
      - BD_BRN
      - BR_BRANCH
      - BR_COMPE
      - BR_ISP
      - CA_CPA
      - CH_BCC
      - CH_SIC
      - CL_SBIF
      - CN_APS
      - CZ_NBC
      - DE_BLZ
      - ES_NCC
      - GB_DSC
      - GR_BIC
      - HK_NCC
      - IE_NCC
      - IL_NCC
      - IN_FSC
      - IT_NCC
      - JP_ZGN
      - KR_BOK
      - KR_KFTC
      - MX_ABM
      - MY_NCC
      - NZ_NCC
      - PH_BRSTN
      - PL_KNR
      - PT_NCC
      - RU_CBC
      - SE_SBA
      - SG_IBG
      - TH_CBC
      - TW_NCC
      - US_ABA
      - US_PID
      - VN_CITAD
      - ZA_NCC
      description: A routing identifier of type `BIC` must be provided to support cross-border/SWIFT payments.
      example: BIC
    Amount:
      type: object
      properties:
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        stringValue:
          description: 'A string representation of the amount value. This will be

            a decimal number if the currency has decimals. The number

            is not formatted for display purposes (e.g. with locale

            specific thousand separator) and always contains the dot

            `.` character as decimal separator.'
          example: '15.02'
          type: string
        value:
          description: 'The amount value as an integer (int64) represented in

            currency minor units (e.g. 15.02 EUR is represented as the

            value 1502).'
          example: 1502
          type: integer
          format: int64
      required:
      - currency
      - stringValue
      - value
    BatchInputContent:
      description: Metadata describing the input contents that was used to create this batch.
      type: object
      readOnly: true
      properties:
        contentType:
          type: string
        recordCount:
          type: integer
          description: Total count of input records (resources) in the input batch.
          readOnly: true
        size:
          type: integer
          format: int64
          description: 'The size of the input content in bytes.


            If the batch was created by uploading a file using `multipart/form-data` the `contentSize` will be the file size.


            If the batch was created with JSON input this will be the raw JSON size.

            '
          example: 4711
        checksum:
          type: string
          description: 'A checksum of the batch input contents.


            The checksum digest value will be prefixed by an

            identifier of the hash algorithm used, e.g. `sha256`. A

            colon `:` is used as separator between the algorithm

            identifier and the digest value.

            '
          example: sha256:08343d976a896e8563b4915c84878207199b5fa139d3edde1bd77d99339bd18c
        filename:
          type: string
          description: 'The name of the file that was used as input to create the batch.


            Filename will only available if the batch input was provided using `multipart/form-data`.

            '
          example: batch-2022-05-07.csv
      required:
      - recordCount
      - contentType
      - size
      - checksum
    CitiWorldlinkInstrumentInput:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/InstrumentType'
      required:
      - type
    UpdatedTimestamp:
      type: string
      format: date-time
      description: Time at which the resource was last updated.
      example: '2022-05-04T18:47:32.213842599Z'
      readOnly: true
    InlineExternalAccount:
      type: object
      description: An inline-defined (from the point of the payment) Account. This is used in the context of payment initiation.
      properties:
        type:
          $ref: '#/components/schemas/AccountType'
        market:
          $ref: '#/components/schemas/MarketCode'
        identifiers:
          type: array
          items:
            $ref: '#/components/schemas/AccountIdentifier'
          minItems: 1
          maxItems: 1
          uniqueItems: true
        routing:
          type: array
          items:
            $ref: '#/components/schemas/RoutingIdentifier'
          uniqueItems: true
          maxItems: 2
          x-omitempty: true
        externalId:
          $ref: '#/components/schemas/ExternalID'
          description: Only persisted when an inline destination results in an `ExternalAccount` being created. It is ignored when the destination is stored inline on the payment instruction.
        holder:
          $ref: '#/components/schemas/InlineAccountHolder'
      required:
      - type
      - market
      - identifiers
      - holder
      examples:
      - type: INLINE
        market: DE
        identifiers:
        - type: IBAN
          market: DE
          number: DE89370400440532013000
        holder:
          legalName: Example GmbH
    ListResponse:
      type: object
      properties:
        items:
          description: A list of resources.
        nextToken:
          description: 'Pagination token for next page.

            The value will be a non-empty string if there are more resources to be fetched.

            The value will be an empty string if there are no more resources to be fetched.'
          type: string
          example: eyIxIjogIlRoaXMgaXMgYSBkdW1teSBwYWdpbmF0aW9uIHRva2VuLiJ9
        token:
          description: 'The pagination token that was used for this request.

            The value will be an empty string if no `token` query parameter was provided with the request.'
          type: string
          example: eyIwIjogIlRoaXMgaXMgYSBkdW1teSBwYWdpbmF0aW9uIHRva2VuLiJ9
        limit:
          description: The page limit that was used for this request.
          example: 100
          type: integer
      required:
      - items
      - nextToken
      - token
      - limit
    RejectPaymentRequest:
      type: object
      properties:
        reason:
          type: string
          description: An optional rejection reason that will propagate to the reject event on the payment.
          maxLength: 255
      examples:
      - reason: This has been classified as a fraudulent payment
    CreateCreditTransferBatchRequestFormData:
      type: object
      properties:
        treatment:
          $ref: '#/components/schemas/BatchTreatmentType'
        fileContentType:
          $ref: '#/components/schemas/CreditTransferBatchContentType'
        skipValidationErrors:
          type: boolean
          description: Skip/ignore input records that contain validation errors.
        file:
          type: string
          format: binary
        metadata:
          $ref: '#/components/schemas/Metadata'
      required:
      - treatment
      - fileContentType
      - file
    RegulatoryReportingDetails:
      type: object
      properties:
        market:
          $ref: '#/components/schemas/MarketCode'
        indicator:
          $ref: '#/components/schemas/RegulatoryReportingIndicator'
        code:
          description: The actual code to report. Codes are market-specific and found on https://docs.atlar.com
          type: string
      required:
      - market
      - indicator
      - code
    CreditTransferDestination:
      description: A reference identifying the destination account. Can be either an internal or an external account.
      oneOf:
      - $ref: '#/components/schemas/InternalAccountRef'
      - $ref: '#/components/schemas/ExternalAccountRef'
      - $ref: '#/components/schemas/InlineExternalAccount'
      discriminator:
        propertyName: type
        mapping:
          ACCOUNT: '#/components/schemas/InternalAccountRef'
          EXTERNAL_ACCOUNT: '#/components/schemas/ExternalAccountRef'
          INLINE: '#/components/schemas/InlineExternalAccount'
    ErrorDetails:
      type: object
      description: Error detail.
      properties:
        code:
          description: An error code for this error. Not always present.
          example: invalid_value
          type: string
        error:
          description: A description of this specific error.
          example: Must be one of [direct_debits mandates payments]
          type: string
        field:
          description: The field which has an error. This only set if the error has to do with a specific field, such as for validation errors. Nested fields are concatenated with `.`, as well as indexed fields in lists.
          example: filter.0.resource
          type: string
    PaymentStatusReason:
      description: Reason for the status of a payment.
      type: object
      externalDocs:
        url: https://docs.atlar.com/docs/errors-return-reasons
      properties:
        code:
          description: Failure reason code. If present, this is a <a href="https://www.iso20022.org/catalogue-messages/additional-content-messages/external-code-sets">ISO 20022 error code</a>.
          type: string
          readOnly: true
          examples:
          - DS02
          - DS24
        description:
          description: Human readable description of the reason. Can be presented to an end-user.
          type: string
          readOnly: true
      examples:
      - code: DS02
        description: EBICS VEU/EDS signature cancelled by user
      - code: DS24
        description: Waiting time for EBICS VEU/EDS signature expired
    BatchResultsSummary:
      description: Aggregate summary of payment batch processing results.
      type: object
      properties:
        total:
          type: integer
          description: Deprecated. Moved to `processed`. Number of input records that were attempted to be processed.
        succeeded:
