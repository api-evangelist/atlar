      type: string
      description: Unique resource identifier for an Organization.
      examples:
      - 0160f6ab-5741-49e1-af46-9138927e547e
    AmountInput:
      oneOf:
      - $ref: '#/components/schemas/AmountIntegerValueInput'
      - $ref: '#/components/schemas/AmountStringValueInput'
    SchedulingSchedule:
      type: object
      properties:
        frequency:
          type: string
          enum:
          - DEFAULT
          - EVERY_15M
          - HOURLY
          - DISABLED
          description: The frequency of the schedule
        schedule:
          type: array
          items:
            type: integer
          description: Schedule integers (0-23 for HOURLY, 0-3 for EVERY_15M)
          x-omitempty: true
        location:
          type: string
          description: The timezone location (e.g. "Europe/London")
        exclusions:
          type: array
          items:
            $ref: '#/components/schemas/Exclusion'
          description: Time periods to exclude from the schedule
          x-omitempty: true
      required:
      - frequency
    BankAccountType:
      type: string
      enum:
      - WALLET
      - SAVINGS
      - CHECKING
      - INVESTMENT
    AccountIdentifier:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/AccountIdentifierType'
        market:
          $ref: '#/components/schemas/MarketCode'
          description: 'The market of the `AccountIdentifier` specifies in which market-context the identifier should be treated.


            A `NUMBER` from Sweden does not look and does not validate in the same way as a `NUMBER` from GB. The market

            code is, in most cases, the same as where the account itself is domiciled, but not necessarily. An examples

            of this discrepancy is Jersey which may have domiciled accounts with market `JE`, but the account identifier

            would be an `IBAN` with country code `GB`.'
        number:
          type: string
          description: The unformatted identifier itself. For type `NUMBER` the structure of the account number is country-specific.
          minLength: 1
          maxLength: 255
        invalid:
          type: boolean
          description: Will be `true` if the account identifier is invalid according to Atlar account identifier validation rules.
          readOnly: true
      required:
      - type
      - market
      - number
      examples:
      - type: IBAN
        market: DE
        number: DE75512108001245126199
      - type: NUMBER
        market: GB
        number: '12345678'
      - type: NUMBER
        market: SE
        number: '6114517182351'
      - type: IBAN
        market: DE
        number: '123'
        invalid: true
    Exclusion:
      type: object
      description: 'A recurring or one-off time period to exclude from the schedule. dayOfWeek and date are mutually exclusive: set at most one of them. from and to are always required. Times and dates are evaluated in the schedule''s location (UTC when unset).'
      properties:
        dayOfWeek:
          type: integer
          minimum: 0
          maximum: 7
          description: Day of week (1 = Monday, 7 = Sunday). 0 or omitted means the exclusion is not restricted to a weekday. Mutually exclusive with date.
        date:
          $ref: '#/components/schemas/Date'
        from:
          type: string
          format: time
          description: Start time of exclusion (HH:MM:SS)
        to:
          type: string
          format: time
          description: End time of exclusion (HH:MM:SS)
      required:
      - from
      - to
    Metadata:
      type:
      - object
      - 'null'
      additionalProperties:
        type: string
      description: 'Metadata is a `string-string` key-value container that

        can be used to store information known at the time of resource

        creation. This can be retrieved later on, for instance when a

        payment or expected transaction is reconciled with the booked

        transaction on the bank statement.


        Metadata can have at most 20 entries. Keys may have a

        maximum length of 64 chars and values a maximum length of 512

        chars.


        By default, this field is optional. It is possible to make it

        required in the Atlar Dashboard by visiting the [Metadata keys

        page](https://app.atlar.com/metadata-keys). Requirement rules

        can be specified per API resource. Both the Dashboard and the

        API will then enforce these rules and give validation errors

        when the required fields are not set.'
      maxProperties: 20
      example:
        my_metadata_key: 2a9a79b9-601c-449b-aa05-432f41dbbc4a
      x-omitempty: true
    NationalIdentifier:
      type: object
      properties:
        type:
          type: string
          description: Type of the national identifier.
          enum:
          - CIVIC
          - COMPANY
          example: CIVIC
        market:
          $ref: '#/components/schemas/MarketCode'
        number:
          type: string
          description: The identifier itself.
          example: '2012121212'
      required:
      - type
      - market
      - number
    ReportsConfiguration:
      type: object
      properties:
        transport:
          $ref: '#/components/schemas/ReportsTransportConfiguration'
      required:
      - transport
    CreateConnectionReportRequest:
      type: object
      description: 'A manual upload of statement data for a connection.


        Use this when Atlar cannot fetch the data itself — a bank with no

        automatable channel, or a one-off backfill. What you send is stored

        verbatim and stays retrievable as the report''s content, so it is the

        audit record of the upload.


        The JSON body may not exceed 10 MiB. Transactions are what usually push

        an upload towards that, so split a large backfill across requests rather

        than sending one request per day for a whole year.'
      properties:
        statements:
          type: array
          items:
            $ref: '#/components/schemas/CreateStatementRequest'
          minItems: 1
          maxItems: 100
          description: 'One entry per account and local date. Entries are independent and may

            cover different accounts and different dates in the same request; each

            becomes its own statement.


            The request is accepted or rejected as a whole and forms a single

            report, so group everything belonging to one upload together rather

            than sending one request per statement. At most 100 entries — split

            larger backfills across several requests.'
      required:
      - statements
