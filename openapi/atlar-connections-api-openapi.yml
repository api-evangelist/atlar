          example: 0a951c88-3313-472a-b312-ca2e47769670
          type: string
          readOnly: true
        thirdPartyId:
          description: ID of the associated third-party.
          example: 7afef9b2-b078-4485-b76c-f4cf1d69024d
          type: string
          readOnly: true
        affiliationId:
          description: ID of the affiliation. An affiliation is and describes the relationship between the legal entity owning this connection.
          type: string
          readOnly: true
          example: b9a931ce-9606-495d-95b0-8da8251c008a
        alias:
          description: Optional alias of the connection
          type: string
          example: my connection
        configuration:
          $ref: '#/components/schemas/ConnectionConfiguration'
        deprecatedConfiguration:
          type: object
          $ref: '#/components/schemas/DeprecatedConnectionConfiguration'
        capabilities:
          $ref: '#/components/schemas/Capabilities'
        lifecycleState:
          description: The lifecycle state of the connection.
          type: string
          enum:
          - UNDER_DEVELOPMENT
          - LIVE
          - CANCELLED
        inactive:
          description: True if connection has been inactivated
          type: boolean
        version:
          $ref: '#/components/schemas/ResourceVersion'
        etag:
          $ref: '#/components/schemas/ETag'
        created:
          $ref: '#/components/schemas/CreatedTimestamp'
        updated:
          $ref: '#/components/schemas/UpdatedTimestamp'
      required:
      - id
      - organizationId
      - connectionTypeId
      - thirdPartyId
      - affiliationId
      - configuration
      - deprecatedConfiguration
      - capabilities
      - inactive
      - lifecycleState
      - created
      - updated
      - version
      - etag
