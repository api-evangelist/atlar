openapi: 3.2.0
info:
  title: Atlar API (v2) Accounts API
  description: Atlar API (v2)
  version: '0.1'
  contact:
    email: support@atlar.com
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.txt
servers:
- url: https://api.atlar.com
tags:
- name: Accounts
  description: Accounts are financial accounts held by your organization.
  x-displayName: Accounts
paths:
  /financial-data/v2/accounts:
    get:
      summary: List accounts
      description: Returns a list of accounts. For further details on Pagination, see general section above.
      tags:
      - Accounts
      parameters:
      - $ref: '#/components/parameters/QueryLimit'
      - $ref: '#/components/parameters/PaginationToken'
      - description: Include only accounts with a given status.
        in: query
        name: status
        schema:
          type: array
          items:
            $ref: '#/components/schemas/AccountStatus'
      responses:
        '200':
          description: List of accounts.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ListResponse'
                - properties:
                    items:
                      items:
                        $ref: '#/components/schemas/Account'
                      type: array
                  type: object
        '400':
          $ref: '#/components/responses/BadRequest'
      security:
      - basicAuth:
        - accounts:read
      operationId: getFinancialDataV2Accounts
      x-operation-id-source: derived
  /financial-data/v2/accounts/{id}:
    get:
      summary: Get account
      description: Retrieve a specific account.
      tags:
      - Accounts
      parameters:
      - $ref: '#/components/parameters/ResourceID'
        description: Account ID
      responses:
        '200':
          description: An account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - basicAuth:
        - accounts:read
      operationId: getFinancialDataV2AccountsById
      x-operation-id-source: derived
    patch:
      summary: Update account
      description: Update an account.
      tags:
      - Accounts
      parameters:
      - $ref: '#/components/parameters/ResourceID'
      - $ref: '#/components/parameters/IfMatchETag'
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/AccountJSONPatchRequest'
            examples:
              assignAlias:
                summary: Assign an alias
                value:
                - op: replace
                  path: /alias
                  value: My Account
              addMetadataKey:
                summary: Add metadata key & value
                value:
                - op: replace
                  path: /metadata/my_metadata_key
                  value: 2a9a79b9-601c-449b-aa05-432f41dbbc4a
      responses:
        '200':
          description: The updated account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/BadRequest'
      security:
      - basicAuth:
        - accounts:update
      operationId: patchFinancialDataV2AccountsById
      x-operation-id-source: derived
  /financial-data/v2/accounts/{id}/balances:
    get:
      summary: List balances
      description: Returns a list of account balances. For further details on Pagination, see general section above.
      tags:
      - Accounts
      parameters:
      - description: Include only balances associated with the account identified by `id`. If value `-` is specified, balances across all accounts will be queried.
        in: path
        name: id
        required: true
        schema:
          type: string
        examples:
          id:
            value: 31d593d7-fff9-4783-aa1d-92acb7b21a19
            summary: By account identifier.
          hyphen:
            value: '-'
            summary: All accounts.
      - description: Include only balances of specified balance type (`BOOKED` or `AVAILABLE`).
        in: query
        name: type
        schema:
          $ref: '#/components/schemas/BalanceType'
      - description: Include only the most recent balance.
        in: query
        name: mostRecent
        schema:
          type: boolean
      - $ref: '#/components/parameters/QueryLimit'
      - $ref: '#/components/parameters/PaginationToken'
      responses:
        '200':
          description: List of balances.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ListResponse'
                - properties:
                    items:
                      items:
                        $ref: '#/components/schemas/Balance'
                      type: array
                  type: object
        '400':
          $ref: '#/components/responses/BadRequest'
      security:
      - basicAuth:
        - accounts:read
        - account_balances:read
      operationId: getFinancialDataV2AccountsByIdBalances
      x-operation-id-source: derived
  /financial-data/v2beta/accounts/{id}/end-of-day-summaries:
    get:
      summary: List end-of-day summaries
      description: 'Returns a list of end-of-day reporting summaries, on a per

        booked date basis, for the account identified by `id`.


        Note that these summaries are only available based on

        end-of-day reporting, e.g. `camt.053`, `MT940` or equivalent

        end-of-day reporting bank statements.


        Absence of a summary entry for a given account and date means

        Atlar has not (yet) processed booked transactions based on

        end-of-day reporting.


        The primary use case for these summaries is to provide a means

        to determine when it is safe to assume all transactions for a

        given booked date can be listed using the API endpoint GET

        https://api.atlar.com/financial-data/v2/transactions.'
      tags:
      - Accounts
      parameters:
      - description: 'Include only summaries for the account identified by `id`. If value `-` is specified, summaries across all accounts will be included.

          '
        in: path
        name: id
        required: true
        schema:
          type: string
        examples:
          id:
            value: 31d593d7-fff9-4783-aa1d-92acb7b21a19
            summary: Specific account.
          hyphen:
            value: '-'
            summary: All accounts.
      - $ref: '#/components/parameters/QueryLimit'
      - $ref: '#/components/parameters/PaginationToken'
      - description: 'Include only summaries with property `date` matching the given value.

          '
        in: query
        name: date
        schema:
          type: string
          format: date
          example: '2022-01-15'
      responses:
        '200':
          description: List of summaries.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ListResponse'
                - properties:
                    items:
                      items:
                        $ref: '#/components/schemas/AccountReportingSummary'
                      type: array
                  type: object
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - basicAuth:
        - accounts:read
        - transactions:read
      operationId: getFinancialDataV2betaAccountsByIdEndOfDaySummaries
      x-operation-id-source: derived
components:
  responses:
    BadRequest:
      description: Bad request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 400
            message: There is some problem with the data you submitted.
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 404
            message: Resource not found.
  schemas:
    RoutingIdentifierType:
      type: string
      enum:
      - BIC
      - AT_BLZ
      - AU_BSB
      - BD_BRN
      - BR_BRANCH
      - BR_COMPE
      - BR_ISP
      - CA_CPA
      - CH_BCC
      - CH_SIC
      - CL_SBIF
      - CN_APS
      - CZ_NBC
      - DE_BLZ
      - ES_NCC
      - GB_DSC
      - GR_BIC
      - HK_NCC
      - IE_NCC
      - IL_NCC
      - IN_FSC
      - IT_NCC
      - JP_ZGN
      - KR_BOK
      - KR_KFTC
      - MX_ABM
      - MY_NCC
      - NZ_NCC
      - PH_BRSTN
      - PL_KNR
      - PT_NCC
      - RU_CBC
      - SE_SBA
      - SG_IBG
      - TH_CBC
      - TW_NCC
      - US_ABA
      - US_PID
      - VN_CITAD
      - ZA_NCC
      description: A routing identifier of type `BIC` must be provided to support cross-border/SWIFT payments.
      example: BIC
    Instrument:
      type: object
      description: The payment instrument used to initiate the payment. For example Citi has a proprietary payment instrument called WorldLink, which can be used to initiate payments.
      oneOf:
      - $ref: '#/components/schemas/CitiWorldlinkInstrument'
      - $ref: '#/components/schemas/USACHInstrument'
      discriminator:
        propertyName: type
        mapping:
          CITI_WORLDLINK: '#/components/schemas/CitiWorldlinkInstrument'
          US_ACH: '#/components/schemas/USACHInstrument'
    Amount:
      type: object
      properties:
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        stringValue:
          description: 'A string representation of the amount value. This will be

            a decimal number if the currency has decimals. The number

            is not formatted for display purposes (e.g. with locale

            specific thousand separator) and always contains the dot

            `.` character as decimal separator.'
          example: '15.02'
          type: string
        value:
          description: 'The amount value as an integer (int64) represented in

            currency minor units (e.g. 15.02 EUR is represented as the

            value 1502).'
          example: 1502
          type: integer
          format: int64
      required:
      - currency
      - stringValue
      - value
    AccountJSONPatchRemovePaymentOptionsInitiatorId:
      description: Remove the InitiatorId from payment options.
      type: object
      properties:
        op:
          type: string
          enum:
          - remove
        path:
          type: string
          enum:
          - /paymentOptions/initiatorId
      additionalProperties: false
      required:
      - op
      - path
    AccountJSONPatchAddPaymentOptionsInstrument:
      description: Add an instrument to payment options.
      type: object
      properties:
        op:
          type: string
          enum:
          - add
        path:
          type: string
          enum:
          - /paymentOptions/instruments/-
        value:
          $ref: '#/components/schemas/Instrument'
      additionalProperties: false
      required:
      - op
      - path
      - value
    BalanceType:
      type: string
      enum:
      - BOOKED
      - BOOKED_ADJUSTED
      - AVAILABLE
      examples:
      - BOOKED
      - BOOKED_ADJUSTED
      - AVAILABLE
    USACHInstrument:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/InstrumentType'
        usAchCompanyId:
          type: string
          description: The US ACH Company ID assigned to the account to initiate US ACH payments.
          example: '1234567890'
        usAchCompanyName:
          type: string
          description: 'Optional US ACH Company Name override. When set, it is used as the debtor name (Dbtr/Nm)

            on outgoing US ACH payments from this account instead of the account holder''s legal name.

            Only used for US ACH payments.

            '
          example: ACME PAYROLL
        usAchImmediateOrigin:
          type: string
          description: 'Optional US ACH Immediate Origin. When set, it populates the Immediate Origin field of the

            NACHA file header instead of the US ACH Company ID. Some banks assign an Immediate Origin

            that is distinct from the Company ID. Only used for US ACH payments.

            '
          example: '1234567890'
      required:
      - type
      - usAchCompanyId
    AccountJSONPatchReplacePaymentOptionsInstrument:
      description: Replace an instrument in payment options.
      type: object
      properties:
        op:
          type: string
          enum:
          - replace
        path:
          type: string
          pattern: ^/paymentOptions/instruments/[0-9]$
        value:
          $ref: '#/components/schemas/Instrument'
      additionalProperties: false
      required:
      - op
      - path
      - value
    CitiWorldlinkInstrument:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/InstrumentType'
        citiWorldlinkId:
          type: string
          description: The WorldLink ID assigned to the account to initiate payments.
          example: '123456789'
      required:
      - type
      - citiWorldlinkId
    AccountJSONPatchReplaceType:
      description: Set account type.
      type: object
      properties:
        op:
          type: string
          enum:
          - replace
        path:
          type: string
          enum:
          - /type
        value:
          $ref: '#/components/schemas/BankAccountType'
      additionalProperties: false
      required:
      - op
      - path
      - value
    UpdatedTimestamp:
      type: string
      format: date-time
      description: Time at which the resource was last updated.
      example: '2022-05-04T18:47:32.213842599Z'
      readOnly: true
    ETag:
      type: string
      description: '[ETag](https://en.wikipedia.org/wiki/HTTP_ETag) based on the

        resource version. This can be passed along in `If-Match` HTTP

        header when updating a resource to perform a conditional

        update.'
      pattern: ^version:\d{1,4}$
      example: version:3
      readOnly: true
      externalDocs:
        url: https://en.wikipedia.org/wiki/HTTP_ETag
    ListResponse:
      type: object
      properties:
        items:
          description: A list of resources.
        nextToken:
          description: 'Pagination token for next page.

            The value will be a non-empty string if there are more resources to be fetched.

            The value will be an empty string if there are no more resources to be fetched.'
          type: string
          example: eyIxIjogIlRoaXMgaXMgYSBkdW1teSBwYWdpbmF0aW9uIHRva2VuLiJ9
        token:
          description: 'The pagination token that was used for this request.

            The value will be an empty string if no `token` query parameter was provided with the request.'
          type: string
          example: eyIwIjogIlRoaXMgaXMgYSBkdW1teSBwYWdpbmF0aW9uIHRva2VuLiJ9
        limit:
          description: The page limit that was used for this request.
          example: 100
          type: integer
      required:
      - items
      - nextToken
      - token
      - limit
    ResourceID:
      type: string
      description: Unique resource identifier.
      minLength: 32
      maxLength: 64
      examples:
      - 2ed9a3ee-60aa-4f9f-a858-2eed4eefbbc8
    InstrumentType:
      type: string
      description: The type of the payment instrument.
      enum:
      - US_ACH
      - CITI_WORLDLINK
      example: CITI_WORLDLINK
    SummaryTransactionsControlData:
      description: 'Control data for all the transactions for the `date` which this summary spans.


        Transactions control data is only included in the response if the requesting principal have authorization scopes `transactions:read`.

        '
      type: object
      properties:
        total:
          description: Total count and sum of absolute amounts of all transactions.
          $ref: '#/components/schemas/ControlData'
        net:
          description: Total count and net amount of all transactions.
          $ref: '#/components/schemas/ControlData'
      required:
      - total
      - net
      examples:
      - total:
          count: 3
          sum:
            currency: EUR
            value: 1234
            stringValue: '12.34'
        net:
          count: 3
          sum:
            currency: EUR
            value: -567
            stringValue: '-5.67'
    MarketCode:
      type: string
      description: Two-letter ISO 3166-1 alpha2 country code.
      example: DE
      minLength: 2
      maxLength: 2
      pattern: ^[A-Z]{2,2}$
    Date:
      type: string
      format: date
      description: '`full-date` notation as defined by [RFC 3339, section 5.6](https://datatracker.ietf.org/doc/html/rfc3339#section-5.6), for example, `2017-07-21`.'
      example: '2022-05-07'
    AccountReportingSummary:
      type: object
      description: 'A summary of account reporting data for a specific reporting period, e.g. a booked date.

        '
      properties:
        id:
          $ref: '#/components/schemas/ResourceID'
          readOnly: true
        organizationId:
          $ref: '#/components/schemas/OrganizationID'
          readOnly: true
        accountId:
          $ref: '#/components/schemas/ResourceID'
          readOnly: true
        type:
          type: string
          enum:
          - BOOKED
          readOnly: true
        date:
          description: Booked date.
          $ref: '#/components/schemas/Date'
          example: '2025-05-01'
          readOnly: true
        transactionsControlData:
          allOf:
          - $ref: '#/components/schemas/SummaryTransactionsControlData'
          readOnly: true
        version:
          $ref: '#/components/schemas/ResourceVersion'
          readOnly: true
        etag:
          x-atlar-fields-enum-skip: true
          $ref: '#/components/schemas/ETag'
          readOnly: true
      required:
      - id
      - organizationId
      - accountId
      - type
      - date
      - version
      - etag
    Balance:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/ResourceID'
        accountId:
          $ref: '#/components/schemas/ResourceID'
          description: Account ID.
        organizationId:
          $ref: '#/components/schemas/OrganizationID'
        type:
          $ref: '#/components/schemas/BalanceType'
          readOnly: true
        reportedType:
          $ref: '#/components/schemas/BalanceReportedType'
          readOnly: true
        amount:
          $ref: '#/components/schemas/Amount'
          readOnly: true
        localDate:
          description: Local date in the timezone associated with the account/bank.
          $ref: '#/components/schemas/Date'
          readOnly: true
        timestamp:
          description: Timestamp of when the balance entry was recorded on the account. This timestamp is reported in UTC and thus the date component of this timestamp may be different than `localDate`.
          example: '2023-04-25T15:01:13.738861011Z'
          type: string
          format: date-time
          readOnly: true
        created:
          description: Timestamp of when the balance entry was created in Atlar. This is distinct from `timestamp`, which reflects when the balance was recorded on the account by the bank. For example, an end-of-day balance may have a `timestamp` of 23:59 but be `created` the following day when the bank statement was delivered to Atlar.
          $ref: '#/components/schemas/CreatedTimestamp'
          readOnly: true
        version:
          $ref: '#/components/schemas/ResourceVersion'
          readOnly: true
      required:
      - id
      - accountId
      - organizationId
      - type
      - reportedType
      - amount
      - localDate
      - timestamp
      - created
      - version
      examples:
      - id: 6eeb63bb-99cc-44e2-9558-202572bfe403
        accountId: 31d593d7-fff9-4783-aa1d-92acb7b21a19
        organizationId: 52dce1f7-7a38-4875-9058-f586a82d43e9
        type: BOOKED
        reportedType: CLOSE
        amount:
          currency: EUR
          value: 12345
          stringValue: '123.45'
        timestamp: '2022-05-04T18:31:12.889104898Z'
        created: '2022-05-05T02:00:00.000000000Z'
        localDate: '2022-05-04'
        version: 1
    RoutingIdentifier:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/RoutingIdentifierType'
        number:
          type: string
          description: The form of the routing number depends on `type`. E.g. for `BIC` the value should be an 8 or 11 character BIC/SWIFT code. For `GB_DSC` (UK domestic routing) the value should be a six digit sort code.
          minLength: 1
          maxLength: 255
        invalid:
          type: boolean
          description: Will be `true` if the routing identifier is invalid according to Atlar validation rules.
          readOnly: true
        constraints:
          $ref: '#/components/schemas/RoutingConstraints'
      required:
      - type
      - number
      examples:
      - type: BIC
        number: BUKBGB22
      - type: US_ABA
        number: '123456789'
      - type: DE_BLZ
        number: '12345678'
      - type: SE_SBA
        number: '9960'
      - type: BIC
        number: '123'
        invalid: true
    RoutingConstraints:
      description: Constraints on a `RoutingIdentifier`.
      type: object
      properties:
        accountNumberType:
          $ref: '#/components/schemas/AccountIdentifierType'
          x-go-type-skip-optional-pointer: true
        scheme:
          type: string
    AccountIdentifierType:
      type: string
      enum:
      - IBAN
      - NUMBER
      - ADYEN
      - AU_BPAY_BILLER_CODE
      - DK_FIK
      - INVESTMENT_NUMBER
      - NATIONAL_ID_NUMBER
      - PAYPAL
      - PROPRIETARY
      - SE_BANKGIRO
      - SE_PLUSGIRO
      - SOLDO
      - WALLET_ADYEN_BALANCE_PLATFORM
      - WALLET_AIRWALLEX
      - WALLET_AIRWALLEX_NUMBER
      - WALLET_CURRENCYCLOUD
      - WALLET_FLASH_PAYMENTS
      - WALLET_FREEMARKET
      - WALLET_HYPERWALLET
      - WALLET_INPAY
      - WALLET_LEAD
      - WALLET_MERCURY
      - WALLET_MONEYCORP
      - WALLET_PAYHAWK
      - WALLET_REVOLUT
      - WALLET_SKRILL
      - WALLET_STRIPE
      - WALLET_SWISSQUOTE
      - WALLET_UNIT
      description: 'Account Identifier type. Choose among:

        <ul>

        <li><code>IBAN</code> — IBAN</li>

        <li><code>NUMBER</code> — Account number</li>

        <li><code>ADYEN</code> — Adyen identifier</li>

        <li><code>AU_BPAY_BILLER_CODE</code> — Australian BPAY Biller Code</li>

        <li><code>DK_FIK</code> — FIK creditor number</li>

        <li><code>INVESTMENT_NUMBER</code> — Investment number</li>

        <li><code>NATIONAL_ID_NUMBER</code> — National Identification Number</li>

        <li><code>PAYPAL</code> — PayPal wallet identifier</li>

        <li><code>PROPRIETARY</code> — Proprietary identifier</li>

        <li><code>SE_BANKGIRO</code> — <a href="https://www.bankgirot.se/en/">Bankgiro number</a></li>

        <li><code>SE_PLUSGIRO</code> — <a href="https://www.nordea.se/foretag/produkter/betala/plusgirot.html">Plusgiro number</a></li>

        <li><code>SOLDO</code> — Soldo entity identifier</li>

        <li><code>WALLET_ADYEN_BALANCE_PLATFORM</code> — Adyen balance platform wallet identifier</li>

        <li><code>WALLET_AIRWALLEX</code> — Airwallex wallet identifier</li>

        <li><code>WALLET_AIRWALLEX_NUMBER</code> — Airwallex account number</li>

        <li><code>WALLET_CURRENCYCLOUD</code> — Currencycloud wallet identifier</li>

        <li><code>WALLET_FLASH_PAYMENTS</code> — Flash Payments wallet identifier</li>

        <li><code>WALLET_FREEMARKET</code> — Freemarket wallet identifier</li>

        <li><code>WALLET_HYPERWALLET</code> — Hyperwallet wallet identifier</li>

        <li><code>WALLET_INPAY</code> — Inpay account identifier</li>

        <li><code>WALLET_LEAD</code> — Lead wallet identifier</li>

        <li><code>WALLET_MERCURY</code> — Mercury wallet identifier</li>

        <li><code>WALLET_MONEYCORP</code> — Moneycorp wallet identifier</li>

        <li><code>WALLET_PAYHAWK</code> — Payhawk wallet identifier</li>

        <li><code>WALLET_REVOLUT</code> — Revolut wallet identifier</li>

        <li><code>WALLET_SKRILL</code> — Skrill wallet identifier</li>

        <li><code>WALLET_STRIPE</code> — Stripe wallet identifier</li>

        <li><code>WALLET_SWISSQUOTE</code> — Swissquote wallet identifier</li>

        <li><code>WALLET_UNIT</code> — Unit wallet identifier</li>

        </ul>

        For further information please refer to <a href="https://docs.atlar.com/v2.0/docs/payment-details#account-identifiers">Account Identifiers</a>'
      example: IBAN
    PaymentOptions:
      type: object
      properties:
        instruments:
          type: array
          x-omitempty: true
          items:
            $ref: '#/components/schemas/Instrument'
        initiatorId:
          type: string
        disabled:
          type: boolean
          description: When true, initiating credit transfers from this account is blocked.
          readOnly: true
    AccountJSONPatchRemoveAlias:
      description: Remove alias.
      type: object
      properties:
        op:
          type: string
          enum:
          - remove
        path:
          type: string
          enum:
          - /alias
      additionalProperties: false
      required:
      - op
      - path
    BalanceReportedType:
      type: string
      enum:
      - OPEN
      - CLOSE
      - INTERIM
      examples:
      - OPEN
      - CLOSE
    AccountJSONPatchReplacePaymentOptionsInitiatorId:
      description: Set the InitiatorId for payment options.
      type: object
      properties:
        op:
          type: string
          enum:
          - replace
        path:
          type: string
          enum:
          - /paymentOptions/initiatorId
        value:
          type: string
          minLength: 1
          maxLength: 255
      additionalProperties: false
      required:
      - op
      - path
      - value
    ErrorDetails:
